packages:
  - packages/*
  - packages/plugins/**
  - packages/servers/*
  - packages/utils/*
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - '@sentry/cli'
# allowBuilds replaces onlyBuiltDependencies in pnpm >=10.29 and pnpm 11.
allowBuilds:
  '@swc/core': true
  esbuild: true
  '@sentry/cli': true
