packages:
  - packages/*
  - packages/plugins/**
  - packages/servers/*
  - packages/utils/*
  - packages/ides/*
  # The journey fixture app's local plugin, linked into its dev server as workspace:*.
  - apps/journey-fixture/plugins/*

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@swc/core'
  - better-sqlite3
  - esbuild

# allowBuilds replaces onlyBuiltDependencies in pnpm >=10.29 and pnpm 11.
allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true

overrides:
  better-sqlite3: 12.11.1
  # Keep transitive copies on the patched releases the direct dependencies pin.
  '@hono/node-server@<2': ^1.19.15
  dompurify: 3.4.17
  hono: 4.13.14
  js-yaml@<4: ^3.15.2
  js-yaml@>=4 <5: ^4.3.2
  postcss: 8.5.23
  # Lift transitive copies onto the first release of their major that fixes a security
  # advisory. Each lower bound is that release; the range stays inside the parent's major.
  '@babel/runtime@>=7 <7.26.10': ^7.26.10
  '@tootallnate/once@>=2 <2.0.1': ^2.0.1
  '@xhmikosr/decompress@>=11 <11.1.4': ^11.1.4
  body-parser@>=2 <2.4.0: ^2.4.0
  baseline-browser-mapping@>=2 <2.11.0: ^2.11.0
  brace-expansion@>=1 <1.1.21: ^1.1.21
  brace-expansion@>=2 <2.1.7: ^2.1.7
  brace-expansion@>=5 <5.0.12: ^5.0.12
  braces@>=3 <3.0.3: ^3.0.3
  browserslist@>=4 <4.28.7: ^4.28.7
  cross-spawn@>=7 <7.0.5: ^7.0.5
  crypto-js@>=4 <4.2.0: ^4.2.0
  diff@>=5 <5.2.2: ^5.2.2
  es5-ext@>=0.10 <0.10.63: ^0.10.63
  fast-uri@>=3 <3.1.8: ^3.1.8
  fflate@>=0.4 <0.4.9: ^0.4.9
  flatted@>=3 <3.4.2: ^3.4.2
  follow-redirects@>=1 <1.16.1: ^1.16.1
  form-data@>=4 <4.0.6: ^4.0.6
  ip@>=2 <2.0.1: ^2.0.1
  ip-address@>=10 <10.7.1: ^10.7.1
  jws@>=3 <3.2.3: ^3.2.3
  jws@>=4 <4.0.1: ^4.0.1
  lodash@>=4 <4.18.0: ^4.18.0
  mermaid@>=11 <11.16.1: ^11.16.1
  minimatch@>=3 <3.1.3: ^3.1.3
  minimatch@>=5 <5.1.8: ^5.1.8
  minimatch@>=9 <9.0.7: ^9.0.7
  nodemailer@>=10 <10.1.4: ^10.1.7
  nanoid@>=3 <3.3.18: ^3.3.18
  picomatch@>=2 <2.3.2: ^2.3.2
  piscina@>=4 <4.9.4: ^4.9.4
  postcss-selector-parser@>=6.1 <6.1.3: ^6.1.3
  prismjs@>=1 <1.30.0: ^1.30.0
  proxy-addr@>=2 <2.0.8: ^2.0.8
  qs@>=6 <6.16.0: ^6.16.0
  serialize-javascript@>=6 <6.0.2: ^6.0.2
  source-map-js@>=1 <1.2.2: ^1.2.2
  tar-fs@>=2 <2.1.4: ^2.1.4
  tmp@>=0.2 <0.2.6: ^0.2.6
  underscore@>=1 <1.13.8: ^1.13.8
  undici@>=6 <6.28.1: ^6.28.1
  undici@>=7 <7.30.1: ^7.30.1
  word-wrap@>=1 <1.2.4: ^1.2.4
  zod@>=4 <4.6.6: ^4.6.6
  # @lowdefy/build only loads twrnc/create, which never imports react-native. Its react-native
  # peer otherwise pulls in a react-native bound to the build's React 18, a second copy that
  # pnpm's hidden hoist can hand to native test tooling.
  twrnc>react-native: '-'

packageExtensions:
  echarts-for-react:
    dependencies:
      tslib: '*'
  # The preset maps every `react-native` import to require.resolve('react-native') from its own
  # folder but does not declare it, so pnpm resolved it through the hidden hoist to whichever
  # react-native instance won, sometimes one bound to the web packages' React. As a peer it gets
  # the test package's own react-native and React.
  '@react-native/jest-preset':
    peerDependencies:
      react-native: '*'

patchedDependencies:
  buffer-equal-constant-time@1.0.1: patches/buffer-equal-constant-time@1.0.1.patch
