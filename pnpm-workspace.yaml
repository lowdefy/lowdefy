packages:
  - packages/*
  - packages/plugins/**
  - packages/servers/*
  - packages/utils/*
  - packages/ides/*

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@swc/core'
  - better-sqlite3
  - esbuild

# allowBuilds replaces onlyBuiltDependencies in pnpm >=10.29 and pnpm 11.
allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true

overrides:
  better-sqlite3: 12.11.1
  # Keep transitive copies on the patched releases the direct dependencies pin.
  '@hono/node-server@<2': ^1.19.15
  dompurify: 3.4.13
  hono: 4.13.5
  js-yaml@<4: ^4.3.2
  js-yaml@>=4 <5: ^4.3.2
  postcss: 8.5.23

packageExtensions:
  echarts-for-react:
    dependencies:
      tslib: '*'

patchedDependencies:
  buffer-equal-constant-time@1.0.1: patches/buffer-equal-constant-time@1.0.1.patch
