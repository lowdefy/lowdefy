packages:
  - packages/*
  - packages/plugins/**
  - packages/servers/*
  - packages/utils/*
  - packages/ides/*

onlyBuiltDependencies:
  - '@sentry/cli'
  - '@swc/core'
  - better-sqlite3
  - esbuild

# allowBuilds replaces onlyBuiltDependencies in pnpm >=10.29 and pnpm 11.
allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true

overrides:
  better-sqlite3: 12.11.1

packageExtensions:
  echarts-for-react:
    dependencies:
      tslib: '*'

patchedDependencies:
  buffer-equal-constant-time@1.0.1: patches/buffer-equal-constant-time@1.0.1.patch
