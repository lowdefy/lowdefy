env:
  node: true
  es6: true
  jest: true
  browser: true
settings:
  import/resolver: node
extends:
  - eslint:recommended
  - plugin:react/recommended
  - plugin:import/errors
  - plugin:import/warnings
  - plugin:prettier/recommended

plugins:
  - import
  - jsx-a11y
  - prettier
  - react
  - react-hooks
rules:
  prettier/prettier: error
  no-console: warn
  no-underscore-dangle: 'off'
  no-param-reassign: warn
  no-nested-ternary: warn
  no-unused-vars:
    - error
    - args: after-used
      argsIgnorePattern: '^_'
      varsIgnorePattern: '^_'
      # Destructure-to-omit, e.g. `const { drop, ...rest } = obj` — `drop` is
      # intentionally pulled out to exclude it from `rest`.
      ignoreRestSiblings: true
  react/display-name: 'off'
  react/jsx-filename-extension: 'off'
  react/prop-types: 'off'
  react/jsx-curly-newline: 'off'
  react/jsx-one-expression-per-line: 'off'
  react/no-array-index-key: 'off'
  react/jsx-wrap-multilines: 'off'
  react/jsx-indent: 'off'
  react/jsx-props-no-spreading: warn
  react/destructuring-assignment: 'off'
  jsx-a11y/anchor-is-valid: 'off'
  jsx-a11y/click-events-have-key-events: 'off'
  jsx-a11y/no-static-element-interactions: 'off'
  import/extensions:
    - error
    - ignorePackages
  import/no-unresolved:
    - error
    # Because of https://github.com/import-js/eslint-plugin-import/issues/1868
    - ignore:
        - "^@lowdefy\/.*$"
parserOptions:
  sourceType: module
  ecmaVersion: latest
overrides:
  # Server packages import build-time generated artifacts (../build/*) and
  # runtime deps that ship exports maps the legacy import resolver can't
  # follow, so unresolved-import checks only produce false positives there.
  - files:
      - 'packages/servers/**/*.js'
      - 'packages/servers/**/*.jsx'
    rules:
      import/no-unresolved: 'off'
  # Playwright e2e tests
  - files:
      - '**/*.e2e.spec.js'
    extends:
      - plugin:playwright/recommended
    rules:
      # Disable import/named as eslint-plugin-import can't resolve Playwright's TypeScript exports
      import/named: 'off'
      # Assertions are also made through the @lowdefy/e2e-utils expect* helpers and through a block
      # helper's expect namespace (blockHelper.expect.value(...)), both of which wrap the expect()
      # call. The rule only sees the last identifier of the callee, so the block helper assertion
      # names have to be listed by name.
      playwright/expect-expect:
        - warn
        - assertFunctionPatterns:
            - '^expect'
          assertFunctionNames:
            - closed
            - dateDisabled
            - dateEnabled
            - endValue
            - noPresets
            - placeholder
            - presetDisabled
            - presetEnabled
            - presetLabelHtml
            - presetLabels
            - startValue
            - value
  # Playwright e2e utilities and block helpers
  - files:
      - 'packages/utils/e2e-utils/src/**/*.js'
      - 'packages/plugins/blocks/*/src/blocks/*/e2e.js'
    rules:
      import/named: 'off'
