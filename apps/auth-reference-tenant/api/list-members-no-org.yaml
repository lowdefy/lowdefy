# Phase-8 error demo: an org-scoped step run without organizationId under
# the tenant policy is a runtime error naming the fix - there is no pinned
# organization to default to. Pass an explicit organizationId (what a
# multi-tenant admin module does) to make the same step succeed.
id: list-members-no-org
type: Api
routine:
  - id: list_members
    type: ListMembers
    properties:
      limit: 10
      organizationId:
        _payload: organizationId
  - ':return':
      _step: list_members
