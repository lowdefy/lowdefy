# The landing page the magic-link email points at (auth.authPages.magicLink).
# The email carries the token in the URL fragment, which no browser sends, so
# the page reads it with _url_hash, and MagicLinkVerify posts it on a click.
id: magic-link
type: Box
properties:
  style:
    maxWidth: 480
    margin: 60px auto
blocks:
  - id: magic_link_result
    type: Result
    properties:
      status:
        _if:
          test:
            _eq:
              - _url_hash: token
              - null
          then: warning
          else: info
      title: Sign in
      subTitle:
        _if:
          test:
            _eq:
              - _url_hash: token
              - null
          then: This link carries no sign-in token. Ask for a new link from the login page.
          else: Click the button below to finish signing in.
    areas:
      extra:
        blocks:
          - id: magic_link_verify_button
            type: Button
            visible:
              _ne:
                - _url_hash: token
                - null
            properties:
              title: Sign in
            events:
              onClick:
                - id: verify
                  type: MagicLinkVerify
