# Gated on the owner app role (auth.pages.roles), which the owner of a new
# organization holds through auth.organizations.creatorAppRoles.
id: owner-settings
type: Box
properties:
  style:
    maxWidth: 640
    margin: 60px auto
blocks:
  - id: owner_settings_title
    type: Title
    properties:
      content: Owner settings (owner app role)
      level: 2
  - id: owner_settings_body
    type: Html
    properties:
      html: <p>Only members holding the owner app role open this page.</p>
