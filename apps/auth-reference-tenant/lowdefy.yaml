name: auth-reference-tenant
lowdefy: local

# Multi-tenant deployment of the auth-reference suite (auth-upgrade phase
# 3): the tenant policy. An organization is a business, never a personal
# workspace - a fresh signup mints its own organization lazily at first
# session (as owner, set active); an invited signup joins the inviter's
# tenant and mints nothing. Inherently open signup; the signup key does not
# apply. Uses its own database so tenants do not mix with the pinned apps.
# See ../auth-reference/README.md for the walkthrough.

auth:
  database:
    id: auth_db
    type: MongoDBAuthAdapter
    properties:
      uri:
        _secret: TENANT_DATABASE_URI

  secret:
    _secret: BETTER_AUTH_SECRET

  emailAndPassword:
    enabled: true
    # Lazy creation means no tenants for abandoned signups: an unverified
    # signup never reaches session.create, so no org is minted until a
    # login completes.
    requireEmailVerification: true
    minPasswordLength: 8

  magicLink:
    enabled: true
    expiresIn: 300

  # Local dev sending: run Mailpit (see ../auth-reference/README.md) and point
  # the auth_email SMTP connection at it. auth.email only names the connection -
  # the transport, the from address and the delivery filter live on the
  # connection itself.
  email:
    connectionId: auth_email

  # tenant: active org = the user's business, oldest membership when they
  # belong to several; the user switches with SetActiveOrganization.
  organizations:
    policy: tenant
    # 48 hours, unless the build environment sets INVITATION_EXPIRES_IN - the
    # journeys (pnpm test:journeys:auth) set the 60 second minimum so an
    # invitation can expire inside a run. Read at build time, so the value is
    # an ordinary integer the auth schema checks.
    invitationExpiresIn:
      _build.number.parseInt:
        on:
          _build.if_none:
            - _build.env: INVITATION_EXPIRES_IN
            - '172800'

  pages:
    protected: true
    public:
      - login
      - signup
      - check-email
      - verify-email
      - accept-invitation
      - home

  authPages:
    signIn: /login
    signUp: /signup
    verifyEmail: /verify-email
    # With the origin pinned (BETTER_AUTH_URL), the invitation email links
    # here with the invitation id; unpinned, it carries no link.
    acceptInvitation: /accept-invitation

# The transport auth.email sends through - Mailpit for the walkthrough, or
# the dev server's mail sink for the journeys (pnpm test:journeys:auth sets
# SMTP_PORT to it).
connections:
  - id: auth_email
    type: SMTP
    properties:
      from: auth-reference-tenant@localhost
      host:
        _secret: SMTP_HOST
      port:
        _number.parseInt:
          on:
            _if_none:
              - _secret: SMTP_PORT
              - '1025'
      secure: false

  # App data behind the tenant wall: under policy tenant a MongoDB
  # connection is scoped to the caller's active organization on every read
  # and write, with nothing declared here. The notes page shows it.
  - id: notes
    type: MongoDBCollection
    properties:
      databaseUri:
        _secret: TENANT_DATABASE_URI
      collection: notes
      write: true

# Phase-8 error demos: under the tenant policy there is no single implied
# organization, so _organization fails at evaluation and an org-scoped step
# with no organizationId fails naming the fix.
api:
  - _ref: api/org-info.yaml
  - _ref: api/list-members-no-org.yaml

pages:
  - _ref: pages/home.yaml
  - _ref: pages/login.yaml
  - _ref: pages/signup.yaml
  - _ref: pages/check-email.yaml
  - _ref: pages/verify-email.yaml
  - _ref: pages/accept-invitation.yaml
  - _ref: pages/dashboard.yaml
  - _ref: pages/organizations.yaml
  - _ref: pages/members.yaml
  - _ref: pages/notes.yaml
