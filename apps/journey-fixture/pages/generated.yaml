id: generated
type: Box
# The generate fixture test (packages/servers/server-dev/test/journeyFixture/dataSetGenerate.test.mjs):
# on open, the page counts the invoices of its data set by status and keeps
# the fixture invoice, so a journey can assert generated rows and a fixture.
requests:
  - id: count_invoices
    type: MongoDBAggregation
    connectionId: fixture_db
    properties:
      pipeline:
        - $match:
            kind: invoice
        - $group:
            _id: $status
            count:
              $sum: 1
        - $sort:
            _id: 1
  - id: fixture_invoice
    type: MongoDBFindOne
    connectionId: fixture_db
    properties:
      query:
        _id: invoice-fixture
events:
  onInit:
    - id: load
      type: Request
      params:
        - count_invoices
        - fixture_invoice
    - id: keep
      type: SetState
      params:
        counts:
          _request: count_invoices
        fixture_customer:
          _request: fixture_invoice.customer
blocks:
  - id: generated_title
    type: Title
    properties:
      content: Generated invoices
      level: 2
