# The page whose onMount calls a method on a block of the app's own plugin (FixtureActionChain,
# plugins/walled-fixture), which no headless stand-in models. Its meta declares that `run` fires
# onRun, so the cli fixture tests (packages/cli/test/journeyFixture/headless.test.mjs) see
# `lowdefy test --headless --build` pass the mount journey (tests/journeys/_headless/
# plugin_block.yaml). The stop button calls `stop`, which the meta leaves undeclared, so that
# journey is browser-only at its click. The redraw button calls `redraw`, which the meta declares
# null (it changes only what the block draws), then logs that the call resolved: its parity
# journey (tests/journeys/_parity/plugin_block.yaml) passes in the browser and headless.
id: plugin_block
type: Box
events:
  onMount:
    - id: run_chain
      type: CallMethod
      params:
        blockId: mount_chain
        method: run
blocks:
  - id: plugin_block_title
    type: Title
    properties:
      content: Plugin block
      level: 2
  - id: mount_chain
    type: FixtureActionChain
    events:
      onRun:
        - id: mark_ran
          type: SetState
          params:
            chain_ran: true
      onStop:
        - id: mark_stopped
          type: SetState
          params:
            chain_stopped: true
  - id: stop_chain_button
    type: Button
    properties:
      title: Stop chain
    events:
      onClick:
        - id: stop_chain
          type: CallMethod
          params:
            blockId: mount_chain
            method: stop
  - id: redraw_chain_button
    type: Button
    properties:
      title: Redraw chain
    events:
      onClick:
        - id: redraw_chain
          type: CallMethod
          params:
            blockId: mount_chain
            method: redraw
        - id: log_redrawn
          type: SetState
          params:
            log:
              _array.concat:
                - _if_none: [{ _state: log }, []]
                - - event: mount_chain.redraw
                    payload:
                      _if_none: [{ _actions: redraw_chain.response }, none]
