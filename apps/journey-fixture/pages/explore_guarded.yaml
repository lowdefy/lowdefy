# Public, but its onInit sends everyone home: a journey on it fails at its
# first expect.visible, not at open (pageRoot.test.mjs).
id: explore_guarded
type: Box
events:
  onInit:
    - id: send_home
      type: Link
      params: home
blocks:
  - id: guarded_title
    type: Title
    properties:
      content: Guarded
      level: 2
