# An expected outcome stops an action without being an app error: a journey
# that clicks these passes, except bad_payload_button, a config fault
# (appErrors.test.mjs in packages/servers/server-dev/test/journeyFixture).
id: app_errors
type: Box
blocks:
  - id: app_errors_title
    type: Title
    properties:
      content: App errors
      level: 2
  # Throw raises a UserError, the app saying no on purpose.
  - id: throw_button
    type: Button
    properties:
      title: Throw
    events:
      onClick:
        - id: throw_expected
          type: Throw
          params:
            throw: true
            message: Expected outcome
  # Calls auditor_only, which the endpoint's auth gate refuses to anyone but
  # an auditor.
  - id: auditor_button
    type: Button
    properties:
      title: Auditor only
    events:
      onClick:
        - id: call_auditor_only
          type: CallAPI
          params:
            endpointId: auditor_only
  # Says how auditor_only answered, so a test can tell a refusal from a pass.
  - id: auditor_status
    type: Paragraph
    visible:
      _ne:
        - _api: auditor_only
        - null
    properties:
      content:
        _if:
          test:
            _eq:
              - _api: auditor_only.success
              - true
          then: Admitted
          else: Refused
  # Sends typed_order a quantity its payloadSchema refuses: the page's own
  # config built the payload, so the refusal is a ConfigError, not a UserError.
  - id: bad_payload_button
    type: Button
    properties:
      title: Bad payload
    events:
      onClick:
        - id: call_typed_order
          type: CallAPI
          params:
            endpointId: typed_order
            payload:
              quantity: two
