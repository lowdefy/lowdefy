# Shows a block to the data set user u_admin only: one journey with a list of
# users passes as admin and fails as member, so each persona run is seen to
# run as its own user (packages/cli/test/journeyFixture/personas.test.mjs).
id: personas
type: Box
blocks:
  - id: personas_title
    type: Title
    properties:
      content: Personas
      level: 2
  - id: admin_panel
    type: Title
    visible:
      _eq:
        - _user: id
        - u_admin
    properties:
      content: Admin panel
      level: 4
