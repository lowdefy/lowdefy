id: timing
type: Box
# The step timing fixture tests (packages/servers/server-dev/test/journeyFixture/timing.test.mjs):
# a request the page calls on open, a button that calls nothing, a block that
# renders a moment after the click that reveals it, and a lazy block revealed
# the same way.
requests:
  - id: load_items
    type: MongoDBFind
    connectionId: fixture_db
    properties:
      query:
        kind: timing
  - id: save_timing
    type: MongoDBInsertOne
    connectionId: fixture_db
    properties:
      doc:
        kind: timing
events:
  onInit:
    - id: load
      type: Request
      params: load_items
blocks:
  - id: timing_title
    type: Title
    properties:
      content: Step timing
      level: 2
  - id: noop_button
    type: Button
    properties:
      title: Do nothing
    events:
      onClick:
        - id: set_noop
          type: SetState
          params:
            noop: true
  - id: save_timing_button
    type: Button
    properties:
      title: Save
    events:
      onClick:
        - id: save
          type: Request
          params: save_timing
  # Trailing-edge debounce longer than the settle after a click (capped at the
  # journey timeout, 1500 ms in the test): the next step starts while the late
  # row is not yet in the page at all.
  - id: reveal_button
    type: Button
    properties:
      title: Reveal
    events:
      onClick:
        debounce:
          ms: 2000
        try:
          - id: set_late_rows
            type: SetState
            params:
              late_rows:
                - label: Late
  # The row's button sits on top of a tall paragraph: a click at the row's
  # centre lands on the paragraph and misses the button.
  - id: late_rows
    type: List
    blocks:
      - id: late_rows.$.row
        type: Box
        blocks:
          - id: late_rows.$.button
            type: Button
            properties:
              title: Late
            events:
              onClick:
                - id: set_late_clicked
                  type: SetState
                  params:
                    late_clicked: true
          - id: late_rows.$.spacer
            type: Paragraph
            properties:
              content: Below the late button.
              style:
                minHeight: 300px
  # A lazy block (Table loads its code on first mount) revealed after the next
  # step has started: the trailing-edge debounce is longer than the settle
  # after a click at the default 5s step timeout, and the reveal waits on a
  # request. Its wrapper and fallback show before its controls do, so a click
  # on the block must wait for the implementation before it picks a control.
  - id: reveal_table_button
    type: Button
    properties:
      title: Reveal table
    events:
      onClick:
        debounce:
          ms: 5500
        try:
          - id: load_for_table
            type: Request
            params: load_items
          - id: show_late_table
            type: SetState
            params:
              show_late_table: true
  - id: late_table
    type: Table
    visible:
      _eq:
        - _state: show_late_table
        - true
    properties:
      headerMenu: false
      reorderable: false
      columns:
        - key: actions
          type: buttons
          title: ''
          width: 96
          sortable: false
          cell:
            buttons:
              - eventName: onPick
                title: Pick
        - key: name
          title: Name
          sortable: false
      data:
        - _id: t1
          name: Late row
    events:
      onPick:
        - id: set_table_picked
          type: SetState
          params:
            late_table_picked: true
