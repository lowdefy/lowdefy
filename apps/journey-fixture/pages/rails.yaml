# The page the data-set rails test drives
# (packages/servers/server-dev/test/journeyFixture/rails.test.mjs): on a
# data-set journey a click on external_button (a request on an AxiosHttp
# connection, whose type declares dataSet: external) is refused, and
# save_rail_button (a request on the data set's MongoDB connection, whose type
# declares dataSet: redirect) works. The auth rail acts at runtime:
# logout_button runs Logout, so its click fails, while skipped_logout_button's
# Logout is skipped (nothing in state allows it), so its click passes.
# rails_modal's OK button sits in the modal's portal, outside every block
# wrapper; its onOk calls a request on rails_undeclared (a connection type that
# declares no dataSet), so a click on { blockId: rails_modal, control: ok } is
# refused as the modal's. rails_dropdown's item does the same, and its
# onOpenChange sets rails_dropdown_opened: the rails refuse the click before the
# runner opens the dropdown to show the item, so the state is never set.
# The rails check open, fill and select steps the same way: rails_menu's
# onOpenChange sets rails_menu_opened and then calls the undeclared request, so
# an open is refused before it hovers the menu and the state is never set;
# rails_fill_input's and rails_selector's onChange call it too, so a fill or a
# select is refused before it types or picks, a select on rails_choice_box (the
# container around rails_selector) as rails_selector's.
id: rails
type: Box
requests:
  - id: call_external
    type: AxiosHttp
    connectionId: rails_external
    properties:
      url: /hook
  - id: call_undeclared
    type: UndeclaredFixtureEcho
    connectionId: rails_undeclared
    properties:
      value: rails
  - id: save_rail_item
    type: MongoDBInsertOne
    connectionId: fixture_db
    properties:
      doc:
        kind: item
        page: rails
blocks:
  - id: rails_title
    type: Title
    properties:
      content: Rails
      level: 2
  - id: external_button
    type: Button
    properties:
      title: Call external
    events:
      onClick:
        - id: call_external
          type: Request
          params: call_external
  - id: logout_button
    type: Button
    properties:
      title: Sign out
    events:
      onClick:
        - id: sign_out
          type: Logout
  - id: skipped_logout_button
    type: Button
    properties:
      title: Sign out if allowed
    events:
      onClick:
        - id: set_logout_checked
          type: SetState
          params:
            logout_checked: true
        - id: skipped_sign_out
          type: Logout
          skip:
            _ne:
              - _state: allow_logout
              - true
  - id: logout_checked_alert
    type: Alert
    visible:
      _eq:
        - _state: logout_checked
        - true
    properties:
      type: info
      message: Logout skipped
  - id: save_rail_button
    type: Button
    properties:
      title: Save rail item
    events:
      onClick:
        - id: save_rail_item
          type: Request
          params: save_rail_item
        - id: set_rail_saved
          type: SetState
          params:
            rail_saved: true
  - id: rail_saved_alert
    type: Alert
    visible:
      _eq:
        - _state: rail_saved
        - true
    properties:
      type: success
      message: Rail item saved
  - id: open_rails_modal_button
    type: Button
    properties:
      title: Open rails modal
    events:
      onClick:
        - id: open_rails_modal
          type: CallMethod
          params:
            blockId: rails_modal
            method: setOpen
            args:
              - open: true
  - id: rails_modal
    type: Modal
    properties:
      title: Call the undeclared service?
    events:
      onOk:
        - id: call_undeclared
          type: Request
          params: call_undeclared
    blocks:
      - id: rails_modal_body
        type: Paragraph
        properties:
          content: Its OK button calls a request a data set cannot redirect.
  - id: rails_dropdown
    type: DropdownButton
    properties:
      title: Rails actions
      items:
        - title: Call undeclared
          eventName: onCallUndeclared
    events:
      onOpenChange:
        - id: set_rails_dropdown_opened
          type: SetState
          params:
            rails_dropdown_opened: true
      onCallUndeclared:
        - id: call_undeclared_from_dropdown
          type: Request
          params: call_undeclared
  - id: rails_menu
    type: DropdownMenu
    properties:
      links:
        - id: rails_menu_settings
          type: MenuLink
          properties:
            title: Settings
    events:
      onOpenChange:
        - id: set_rails_menu_opened
          type: SetState
          params:
            rails_menu_opened: true
        - id: call_undeclared_on_open
          type: Request
          params: call_undeclared
    blocks:
      - id: rails_menu_label
        type: Button
        properties:
          title: Rails menu
  - id: rails_fill_input
    type: TextInput
    properties:
      title: Rails note
    events:
      onChange:
        - id: call_undeclared_on_fill
          type: Request
          params: call_undeclared
  # A container: a select on it picks in rails_selector, so the rails check rails_selector.
  - id: rails_choice_box
    type: Box
    blocks:
      - id: rails_selector
        type: Selector
        properties:
          title: Rails choice
          options:
            - First
            - Second
        events:
          onChange:
            - id: call_undeclared_on_select
              type: Request
              params: call_undeclared
