# An endpoint whose routine marks a credential with _credential, as an app marks a signing secret
# it derives (tests/journeys/_headless/credential.yaml). A server marks it in the request's
# credential scope; a headless journey runs each call in a scope of its own, as the server runs
# each request, on a build (packages/utils/journey-headless/test/fixture/outside.test.mjs) and on
# the dev server (packages/servers/server-dev/test/journeyFixture/headlessHost.test.mjs).
id: mark_credential
type: Api
routine:
  - id: record
    type: MongoDBInsertOne
    connectionId: fixture_db
    properties:
      doc:
        _id: credential
        kind: credential
        token:
          _credential:
            _secret: FIXTURE_CREDENTIAL
  - ':return':
      token:
        _credential:
          _secret: FIXTURE_CREDENTIAL
