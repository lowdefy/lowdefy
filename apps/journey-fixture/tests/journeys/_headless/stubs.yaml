# A journey's stubs: an answer stub stands in for the rate service (api/price_run.yaml), and fail
# gates fail a write once, twice (times: 2) and every time (times: all). The first price write fails
# and its retry writes the stubbed rate; the first two approvals fail and the third claims the run;
# every activity write fails. expect.error reads each forced message from the server's record of the
# call, and expect.sunk the rate requests, stubbed ones included. Run by `lowdefy test --headless
# --build`, the @lowdefy/journey-headless fixture suite (packages/utils/journey-headless/test/
# fixture/stubs.test.mjs) and the dev server's fixture suite, headless and in a browser
# (packages/servers/server-dev/test/journeyFixture/headlessHost.test.mjs). In a folder starting
# with "_" so the browser suites leave it out.
- name: stubs answer the rate service and fail writes on purpose
  data: stubs
  user: finance
  stubs:
    - connectionType: AxiosHttp
      requestType: AxiosHttp
      endpoint: price_run
      answer: { status: 200, data: { rate: 1.5 } }
    - requestId: save_price
      endpoint: price_run
      fail: Price write failed on purpose
    - requestId: claim_run
      endpoint: approve_run
      fail: Claim failed on purpose
      times: 2
    - requestId: insert_activity
      endpoint: log_activity
      fail: Activity log is down
      times: all
  steps:
    - call: { endpoint: price_run, payload: { id: BR-1, currency: EUR } }
    - expect: { error: Price write failed on purpose }
    - expect: { db: { collection: items, match: { kind: price }, count: 0 } }
    - call: { endpoint: price_run, payload: { id: BR-1, currency: EUR } }
    - expect: { status: 200 }
    - expect:
        db:
          collection: items
          match: { kind: price }
          equals:
            - { run: BR-1, rate: 1.5 }
    - expect: { sunk: { connectionType: AxiosHttp, requestId: fetch_rate, count: 2 } }
    - expect: { sunk: { requestId: fetch_rate, match: { url: /rates, params: { currency: EUR } } } }
    - call: { endpoint: approve_run, payload: { id: BR-1 } }
    - expect: { error: Claim failed on purpose }
    - call: { endpoint: approve_run, payload: { id: BR-1 } }
    - expect: { error: Claim failed on purpose }
    - call: { endpoint: approve_run, payload: { id: BR-1 } }
    - expect: { status: 200 }
    - expect:
        db:
          collection: items
          match: { _id: BR-1, approved_by: u_finance }
          count: 1
    - call: { endpoint: log_activity, payload: { source: first } }
    - expect: { error: Activity log is down }
    - call: { endpoint: log_activity, payload: { source: second } }
    - expect: { error: Activity log is down }
    - expect: { db: { collection: items, match: { kind: activity }, count: 0 } }
