# A routine that marks a credential with _credential runs headless as on a server: each call runs
# in a credential scope of its own (packages/utils/journey-headless/src/createScopedCall.js), on a
# build and on the dev server. In a folder starting with "_" so the browser suites leave it out.
- name: a routine that marks a credential answers
  data: outside
  user: operator
  steps:
    - call: { endpoint: mark_credential }
    - expect: { status: 200 }
    - expect:
        db:
          collection: items
          match: { kind: credential }
          equals:
            - { _id: credential, token: test-secret-FIXTURE_CREDENTIAL }
