# Run headless on the fixture's production build by `lowdefy test --headless --build` in the cli
# fixture tests (packages/cli/test/journeyFixture/headless.test.mjs). pages/plugin_block.yaml's
# onMount calls `run` on a plugin block no headless stand-in models, whose meta declares that
# `run` fires onRun: the first journey passes headless. The second clicks a button that calls
# `stop`, which the meta leaves undeclared: it is browser-only at that click. In a folder starting
# with "_" so the suite's own runs, and harden, leave it out.
- name: runs the plugin block's chain on mount
  pageId: plugin_block
  data: explore
  user: member
  steps:
    - expect: { state: { path: chain_ran, equals: true } }
- name: stops the plugin block's chain
  pageId: plugin_block
  data: explore
  user: member
  steps:
    - click: stop_chain_button
    - expect: { state: { path: chain_stopped, equals: true } }
