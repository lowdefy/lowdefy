# Shaped as Selector options here rather than mapped on the page: the option's own fields are what
# the controls below it read, and `published` is what says whether there is anything to play yet.
id: list_walkthroughs
type: MongoDBAggregation
connectionId: walkthroughs/walkthroughs-collection
properties:
  pipeline:
    - $match:
        retired: null
        deleted.timestamp:
          $exists: false
    - $sort:
        updated.timestamp: -1
    - $project:
        _id: 0
        value: $_id
        published:
          $ne:
            - $ifNull:
                - $published
                - null
            - null
        label:
          $concat:
            - $ifNull:
                - $title
                - $draft.title
                - Untitled walkthrough
            - $cond:
                - $ifNull:
                    - $published
                    - false
                - ''
                - ' (draft)'
