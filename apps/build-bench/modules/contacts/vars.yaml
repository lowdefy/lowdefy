    create-contact: "{{ user.profile.name }} created contact {{ target.name }}"
    update-contact: "{{ user.profile.name }} updated contact {{ target.name }}"
components:
  sidebar_slots:
    _ref:
      path: modules/contacts/sidebar_slots.yaml.njk
      vars:
        ids:
          _var: ids
