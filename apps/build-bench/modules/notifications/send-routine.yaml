  connectionId:
    _module.connectionId:
      id: events-collection
      module: events
  properties:
    pipeline:
      - $match:
          _id:
            $in:
              _payload: event_ids
          type: two-factor-reset
      - $set:
          recipient_id:
            $first: $user_ids
      - $project:
