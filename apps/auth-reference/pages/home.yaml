id: home
type: Box
properties:
  style:
    maxWidth: 640
    margin: 60px auto
blocks:
  - id: home_title
    type: Title
    properties:
      content: Auth reference app
      level: 2
  - id: home_text
    type: Html
    properties:
      html: |
        <p>This page is <b>public</b> - it renders for everyone.</p>
        <ul>
          <li><a href="/dashboard">Dashboard</a> - protected; logged-out visits redirect to the login page.</li>
          <li><a href="/sessions">Sessions</a> - protected; list and revoke your sessions.</li>
          <li><a href="/admin">Admin</a> - role-gated (admin); wrong roles get an opaque /404.</li>
        </ul>
  - id: signed_in_alert
    type: Alert
    visible:
      _ne:
        - _if_none:
            - _user: id
            - null
        - null
    properties:
      type: success
      message:
        _string.concat:
          - 'Signed in as '
          - _user: email
  - id: login_button
    type: Button
    visible:
      _eq:
        - _if_none:
            - _user: id
            - null
        - null
    properties:
      title: Log in
    events:
      onClick:
        - id: to_login
          type: Link
          params:
            pageId: login
  - id: logout_button
    type: Button
    visible:
      _ne:
        - _if_none:
            - _user: id
            - null
        - null
    properties:
      title: Log out
      type: default
    events:
      onClick:
        - id: logout
          type: Logout
