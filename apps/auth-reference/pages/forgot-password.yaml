# Public page (authPages.forgotPassword). RequestPasswordReset is one of the
# four public catalog actions - a locked-out user holds no session. The
# emailed link goes through BetterAuth's reset-password callback endpoint,
# which redirects to redirectTo with ?token=<valid token> appended (or
# ?error=INVALID_TOKEN when the token is dead) - redirectTo is a plain
# string the app authors exactly, pointing at the reset-password page.
id: forgot-password
type: Box
properties:
  style:
    maxWidth: 400
    margin: 60px auto
blocks:
  - id: forgot_title
    type: Title
    properties:
      content: Forgot password
      level: 2
  - id: forgot_email
    type: TextInput
    properties:
      title: Email
  - id: request_reset_button
    type: Button
    properties:
      title: Email me a reset link
      block: true
    events:
      onClick:
        try:
          - id: request_reset
            type: RequestPasswordReset
            params:
              email:
                _state: forgot_email
              redirectTo: /reset-password
          - id: to_check_email
            type: Link
            params:
              pageId: check-email
        catch:
          - id: show_request_error
            type: SetState
            params:
              request_error:
                _actions: request_reset.error.message
  - id: request_error_html
    type: Html
    visible:
      _ne:
        - _state: request_error
        - null
    properties:
      html:
        _nunjucks:
          template: |
            <p style="color:red">{{ error }}</p>
          on:
            error:
              _state: request_error
  - id: back_to_login
    type: Button
    properties:
      title: Back to log in
      type: link
      block: true
    events:
      onClick:
        - id: to_login
          type: Link
          params:
            pageId: login
