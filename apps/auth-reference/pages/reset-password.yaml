# Public page (authPages.resetPassword) - where the emailed reset link
# lands. BetterAuth's callback endpoint appends ?token=<valid token> to the
# redirectTo the forgot-password page requested; an expired or used token
# arrives as ?error=INVALID_TOKEN instead. ResetPassword is public - the
# token is the credential.
id: reset-password
type: Box
properties:
  style:
    maxWidth: 400
    margin: 60px auto
events:
  onInit:
    - id: set_token
      type: SetState
      params:
        token:
          _url_query: token
        token_error:
          _url_query: error
blocks:
  - id: reset_title
    type: Title
    properties:
      content: Reset password
      level: 2
  - id: invalid_token_html
    type: Html
    visible:
      _ne:
        - _state: token_error
        - null
    properties:
      html: |
        <p style="color:red">This reset link is invalid or expired - request
        a new one from the forgot-password page.</p>
  - id: new_password
    type: PasswordInput
    properties:
      title: New password (min 8 characters)
  - id: reset_button
    type: Button
    properties:
      title: Reset password
      block: true
    events:
      onClick:
        try:
          - id: reset_password
            type: ResetPassword
            params:
              newPassword:
                _state: new_password
              token:
                _state: token
          - id: reset_done
            type: SetState
            params:
              reset_success: true
              reset_error: null
        catch:
          - id: show_reset_error
            type: SetState
            params:
              reset_error:
                _actions: reset_password.error.message
  - id: reset_success_html
    type: Html
    visible:
      _eq:
        - _state: reset_success
        - true
    properties:
      html: |
        <p style="color:green">Password reset - log in with the new
        password.</p>
  - id: reset_error_html
    type: Html
    visible:
      _ne:
        - _state: reset_error
        - null
    properties:
      html:
        _nunjucks:
          template: |
            <p style="color:red">{{ error }}</p>
          on:
            error:
              _state: reset_error
  - id: to_login_button
    type: Button
    properties:
      title: Log in
      type: link
      block: true
    events:
      onClick:
        - id: to_login
          type: Link
          params:
            pageId: login
