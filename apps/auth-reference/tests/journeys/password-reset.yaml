- name: a member who forgot their password resets it from the emailed link and signs in with the new one
  pageId: login
  user: none
  timeout: 30000
  steps:
    # A magic link creates the account: sign-up is captcha-gated in this app.
    - fill: { blockId: email, value: reset-member@example.test }
    - click: magic_link_button
    - expect: { url: { contains: /check-email } }
    - email: { to: reset-member@example.test, subject: Your sign-in link }
    - click: { text: Sign in }
    - expect: { url: { contains: /home } }
    # On another device, signed out: the forgot-password page names no
    # redirectTo, so the link lands on authPages.resetPassword.
    - as: locked-out
    - goto: forgot-password
    - fill: { blockId: forgot_email, value: reset-member@example.test }
    - click: request_reset_button
    - expect: { url: { contains: /check-email } }
    - email: { to: reset-member@example.test, subject: Reset your password }
    - click: { text: Reset password }
    - expect: { url: { contains: /reset-password?token= } }
    - fill: { blockId: new_password, value: reset-member-new-password }
    - click: reset_button
    - expect: { visible: reset_success_html }
    - click: to_login_button
    - fill: { blockId: email, value: reset-member@example.test }
    - fill: { blockId: password, value: reset-member-new-password }
    - click: login_button
    - expect: { url: { contains: /home } }
