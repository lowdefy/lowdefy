# Phase-9 floor demo: this endpoint has NO auth.api.roles entry (the id
# deliberately does not match admin-*), so any caller reaches the routine -
# and the step floor still holds: a user-initiated ListMembers refuses a
# caller who holds no member:list authority in the target organization,
# naming the organization. An app can no longer expose member data by
# forgetting an endpoint gate. An admin or owner of org-a gets the member
# list; an anonymous caller is refused for having no caller at all (the step
# is not system: true).
id: list-members-ungated
type: Api
routine:
  - id: list_members_ungated
    type: ListMembers
    properties:
      limit: 100
  - ':return':
      _step: list_members_ungated
