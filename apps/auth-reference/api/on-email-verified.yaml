# Bound to email.verified (see auth.hooks in lowdefy.yaml) - a synthetic
# point backed by BetterAuth's emailVerification.afterEmailVerification
# callback, not a database hook. It fires after the user write, so a hook
# here reacts (or updates explicitly); an inline :return is ignored.
# _payload is { user } - the user whose email just became verified.
#
# No contact match runs here. An email/password signup is unverified when
# its user row is created, so user.create.before can not match it to a
# contact safely, and once the row exists no auth step writes contactId: the
# link is an authorization input, set at creation or by accepting an
# invitation, never afterwards. Such a login gets its link from an
# invitation. _payload.user carries BetterAuth's logical camelCase keys, not
# the snake_case columns - only _user, the resolved caller, reads snake_case.
id: on-email-verified
type: InternalApi
routine:
  - ':try':
      - id: write_audit
        type: MongoDBInsertOne
        connectionId: audit_db
        properties:
          doc:
            event: email.verified
            userId:
              _payload: user.id
            email:
              _payload: user.email
            payloadKeys:
              _object.keys:
                _payload: true
            at:
              _date: now
    ':catch':
      - ':log':
          - 'on-email-verified hook failed to write the audit row'
