# Bound to email.verified (see auth.hooks in lowdefy.yaml) - a synthetic
# point backed by BetterAuth's emailVerification.afterEmailVerification
# callback, not a database hook. It fires after the user write, so a hook
# here reacts (or updates explicitly); an inline :return is ignored.
# _payload is { user } - the user whose email just became verified.
#
# Phase 3: this point carries the merge-on-signup match for email/password
# signups, whose email is unverified at user-create time. The user row
# already exists, so the link is written with the UpdateUserProfile step -
# the sanctioned write path for user.profile and the contactId link alike
# (system: true because a hook routine runs caller-less). An invited user
# whose accept copied a contactId skips the merge (the field is set).
# _payload.user carries BetterAuth's logical camelCase keys, not the
# snake_case columns - only _user, the resolved caller, reads snake_case.
id: on-email-verified
type: InternalApi
routine:
  - ':if':
      _eq:
        - _payload: user.contactId
        - null
    ':then':
      - id: match_contact_on_verified
        type: MongoDBFindOne
        connectionId: contacts_db
        properties:
          query:
            email:
              _payload: user.email
      - ':if':
          _ne:
            - _step: match_contact_on_verified
            - null
        ':then':
          # contactId is a first-class user field, so the step sets it
          # outright - it never joins the profile bag's shallow merge.
          - id: link_contact
            type: UpdateUserProfile
            system: true
            properties:
              userId:
                _payload: user.id
              contactId:
                _step: match_contact_on_verified._id
  - ':try':
      - id: write_audit
        type: MongoDBInsertOne
        connectionId: audit_db
        properties:
          doc:
            event: email.verified
            userId:
              _payload: user.id
            email:
              _payload: user.email
            payloadKeys:
              _object.keys:
                _payload: true
            at:
              _date: now
    ':catch':
      - ':log':
          - 'on-email-verified hook failed to write the audit row'
