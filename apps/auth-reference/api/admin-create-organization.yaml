# Role-gated admin step endpoint (see admin-list-users.yaml for the model).
# No userId in properties, so the caller becomes the creator/owner. A system
# routine (caller-less) would have to pass userId explicitly. Note the new
# org is NOT this deployment's pinned org - switch to it on /organizations
# to act inside it.
id: admin-create-organization
type: Api
routine:
  - id: create_organization
    type: CreateOrganization
    properties:
      name:
        _payload: name
      slug:
        _payload: slug
  - ':return':
      _step: create_organization
