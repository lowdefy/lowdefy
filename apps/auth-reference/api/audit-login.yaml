# Bound to session.create.after (see auth.hooks in lowdefy.yaml).
# _payload is { session, user } - the session just created and its user.
# After hooks are fire-and-forget: the session is already committed, so
# fallible work belongs in :try - a throw here surfaces as an operational
# error on the sign-in call even though the session row exists.
id: audit-login
type: InternalApi
routine:
  # Deliberate throw demo (gate: a throw in an after hook surfaces as an
  # operational error while the committed write stands). Sign in as
  # after-throw@example.test to trigger it.
  - ':if':
      _eq:
        - _payload: user.email
        - after-throw@example.test
    ':then':
      - ':throw': Deliberate after-hook failure for the walkthrough.
  # Phase-6 system-step demo: a hook routine runs caller-less (_user is
  # empty), so an admin step here refuses with the caller-required error
  # unless it sets system: true - an explicit trust decision to run as the
  # system. Delete the system line and log in to see the refusal surface as
  # an operational error on the sign-in call (like the deliberate throw
  # above). Org-scoped steps would also need an explicit organizationId in a
  # system invocation; ListUsers is not org-scoped.
  - id: list_users_system
    type: ListUsers
    system: true
    properties:
      limit: 1
  - ':try':
      - id: write_audit
        type: MongoDBInsertOne
        connectionId: audit_db
        properties:
          doc:
            event: session.create.after
            sessionId:
              _payload: session.id
            userId:
              _payload: session.userId
            email:
              _payload: user.email
            payloadKeys:
              _object.keys:
                _payload: true
            # _user is empty in a hook routine - the caller is the auth
            # engine, not a session user. The subject is in _payload.
            sessionUserIsNone:
              _eq:
                - _user: id
                - null
            # _secret resolves normally in the system context.
            secretResolves:
              _eq:
                - _secret: HOOK_AUDIT_KEY
                - audit-secret-value
            # Written by the system: true ListUsers step above - the row
            # carrying a number proves a caller-less hook routine ran an
            # admin step as the system.
            systemStepUserTotal:
              _step: list_users_system.total
            at:
              _date: now
    ':catch':
      - ':log':
          - 'audit-login hook failed to write the audit row'
