# Bound to user.create.before (see auth.hooks in lowdefy.yaml).
# _payload is { user } - the record BetterAuth is about to write.
# One hook per point, so this endpoint carries both the phase-2 normalize
# scenarios and the phase-3 merge-on-signup match for trusted-provider OAuth
# signups, which arrive with emailVerified true.
id: normalize-signup
type: InternalApi
routine:
  # Veto: a :reject in a before hook aborts the write end to end - no user
  # row is written and the signup call fails with the reject message.
  - ':if':
      _regex:
        pattern: '@blocked\.example$'
        on:
          _payload: user.email
    ':then':
      - ':reject': Signups from blocked.example are not allowed.
  # Merge-on-signup: link a verified new signup to an existing contact
  # rather than duplicating it. Match by verified email only - an unverified
  # match is an account-takeover vector - and only when the user carries no
  # profile.contactId yet, so an invitation-carried link always wins.
  # Email/password signups are unverified here; their match runs at
  # email.verified instead.
  - ':if':
      _and:
        - _eq:
            - _payload: user.emailVerified
            - true
        - _eq:
            - _payload: user.profile.contactId
            - null
    ':then':
      - id: match_contact
        type: MongoDBFindOne
        connectionId: contacts_db
        properties:
          query:
            email:
              _payload: user.email
      # Contacts are created with string _ids (see the contacts page), so
      # the id lands on profile.contactId without ObjectId conversion. A
      # before hook :returns the record with the key set inline - no step
      # needed since the row is not written yet.
      - ':if':
          _ne:
            - _step: match_contact
            - null
        ':then':
          - ':return':
              _object.assign:
                - _payload: user
                - profile:
                    contactId:
                      _step: match_contact._id
  # Replace the record BetterAuth writes - the plain :return value is the
  # new record (the adapter wraps it as { data }).
  - ':if':
      _type:
        type: string
        on:
          _payload: user.name
    ':then':
      - ':return':
          _object.assign:
            - _payload: user
            - name:
                _string.toUpperCase:
                  _payload: user.name
  # No :return - fall through, record written unchanged.
