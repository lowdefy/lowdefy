# Role-gated admin step endpoint (see admin-list-users.yaml for the model).
# No invitation.send hook is bound in this app, so InviteMember dispatches
# the stock template through auth.email (Mailpit). contactId and attributes
# are only forwarded when the payload carries them - accepting the
# invitation stamps contactId onto the user and copies attributes onto the
# minted member row. organizationId is omitted: it defaults to the pinned
# org (org-a here); pass one explicitly to invite into another org.
# Correction semantics (cancelPendingInvitationsOnReInvite): inviting a
# pending email again REPLACES the invitation (new role/attributes/
# contactId; the old accept link dies), so repeat invites stay repeatable.
# resend: true instead re-sends the existing invitation unchanged with a
# refreshed expiry - it never rewrites what was invited.
id: admin-invite-member
type: Api
routine:
  - id: invite
    type: InviteMember
    properties:
      _object.assign:
        - email:
            _payload: email
          role:
            _payload: role
          resend:
            _payload: resend
        - _if:
            test:
              _type:
                type: string
                on:
                  _payload: contactId
            then:
              contactId:
                _payload: contactId
            else: {}
        - _if:
            test:
              _type:
                type: object
                on:
                  _payload: attributes
            then:
              attributes:
                _payload: attributes
            else: {}
  - ':return':
      _step: invite
