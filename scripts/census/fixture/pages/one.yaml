id: one
type: PageHeaderMenu
blocks:
  - id: panel
    type: Html
    properties:
      html: |
        <div class="panel">
          <span>{{ title }}</span>
        </div>
  - id: label
    type: Paragraph
    properties:
      content:
        _js: |
          const esc = (s) => String(s).replace(/&/g, '&amp;');
          return esc(state('title'));
  - id: greeting
    type: Paragraph
    properties:
      content:
        _nunjucks:
          template: Hello {{ name }}
          on:
            _state: true
