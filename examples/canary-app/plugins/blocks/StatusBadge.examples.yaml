- title: Tones
  blocks:
    - id: status_badge_positive
      type: StatusBadge
      properties:
        label: Paid
        tone: positive
    - id: status_badge_negative
      type: StatusBadge
      properties:
        label: Overdue
        tone: negative
    - id: status_badge_neutral
      type: StatusBadge
      properties:
        label: Draft
        tone: neutral

- title: Driven by state
  blocks:
    - id: status_badge_from_state
      type: StatusBadge
      properties:
        label:
          _state: invoice.status
        tone:
          _if:
            test:
              _eq:
                - _state: invoice.status
                - Paid
            then: positive
            else: neutral
