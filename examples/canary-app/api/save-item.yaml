id: save_item
type: Api
payloadSchema:
  type: object
  required: [name, category, quantity]
  additionalProperties: false
  properties:
    name: { type: string, minLength: 1 }
    category: { enum: [hardware, software, service] }
    quantity: { type: integer, minimum: 1 }
responseSchema:
  type: object
  required: [ok]
  properties:
    ok: { type: boolean }
    id: { type: string }
    error: { type: string }
routine:
  - :try:
      - id: insert_item
        type: MongoDBInsertOne
        connectionId: items
        properties:
          doc:
            _id:
              _uuid: true
            name:
              _payload: name
            category:
              _payload: category
            quantity:
              _payload: quantity
            organization_id:
              _user: organization_id
            created_at:
              _date: now
      - :return:
          ok: true
          id:
            _step: insert_item.insertedId
    :catch:
      - :log:
          message: save_item could not insert the item.
        :level: warn
      - :return:
          ok: false
          error: The item could not be saved.
