name: Canary

# Publishes a nightly experimental candidate to npm, installs it from npm into the
# docs app and the example app exactly the way a downstream app does, and runs
# build/check/test against it. A passing nightly candidate is recorded with a
# `canary-green-<version>` tag; the weekly job promotes the newest green candidate
# by moving the `known-good` dist-tag onto it.
#
# A manual run publishes and canaries a candidate as a rehearsal - it never records
# a green tag. Dispatch with `promote: true` to run the weekly promotion by hand.
#
# Setup required before the weekly promotion can run: create an `NPM_TOKEN` secret
# in the `publish` environment with write access to the `@lowdefy` scope. OIDC
# trusted publishing covers `npm publish` only; moving a dist-tag needs a granular
# write token.

on:
  schedule:
    - cron: '15 2 * * *' # nightly candidate + canary
    - cron: '15 4 * * 1' # weekly promotion
  workflow_dispatch:
    inputs:
      promote:
        description: 'Run the weekly known-good promotion instead of a canary run.'
        type: boolean
        default: false

concurrency: canary

jobs:
  # The promotion cron string is compared in three places (publish, record-green,
  # promote). Comparing it inline in each `if` means a schedule change has to be
  # made in three places and a missed one silently flips a job's meaning, so the
  # comparison is made once here and the answer is passed down as job outputs.
  schedule-gate:
    name: Schedule gate
    runs-on: ubuntu-latest
    if: github.repository == 'lowdefy/lowdefy'
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      promote: ${{ steps.gate.outputs.promote }}
      nightly: ${{ steps.gate.outputs.nightly }}
    steps:
      - name: Decide what this run is
        id: gate
        env:
          PROMOTION_CRON: '15 4 * * 1'
          SCHEDULE: ${{ github.event.schedule }}
          PROMOTE_INPUT: ${{ inputs.promote }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          promote=false
          if [ "$SCHEDULE" = "$PROMOTION_CRON" ] || [ "$PROMOTE_INPUT" = "true" ]; then
            promote=true
          fi
          publish=true
          if [ "$promote" = "true" ]; then
            publish=false
          fi
          # A green tag is earned by the nightly cron only - a manual dispatch is a
          # rehearsal and must not feed the weekly promotion.
          nightly=false
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" != "$PROMOTION_CRON" ]; then
            nightly=true
          fi
          {
            echo "publish=$publish"
            echo "promote=$promote"
            echo "nightly=$nightly"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$publish promote=$promote nightly=$nightly"

  publish-candidate:
    name: Publish candidate
    runs-on: ubuntu-latest
    needs: schedule-gate
    # Nightly cron and manual dispatch only; the weekly cron (and a manual
    # promote dispatch) promotes, it does not publish.
    if: needs.schedule-gate.outputs.publish == 'true'
    environment: publish
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm i --frozen-lockfile
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Version the candidate
        run: pnpm release:version-canary

      - name: Read candidate version
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./packages/cli/package.json').version)")
          # With an empty .changeset/ the snapshot versioning is a no-op and the
          # version is the last stable release - publishing (and later promoting)
          # that as a canary candidate would move dist-tags onto stable.
          case "$VERSION" in
            0.0.0-experimental-*) ;;
            *)
              echo "::error::Candidate version \"$VERSION\" is not a snapshot (0.0.0-experimental-*). Are there changesets to version?"
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing candidate $VERSION"

      - name: Publish the candidate
        run: pnpm release:publish-canary
        env:
          NPM_CONFIG_PROVENANCE: 'true'

  canary:
    name: Canary (${{ matrix.app }})
    needs: [schedule-gate, publish-candidate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: docs
            path: packages/docs
          - app: canary-app
            path: examples/canary-app
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      VERSION: ${{ needs.publish-candidate.outputs.version }}
      LOWDEFY_DISABLE_TELEMETRY: '1'
      # Lowdefy reads a `_secret: NAME` reference from the env var LOWDEFY_SECRET_NAME.
      # The example app's journeys and request tests connect to the service MongoDB.
      LOWDEFY_SECRET_MONGODB_URI: mongodb://localhost:27017/canary
      LOWDEFY_SECRET_BETTER_AUTH_SECRET: canary-placeholder-secret-canary-placeholder
      # The docs app declares these secrets on its connections. Placeholder values
      # are enough for build and check; its journeys are not run (no tests/ dir).
      LOWDEFY_SECRET_DISCORD_WEBHOOK: https://discord.com/api/webhooks/0/placeholder
      LOWDEFY_SECRET_UPLOADS_S3_ACCESS_KEY_ID: placeholder
      LOWDEFY_SECRET_UPLOADS_S3_SECRET_ACCESS_KEY: placeholder
      LOWDEFY_SECRET_UPLOADS_S3_REGION: us-east-1
      LOWDEFY_SECRET_UPLOADS_S3_BUCKET: placeholder
    steps:
      - name: Require a candidate version
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::No candidate version was published."
            exit 1
          fi
      - uses: actions/checkout@v4
      # The lowdefy CLI requires pnpm on the PATH for every command (it installs
      # and spawns the app's server directory with pnpm).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Config census
        # The design's corpus metrics (escape-hatch share, files over 80 lines,
        # comment lines carrying a rule) were hand-run once and went stale. This
        # runs the committed scan against the app's own config so every release
        # leaves a dated reading behind. Informational: it never fails the job,
        # and there is no threshold to trip.
        continue-on-error: true
        run: |
          node scripts/census/census.mjs ${{ matrix.path }} | tee census-${{ matrix.app }}.txt
          node scripts/census/census.mjs ${{ matrix.path }} --json > census-${{ matrix.app }}.json

      - name: Upload the census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: census-${{ matrix.app }}
          path: |
            census-${{ matrix.app }}.txt
            census-${{ matrix.app }}.json
          if-no-files-found: ignore

      - name: Install Playwright browser
        # The installed browser revision has to match the playwright-core version
        # @lowdefy/server-dev drives, so it is read from that package.json rather
        # than pinned here, where it would drift on the next dependency bump.
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('./packages/servers/server-dev/package.json').dependencies['playwright-core']")
          echo "Installing Playwright $PLAYWRIGHT_VERSION"
          npx --yes playwright@"$PLAYWRIGHT_VERSION" install --with-deps chromium

      - name: Prepare the app pinned to the candidate
        # The copy lives OUTSIDE the monorepo so the CLI's server install cannot
        # resolve a parent pnpm workspace (workspace links, overrides, patches) -
        # the canary must install the framework exactly as a downstream app does.
        run: >
          node scripts/canary/prepareApp.mjs
          --app ${{ matrix.path }}
          --out "${{ runner.temp }}/canary/${{ matrix.app }}"
          --version "$VERSION"

      - name: Install app dependencies for seeding
        working-directory: ${{ runner.temp }}/canary/${{ matrix.app }}
        # Only apps with a tests/ directory run seeded request tests, and only they
        # need mongodb + mongodb-memory-server, which the runner resolves from the
        # app directory. The docs leg stops after check, so it installs nothing here.
        run: |
          if [ -d tests ] && [ -f package.json ]; then
            npm install --no-audit --no-fund
          else
            echo "No tests/ directory; nothing to install."
          fi

      - name: Build
        working-directory: ${{ runner.temp }}/canary/${{ matrix.app }}
        run: npx --yes lowdefy@$VERSION build --log-level warn

      - name: Check
        working-directory: ${{ runner.temp }}/canary/${{ matrix.app }}
        # pipefail: without it the step's exit code is tee's, and a failing
        # check would be recorded green.
        run: |
          set -o pipefail
          npx --yes lowdefy@$VERSION check --json | tee check-report.json

      - name: Test
        working-directory: ${{ runner.temp }}/canary/${{ matrix.app }}
        # Only the example app ships a tests/ directory; the docs leg stops after check.
        run: |
          set -o pipefail
          if [ -d tests ]; then
            npx --yes lowdefy@$VERSION test 2>&1 | tee test-report.log
          else
            echo "No tests/ directory; skipping lowdefy test for ${{ matrix.app }}."
          fi

      - name: Dev server smoke
        if: matrix.app == 'canary-app'
        working-directory: ${{ runner.temp }}/canary/${{ matrix.app }}
        # `lowdefy build`, `check` and `test` all run the build pipeline; none of
        # them starts the dev server, so every dev-only regression (the
        # /.well-known probe 404, file watching, the manager lock, snapshot
        # determinism) has shipped unnoticed. This drives the real `lowdefy dev`
        # in the prepared app and asserts each of them.
        run: |
          fail() {
            echo "::error::$1"
            echo '--- lowdefy dev log ---'
            cat dev-server.log || true
            exit 1
          }
          status() { node -p "require('$PWD/build-status.json').build.$1"; }

          npx --yes lowdefy@"$VERSION" dev --port 3111 --no-open > dev-server.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT

          # The first dev run installs its own server directory before it serves
          # anything, so readiness gets a far longer budget than the build itself.
          deadline=$((SECONDS + 600))
          until curl -sf http://localhost:3111/lowdefy-docs/build-status -o build-status.json; do
            kill -0 "$DEV_PID" 2>/dev/null || fail "lowdefy dev exited before serving /lowdefy-docs/build-status."
            [ "$SECONDS" -lt "$deadline" ] || fail "lowdefy dev did not serve /lowdefy-docs/build-status within 600s."
            sleep 2
          done

          # `unknown` is what getBuildStatus reports until the build manager has
          # written build/buildStatus.json; `ok` and `error` are the settled states.
          deadline=$((SECONDS + 120))
          while [ "$(status status)" = "unknown" ]; do
            [ "$SECONDS" -lt "$deadline" ] || fail 'build-status stayed "unknown" for 120s.'
            sleep 2
            curl -sf http://localhost:3111/lowdefy-docs/build-status -o build-status.json || true
          done
          [ "$(status status)" = "ok" ] || fail "The dev build failed: $(cat build-status.json)"

          # A probe for an unknown well-known path must 404, not be swallowed by the
          # page router and answered with an app page (regression 7ce7e5f79).
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3111/.well-known/oauth-protected-resource)
          [ "$CODE" = "404" ] || fail "/.well-known/oauth-protected-resource answered $CODE, expected 404 (regression 7ce7e5f79)."

          # The watcher has to engage on Linux inotify, not only on macOS
          # (regression cffb0a83a). Every build writes a fresh timestamp.
          BEFORE=$(status timestamp)
          touch lib/items.js
          deadline=$((SECONDS + 30))
          while [ "$(status timestamp)" = "$BEFORE" ]; do
            [ "$SECONDS" -lt "$deadline" ] || fail "Touching lib/items.js triggered no rebuild within 30s (regression cffb0a83a)."
            sleep 2
            curl -sf http://localhost:3111/lowdefy-docs/build-status -o build-status.json || true
          done

          # The canary app commits no snapshots, so `snapshot --check` has nothing to
          # check against. Determinism is the property worth asserting anyway: two
          # captures of the same app must agree. Screenshots carry rendering noise,
          # so only dom.html and state.json are compared.
          npx --yes lowdefy@"$VERSION" snapshot --update > snapshot.log 2>&1 || fail "lowdefy snapshot --update failed: $(cat snapshot.log)"
          cp -r snapshots snapshots-first || fail 'lowdefy snapshot --update wrote no snapshots/ directory.'
          npx --yes lowdefy@"$VERSION" snapshot --update >> snapshot.log 2>&1 || fail "The second lowdefy snapshot --update failed: $(cat snapshot.log)"
          diff -r --exclude=screenshot.png snapshots-first snapshots || fail "snapshot --update is not deterministic: dom.html/state.json changed between two captures."

          # Two managers racing the same build directory wedge the dev server, so the
          # second one must refuse to start (regression af814a54f).
          set +e
          npx --yes lowdefy@"$VERSION" dev --port 3112 --no-open > second-dev.log 2>&1
          SECOND=$?
          set -e
          [ "$SECOND" -ne 0 ] || fail "A second lowdefy dev in the same directory exited 0; the manager lock did not hold (regression af814a54f)."
          grep -q 'is already running for this app' second-dev.log || fail "The second lowdefy dev failed without the manager-lock message: $(cat second-dev.log)"

          kill "$DEV_PID" 2>/dev/null || true
          echo 'Dev server smoke passed.'

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ matrix.app }}-reports
          path: |
            ${{ runner.temp }}/canary/${{ matrix.app }}/check-report.json
            ${{ runner.temp }}/canary/${{ matrix.app }}/test-report.log
            ${{ runner.temp }}/canary/${{ matrix.app }}/dev-server.log
            ${{ runner.temp }}/canary/${{ matrix.app }}/second-dev.log
            ${{ runner.temp }}/canary/${{ matrix.app }}/snapshot.log
          if-no-files-found: ignore

  record-green:
    name: Record green candidate
    needs: [schedule-gate, publish-candidate, canary]
    runs-on: ubuntu-latest
    # Nightly cron only: a passing nightly candidate earns a green tag. A manual
    # dispatch is a rehearsal and must not feed the weekly promotion.
    #
    # The needs results are checked by name rather than with success(): success() is
    # also true when a needed job was skipped, which would tag a candidate that was
    # never published or never canaried.
    if: >-
      needs.schedule-gate.outputs.nightly == 'true'
      && needs.publish-candidate.result == 'success'
      && needs.canary.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the candidate as green
        env:
          VERSION: ${{ needs.publish-candidate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="canary-green-$VERSION"
          # Annotated: the tag object records when the canary passed and why,
          # which a lightweight tag pointing straight at the commit cannot.
          git tag -a "$TAG" -m "Canary passed for $VERSION"
          git push origin "$TAG"
          echo "Recorded $TAG on $(git rev-parse HEAD)"

  promote:
    name: Promote known-good
    runs-on: ubuntu-latest
    needs: schedule-gate
    # Weekly cron, or a manual dispatch with promote: true.
    if: needs.schedule-gate.outputs.promote == 'true'
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No pnpm here: moveDistTag.mjs has zero dependencies. setup-node stays
      # for the registry .npmrc that NODE_AUTH_TOKEN authenticates through.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Promote the newest green candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          # The snapshot timestamp in the tag name is zero-padded, so the newest
          # candidate sorts last lexically - independent of tag or commit dates.
          TAG=$(git tag --list 'canary-green-*' --sort=-refname | head -n1)
          if [ -z "$TAG" ]; then
            echo "::error::No canary-green-* tag exists. No candidate has ever passed the canary."
            exit 1
          fi
          VERSION="${TAG#canary-green-}"
          CURRENT=$(npm view lowdefy@known-good version 2>/dev/null || echo "")
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "::error::known-good already points at $VERSION. No candidate has passed the canary since the last promotion."
            exit 1
          fi
          COMMIT=$(git rev-list -n1 "$TAG")
          echo "Promoting $VERSION (from $TAG at $COMMIT)"

          KNOWN_GOOD_TAG="experimental-known-good-$(date -u +%Y%m%d)"
          if git rev-parse -q --verify "refs/tags/$KNOWN_GOOD_TAG" >/dev/null; then
            echo "$KNOWN_GOOD_TAG already exists (a same-day retry); leaving it in place."
          else
            git tag -a "$KNOWN_GOOD_TAG" "$COMMIT" -m "Known-good experimental build $VERSION"
            git push origin "$KNOWN_GOOD_TAG"
          fi

          # Run the dist-tag move against the promoted commit's package list -
          # today's default branch may contain packages that were never
          # published at $VERSION.
          git -c advice.detachedHead=false checkout --detach "$COMMIT"
          node scripts/canary/moveDistTag.mjs --version "$VERSION" --tag known-good
