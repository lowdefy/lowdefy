name: MongoDB Tests

# Runs only on request: start it from the Actions tab, or add the
# `run-mongodb-tests` label to a pull request.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  test:
    name: MongoDB connection tests
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-mongodb-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:mongodb
