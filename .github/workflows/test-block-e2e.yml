name: Block E2E Tests

# Runs only on request: start it from the Actions tab, or add the
# `run-block-e2e` label to a pull request. Pull requests that change blocks,
# block-utils or the engine should run it before merge.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E ${{ matrix.package }}
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-block-e2e'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - '@lowdefy/blocks-aggrid'
          - '@lowdefy/blocks-antd'
          - '@lowdefy/blocks-antd-x'
          - '@lowdefy/blocks-basic'
          - '@lowdefy/blocks-diff'
          - '@lowdefy/blocks-echarts'
          - '@lowdefy/blocks-files'
          - '@lowdefy/blocks-google-maps'
          - '@lowdefy/blocks-loaders'
          - '@lowdefy/blocks-markdown'
          - '@lowdefy/blocks-qr'
          - '@lowdefy/blocks-table'
          - '@lowdefy/blocks-tiptap'
          - '@lowdefy/websockets-core'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter=${{ matrix.package }} exec playwright install --with-deps chromium
      # Each package builds its app into its own untracked copy of the server, _server/e2e/<package>.
      - run: pnpm --filter=${{ matrix.package }} e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: block-e2e-results-${{ strategy.job-index }}
          path: packages/**/e2e/test-results/
          retention-days: 7
