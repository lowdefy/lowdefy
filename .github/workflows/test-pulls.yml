name: Test Pull Requests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        if: matrix.os != 'windows-latest'
      - name: Build (skip website on Windows)
        run: pnpm -r --filter='!@lowdefy/website' --filter='!@lowdefy/lowdefy' build
        if: matrix.os == 'windows-latest'
      - run: pnpm test
      # pnpm runs package scripts through cmd.exe on Windows, where the quoted
      # --filter in the root test script matches no project, so the step above
      # runs no unit tests there. Run the process identity tests explicitly.
      - name: Process identity tests (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm --filter=@lowdefy/node-utils test ProcessStartTime watchOwner ServerRegistry registerServer readDevInstance --no-coverage
      - name: Prune tests (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm --filter=lowdefy test pruneServers --no-coverage
      - uses: codecov/codecov-action@v5
