name: Test Pull Requests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # A hung job otherwise holds its runner for GitHub's six-hour limit.
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - uses: codecov/codecov-action@v5
