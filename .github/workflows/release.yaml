# Named for its release line, so the Actions list tells it apart from the 6.x line's Release on
# the v6 branch. Keep the file name: npm's trusted publisher for every package names release.yaml.
name: Release 7.x
# Says what the push was. Whether it publishes is decided by the mode job below, and the report
# job comments the outcome on the release pull request.
run-name: >-
  ${{
  (github.event_name == 'workflow_dispatch' && 'Release 7.x: run by hand') ||
  ((contains(github.event.head_commit.message, 'from lowdefy/changeset-release/main') ||
  startsWith(github.event.head_commit.message, 'Publish new release')) &&
  'Publish 7.x (release pull request merged)') ||
  (contains(github.event.head_commit.message, 'from lowdefy/develop') &&
  'Release 7.x: develop merged into main') ||
  'Release 7.x: other push to main'
  }}
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Pending changesets (a Release merge from develop) mean this push opens or updates the
  # "Publish new release" PR. No pending changesets mean this push publishes: normally the
  # merge of that PR, but any other push to main without changesets publishes too, and the
  # idempotent publish steps then find everything already released. Decided here, on the
  # pushed commit, because the changesets action checks out the version branch, where the
  # changesets are already consumed.
  mode:
    name: Detect publish mode
    runs-on: ubuntu-latest
    if: github.repository == 'lowdefy/lowdefy'
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .changeset
      # Count only changesets that release a package: the changesets action ignores empty
      # ones (`changeset --empty`) and opens no PR for them.
      - id: mode
        run: |
          count=0
          for file in .changeset/*.md; do
            [ -e "$file" ] || continue
            [ "$(basename "$file")" = 'README.md' ] && continue
            if awk '/^---/ { fences++; next } fences == 1 && NF { found = 1 } END { exit !found }' "$file"; then
              count=$((count + 1))
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # Versioning only: opens or updates the "Publish new release" PR. Publishing runs in the
  # publish job on the merge of that PR.
  version:
    name: Open release pull request
    needs: mode
    if: needs.mode.outputs.publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm i --frozen-lockfile

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          createGithubReleases: false
          commit: 'chore: Publish new release'
          title: 'Publish new release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.changesets.outputs.pullRequestNumber
        run: |
          echo "Nothing was published. This push opened or updated the release pull request:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.changesets.outputs.pullRequestNumber }}" >> "$GITHUB_STEP_SUMMARY"

  # The complete path (test-complete.yml): the full OS and Node matrix and the slow
  # suites. Runs only on a publish push; the Release PR from develop into main runs it
  # before that merge.
  test:
    name: Complete tests
    needs: mode
    if: needs.mode.outputs.publish == 'true'
    uses: ./.github/workflows/test-complete.yml

  # Needs test, and has no status check in its `if`, so it runs only when test passed.
  # Each step is idempotent so a re-run recovers cleanly from a config or network error
  # part-way through.
  publish:
    name: Publish
    needs: [mode, test]
    if: needs.mode.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # Attempt the publish, but do not trust its exit code: `changeset publish` fails on
      # versions that already exist, which is a success condition on a re-run. The verify
      # step below is the real gate.
      - name: Publish to npm
        run: pnpm release:publish || true
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # Source of truth: every publishable package must be live on npm at its release
      # version. Missing anything fails the job (a real failure — re-run after fixing).
      - name: Verify all packages published
        run: node scripts/verify-published.mjs

      - name: Resolve release version
        id: version
        run: echo "version=v$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: node scripts/release-notes.mjs --output-file=/tmp/release-notes.md

      # Idempotent: query origin so a re-run on a fresh checkout still sees an existing tag.
      - name: Tag release commit
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists, skipping."
          else
            git tag "$VERSION" ${{ github.sha }}
            git push origin "$VERSION"
          fi

      # Idempotent: only create the release if one does not already exist for this version.
      - name: Create Github Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
          else
            gh release create "$VERSION" \
              --draft \
              --title "$VERSION" \
              --target ${{ github.sha }} \
              --notes-file /tmp/release-notes.md
          fi

  # Whatever happened to the tests and the publish, say so on the merged release pull request
  # and in the run summary, so nobody has to read the jobs to know whether the release went out.
  report:
    name: Report
    needs: [mode, test, publish]
    if: always() && needs.mode.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            packages/cli
      - run: node scripts/report-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: latest
          RELEASE_BRANCH: changeset-release/main
          TEST_RESULT: ${{ needs.test.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
