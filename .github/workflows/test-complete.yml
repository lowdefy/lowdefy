name: Complete Tests

# The complete path, run before a release: the unit tests on ubuntu and windows with
# Node 24 and 26, the MongoDB suites, the journey fixture suites and every block e2e
# suite. Release (release.yaml) runs it on every push to main and versions or publishes
# only when it passes. ci.yml runs it on pull requests into main, on pull requests with
# the `ci-full` label and from the Actions tab. See code-docs/testing.md.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node: [24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `pnpm test` without stopping at the first failing package, so one run lists every
      # failure before a release.
      - run: pnpm test:dependencies
      - run: pnpm -r --no-bail --filter=!@lowdefy/connection-mongodb test
      # Last: it changes the machine's time zone, and WMI answers slowly for minutes after
      # that, so start time reads in any step after it would time out.
      - name: Time zone change test (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 20
        run: pnpm --filter=@lowdefy/node-utils test windowsTimeZoneChange --no-coverage
        env:
          LOWDEFY_TEST_WINDOWS_TIME_ZONE: 'true'
      # One upload of the full suite's coverage. The fast path tests only affected
      # packages, so its coverage would read as drops everywhere else.
      - uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24

  mongodb:
    name: MongoDB
    uses: ./.github/workflows/test-mongodb.yml
    with:
      complete: true

  fixtures:
    name: Journey fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Where mongodb-memory-server keeps the mongod binaries (cached below).
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter=@lowdefy/server-dev exec playwright-core install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: node --input-type=module -e "import { MongoBinary } from 'mongodb-memory-server'; console.log(await MongoBinary.getPath());"
      # Both suites serve apps/journey-fixture from the same server copy, so they run one
      # after the other. With no Chromium every fixture test skips, so each run must show
      # passed tests, not just a zero exit code.
      - name: Server-dev fixture suite
        run: |
          pnpm --filter=@lowdefy/server-dev test:fixture --json --outputFile="$RUNNER_TEMP/fixture-server-dev.json"
          node scripts/ci-check-jest-ran.mjs "$RUNNER_TEMP/fixture-server-dev.json"
      - name: CLI fixture suite
        run: |
          pnpm --filter=lowdefy test:fixture --json --outputFile="$RUNNER_TEMP/fixture-cli.json"
          node scripts/ci-check-jest-ran.mjs "$RUNNER_TEMP/fixture-cli.json"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-fixture-dev-server-log
          path: apps/journey-fixture/.lowdefy/fixture-dev-server.log
          retention-days: 7

  block-e2e:
    name: Block e2e
    uses: ./.github/workflows/test-block-e2e.yml
    with:
      complete: true
