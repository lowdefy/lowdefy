# 103: Migrations discovered from the migrations/ directory
# ========================================================
# Two migration files under migrations/ are discovered, validated through the
# same buildRoutine code an Api endpoint uses, and written one artifact per
# migration to build/migrations/<id>.json plus the ordered index
# build/migrations.json with `applied` read from the stage ledger
# .lowdefy/migrations/<stage>.json (the snapshot run sets STAGE=snapshot and
# has no ledger, so every migration is pending).

lowdefy: local

config:
  migrations:
    preflight: true

connections:
  - id: frameworks
    type: MongoDBCollection
    properties:
      databaseUri: mongodb://localhost/test
      collection: frameworks
      write: true

pages:
  - id: home
    type: Box
    blocks:
      - id: title
        type: Paragraph
        properties:
          content: Migrations
