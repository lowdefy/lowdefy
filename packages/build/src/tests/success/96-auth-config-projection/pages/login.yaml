id: login
type: Box
# A Box carrying auth projection data for the snapshot, not real Box properties.
~ignoreBuildChecks:
  - block-properties
properties:
  emailLoginEnabled:
    _build.authConfig: emailAndPassword.enabled
  magicLinkEnabled:
    _build.authConfig: magicLink.enabled
  twoFactorEnabled:
    _build.authConfig: twoFactor.enabled
  passkeyEnabled:
    _build.authConfig: passkey.enabled
  providers:
    _build.authConfig: providers
  organizationSignup:
    _build.authConfig: organizations.signup
