# 103: Runtime components with typed props
lowdefy: local

components:
  AnswerPill:
    _ref: components/answer-pill.yaml

pages:
  - id: controls
    type: Box
    blocks:
      - id: pill_a
        type: AnswerPill
        props:
          result:
            _state: answer_a
          tone: positive
        slots:
          footer:
            blocks:
              - id: approve_a
                type: Button
                properties:
                  title: Approve
      - id: pill_b
        type: AnswerPill
        props:
          result:
            _state: answer_b
        # The deprecated "areas" alias must fill the component slot, not be
        # dropped with the instance's component keys.
        areas:
          footer:
            blocks:
              - id: approve_b
                type: Button
                properties:
                  title: Approve
