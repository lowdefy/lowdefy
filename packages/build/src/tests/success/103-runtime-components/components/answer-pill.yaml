# A runtime component with a typed, required prop, a defaulted prop, and a slot.
id: AnswerPill
props:
  result:
    type: string
    required: true
    description: The answer's result label.
  tone:
    type: string
    default: neutral
    description: Visual tone.
slots:
  - footer
blocks:
  - id: root
    type: Box
    blocks:
      - id: label
        type: Title
        properties:
          content:
            _prop: result
      - id: tone_label
        type: Paragraph
        properties:
          content:
            _prop: tone
      - id: footer_wrap
        type: Box
        blocks:
          - _slot: footer
