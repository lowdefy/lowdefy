# 99: _build.authConfig in a module entry var
# The app passes a module var whose value is _build.authConfig. Module entry
# vars (modules[].vars) resolve BEFORE the auth config projection is computed,
# so the fold defers on that walk and resolves where the module consumes the
# var (_module.var re-walks the substituted value after the projection
# exists). Formerly error fixture B7, when this position was a build error.
lowdefy: local

auth:
  secret:
    _secret: BETTER_AUTH_SECRET
  database:
    id: auth_db
    type: MongoDBAuthAdapter
    properties: {}
  emailAndPassword:
    enabled: true
  roles:
    - id: admin
      label: Administrator
      description: Full access
    - id: viewer
      label: Viewer
      description: Read only access

modules:
  - id: rolesmod
    source: 'file:modules/rolesmod'
    vars:
      role_catalog:
        _build.authConfig: roles

pages:
  - id: home
    type: Box
