# 102: Response schema app
# =======================
# An endpoint declaring a responseSchema and a page reading its result at
# _actions.<id>.response.<path>, plus a routine reading it at
# _step.<id>.<path>. Proves the declaration reaches build/api/<endpointId>.json.

lowdefy: local

api:
  - id: search_controls
    type: Api
    auth:
      public: true
    payloadSchema:
      type: object
      properties:
        query: { type: string }
    responseSchema:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
        total: { type: integer }
      required: [results, total]
    routine:
      ':return':
        results: []
        total: 0
  - id: count_controls
    type: Api
    auth:
      public: true
    routine:
      - id: fetch
        type: CallApi
        properties:
          endpointId: search_controls
          payload:
            query: ''
      - ':return':
          count:
            _step: fetch.total

pages:
  - id: home
    type: Box
    blocks:
      - id: q
        type: TextInput
      - id: search_btn
        type: Button
        events:
          onClick:
            - id: search
              type: CallAPI
              params:
                endpointId: search_controls
                payload:
                  query:
                    _state: q
            - id: store
              type: SetState
              params:
                results:
                  _actions: search.response.results
                first_title:
                  _actions: search.response.results.0.title
                total:
                  _actions: search.response.total
                ok:
                  _api: search_controls.success
