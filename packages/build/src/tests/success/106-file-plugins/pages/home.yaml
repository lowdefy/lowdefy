id: home
type: Box
requests:
  - id: greeting
    type: MemoryGet
    connectionId: memory_store
    properties:
      key: greeting
blocks:
  - id: status_chip
    type: StatusChip
    properties:
      label:
        _titleCase: hello world
      tone: positive
  - id: copy
    type: Button
    events:
      onClick:
        - id: copy_row
          type: CopyRow
          params:
            rowId: status_chip
