# 106: single-file local plugins
# A block, an action and a shared operator are each one file under plugins/,
# with an optional sibling JSON carrying meta, schema and hazards. The build
# discovers them, emits a path import into the generated barrels (the copy
# under the server directory for a prod build) and reads their schemas from the
# sibling JSON instead of a package barrel.
lowdefy: local

pages:
  - _ref: pages/home.yaml
