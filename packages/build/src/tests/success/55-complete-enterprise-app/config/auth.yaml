secret:
  _secret: BETTER_AUTH_SECRET
database:
  id: enterprise_auth_db
  type: MongoDBAuthAdapter
  properties: {}
emailAndPassword:
  enabled: true
roles:
  - id: admin
  - id: sales
providers:
  - id: google
    type: Google
    properties:
      clientId:
        _secret: GOOGLE_CLIENT_ID
      clientSecret:
        _secret: GOOGLE_CLIENT_SECRET
pages:
  protected: true
  public:
    - login
  roles:
    admin:
      - settings
      - reports
    sales:
      - customers
      - customer-detail
      - orders
session:
  expiresIn: 28800
