# 104: ListPage archetype
# =======================
# A page whose root type is the ListPage archetype. At build, expandArchetype
# rewrites it into a layout block carrying the generated blocks (header, filter
# row, List with a row link, Result empty state and a skeleton) plus one list
# request read from build/collections.json. The 30-line archetype expands to the
# lowdefy-list-pages recipe with one way to be right.

lowdefy: local

# ListPage is experimental: the block tree it expands to may change within a
# minor release until "lowdefy expand" and the archetype slots have settled.
config:
  experimental:
    archetypes: true

collections:
  controls:
    tenant: shared
    fields:
      _id: string
      title: string
      description: string
      framework_id: string
      status: { enum: [draft, active, retired, na] }

connections:
  - id: controls
    type: MongoDBCollection
    properties:
      databaseUri: mongodb://localhost/test
      collection: controls

pages:
  - id: controls
    type: ListPage
    props:
      collection: controls
      columns: [title, framework_id, status]
      filters: [framework_id, status]
      search: [title, description]
      rowLink: { pageId: control, urlQuery: { id: $_id } }
      actions:
        - id: new
          type: Button
          properties:
            title: New control
    slots:
      rowActions:
        blocks:
          - id: rows.$.edit
            type: Button
            properties:
              title: Edit
      footer:
        blocks:
          - id: list_footer
            type: Paragraph
            properties:
              content: Showing at most 50 controls.
  - id: control
    type: Box
    blocks:
      - id: control_title
        type: Paragraph
        properties:
          content: Control detail
