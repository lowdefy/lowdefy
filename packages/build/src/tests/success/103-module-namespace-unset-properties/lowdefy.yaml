# 103: Namespace var properties the consumer never set stay absent (not null);
# a consumer's explicit null stays null, and a var given through _ref behaves
# the same as one written inline.
lowdefy: local
name: Namespace Unset Properties Test

modules:
  - id: layout-unset
    source: 'file:modules/layout'
    vars:
      sider:
        theme: dark
  - id: layout-explicit-null
    source: 'file:modules/layout'
    vars:
      sider:
        collapsedWidth: null
  - id: layout-ref
    source: 'file:modules/layout'
    vars:
      sider:
        _ref: sider.yaml
