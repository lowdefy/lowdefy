id: invite
type: Box
blocks:
  - id: send-btn
    type: Button
    properties:
      title: Send Invite
    events:
      onClick:
        - id: dispatch
          type: Request
          params:
            endpointId:
              _module.endpointId: dispatch-invite
            payload:
              notification_id:
                _module.notificationId: invite-user
