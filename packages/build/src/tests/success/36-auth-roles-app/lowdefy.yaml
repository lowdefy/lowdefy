# 36: Role-based Authorization Application
lowdefy: local
name: Role-based App

auth:
  secret:
    _secret: BETTER_AUTH_SECRET
  database:
    id: roles_app_auth_db
    type: MongoDBAuthAdapter
    properties: {}
  emailAndPassword:
    enabled: true
  roles:
    - id: admin
    - id: manager
    - id: user
  pages:
    protected: true
    public:
      - login
    roles:
      admin:
        - admin-panel
        - user-management
      manager:
        - reports
        - team
      user:
        - dashboard
        - profile

pages:
  - id: login
    type: Result
    properties:
      title: Login
      status: info
    areas:
      extra:
        blocks:
          - id: loginBtn
            type: Button
            properties:
              title: Sign In
            events:
              onClick:
                - id: login
                  type: Login
  - id: dashboard
    type: Box
    properties:
      title: Dashboard
    blocks:
      - id: title
        type: Title
        properties:
          content: User Dashboard
  - id: profile
    type: Box
    properties:
      title: Profile
    blocks:
      - id: title
        type: Title
        properties:
          content: My Profile
  - id: reports
    type: Box
    properties:
      title: Reports
    blocks:
      - id: title
        type: Title
        properties:
          content: Manager Reports
  - id: team
    type: Box
    properties:
      title: Team
    blocks:
      - id: title
        type: Title
        properties:
          content: Team Management
  - id: admin-panel
    type: Box
    properties:
      title: Admin Panel
    blocks:
      - id: title
        type: Title
        properties:
          content: Administration
  - id: user-management
    type: Box
    properties:
      title: User Management
    blocks:
      - id: title
        type: Title
        properties:
          content: Manage Users
