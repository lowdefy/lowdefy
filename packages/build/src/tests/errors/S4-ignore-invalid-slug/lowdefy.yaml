# S4: Invalid Check Slug in ~ignoreBuildChecks
# =============================================
# Tests that a check slug that is not kebab-case in ~ignoreBuildChecks throws
# an error. Any kebab-case slug may be a plugin rule id, so only the form is
# checked here.
#
# Expected: ConfigError with "Invalid check slug(s)"

lowdefy: local

pages:
  - id: home
    type: Box
    ~ignoreBuildChecks:
      - Invalid_Slug
    blocks:
      - id: test
        type: Paragraph
