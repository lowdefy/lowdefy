# B3: Public/Protected Conflict
# ==============================
# Tests that public and protected pages are mutually exclusive.
#
# Expected error:
#   [Config Error] "protected" and "public" page lists are mutually exclusive.
#
# The error points to the line where auth.pages is defined. A login
# mechanism, secret and database are configured so validation reaches the
# mutual exclusivity check instead of failing earlier.

lowdefy: local

auth:
  secret:
    _secret: BETTER_AUTH_SECRET
  database:
    id: auth_db
    type: MongoDBAuthAdapter
    properties: {}
  emailAndPassword:
    enabled: true
  pages:
    public:
      - home
    protected:
      - dashboard

pages:
  - id: home
    type: Box
  - id: dashboard
    type: Box
