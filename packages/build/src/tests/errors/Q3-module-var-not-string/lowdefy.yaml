# Q3: _module.var Argument Not A String
# =====================================
# Tests that a _module.var whose argument is not a string fails the build with
# a ConfigError located at the _module.var line in the module file.
#
# Expected error:
#   [ConfigError] _module.var operator takes a string argument.
#
# The error points to line 7 of modules/widget/module.lowdefy.yaml, the "title"
# key that holds the _module.var.

lowdefy: local

modules:
  - id: widget
    source: 'file:modules/widget'

pages:
  - id: home
    type: Box
