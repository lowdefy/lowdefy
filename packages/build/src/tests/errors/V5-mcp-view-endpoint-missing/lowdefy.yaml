# V5: MCP View Endpoint Missing
# =============================
# Tests that a mcp.viewEndpoints id names a defined api endpoint.
#
# Expected errors:
#   [Config Error] MCP view endpoint "task-reads" does not reference a defined api endpoint.

lowdefy: local

auth:
  secret:
    _secret: BETTER_AUTH_SECRET
  database:
    id: auth_db
    type: MongoDBAuthAdapter
    properties: {}
  providers:
    - id: google
      type: Google
      properties:
        clientId:
          _secret: GOOGLE_CLIENT_ID
        clientSecret:
          _secret: GOOGLE_CLIENT_SECRET
  oauthProvider:
    consentPage: consent

api:
  - id: open_task
    type: Api
    description: Open a task.
    payloadSchema:
      type: object
      properties:
        key:
          type: string
    routine: []

mcp:
  viewEndpoints:
    - id: task-reads
      scope: mcp:read
  endpoints:
    - id: open_task
      scope: mcp:read
      view:
        pageId: consent

pages:
  - id: consent
    type: Box
  - id: task
    type: Box
    path: '{space}/tasks/{ref}'
