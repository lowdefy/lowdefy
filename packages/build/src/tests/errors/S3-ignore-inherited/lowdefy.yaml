# S3: Inherited Suppression from Parent
# ======================================
# Tests that ~ignoreBuildChecks cascades to children.
#
# The page has ~ignoreBuildChecks naming state-refs, which should suppress warnings
# for all blocks within the page.
#
# Expected: NO warning for the child block's undefined _state reference.

lowdefy: local

pages:
  - id: home
    type: Box
    ~ignoreBuildChecks:
      - state-refs
    blocks:
      - id: stateRef
        type: Paragraph
        properties:
          content:
            _state: undefinedKey
