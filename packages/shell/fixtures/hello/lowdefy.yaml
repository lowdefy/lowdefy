# A phone app with two tabs, the first a Screen page: what the shell's fixture test builds and checks
# against the shell's type manifest.
lowdefy: local
name: Hello

mobile:
  homePageId: today
  menus:
    tabs:
      - pageId: today
        title: Today
      - pageId: about
        title: About
  pages:
    - id: today
      type: Screen
      properties:
        title: Today
      slots:
        content:
          blocks:
            - id: greeting
              type: Box
              properties:
                content: Hello from Lowdefy
            - id: tap
              type: Box
              properties:
                content: Tap to count
              events:
                onClick:
                  - id: count
                    type: SetState
                    params:
                      taps:
                        _sum:
                          - _if_none:
                              - _state: taps
                              - 0
                          - 1
    - id: about
      type: Box
      blocks:
        - id: about_text
          type: Box
          properties:
            content: A Lowdefy app on a phone.
