# Generated by `lowdefy init-migrations`. Applies the pending migrations for
# the __STAGE__ stage on every push to __BRANCH__ (or on demand), then commits
# the updated ledger .lowdefy/migrations/__STAGE__.json back to the branch —
# even when a migration fails, so the ones that applied are recorded.
#
# Requires a GitHub environment named "__STAGE__" holding the connection
# secrets (e.g. MONGODB_URI) the app's connections read.
#
# Ordering: the build your deploy ships must be made from the commit that
# carries the ledger, or its serving preflight refuses to serve until the next
# deploy. Chain your deploy job after `migrate` with `needs: migrate` (see the
# placeholder below), or trigger your deploy workflow from this one.
name: Migrations Run — __STAGE__

on:
  push:
    branches: [__BRANCH__]
  workflow_dispatch:

# Two pushes queue their migration runs instead of interleaving them, and a
# run is never cancelled half-way through a migration.
concurrency:
  group: migrations-__STAGE__
  cancel-in-progress: false

permissions:
  contents: write

env:
  STAGE: __STAGE__

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: __STAGE__
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build
        run: npx lowdefy@__LOWDEFY_VERSION__ build
        env: ${{ secrets }}
      - name: Apply migrations
        run: npx lowdefy@__LOWDEFY_VERSION__ migrate --yes 2>&1 | tee migrate.log
        env: ${{ secrets }}
      - name: Commit the ledger
        if: always()
        run: |
          git config user.name "lowdefy-migrations[bot]"
          git config user.email "migrations@lowdefy.com"
          git add .lowdefy/migrations/__STAGE__.json
          if git diff --cached --quiet; then
            echo "Ledger unchanged."
          else
            git commit -m "chore(migrations): __STAGE__ ledger [skip ci]"
            git push
          fi

  # deploy:
  #   needs: migrate
  #   runs-on: ubuntu-latest
  #   environment: __STAGE__
