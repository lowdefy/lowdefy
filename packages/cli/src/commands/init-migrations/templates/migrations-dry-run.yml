# Generated by `lowdefy init-migrations`. Plans the pending migrations for the
# __STAGE__ stage on every pull request into __BRANCH__ and posts the plan as a
# PR comment, so a reviewer sees what will run against the __STAGE__ database
# before merging. Nothing is written.
#
# Requires a GitHub environment named "__STAGE__" holding the connection
# secrets (e.g. MONGODB_URI) the app's connections read.
name: Migrations Dry Run — __STAGE__

on:
  pull_request:
    branches: [__BRANCH__]

permissions:
  contents: read
  pull-requests: write

env:
  STAGE: __STAGE__

jobs:
  dry-run:
    runs-on: ubuntu-latest
    environment: __STAGE__
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build
        run: npx lowdefy@__LOWDEFY_VERSION__ build
        env: ${{ secrets }}
      - name: Plan migrations
        id: plan
        run: |
          npx lowdefy@__LOWDEFY_VERSION__ migrate --dry-run --yes 2>&1 | tee migrate.log
        env: ${{ secrets }}
      - name: Comment the plan on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Migrations dry run — \`__STAGE__\`"
            echo
            echo '```'
            cat migrate.log
            echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
