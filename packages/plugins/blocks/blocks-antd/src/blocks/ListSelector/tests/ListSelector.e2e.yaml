id: list_selector
type: Box

blocks:
  - id: ls_basic
    type: ListSelector
    properties:
      valueKey: id
      data:
        - { id: 1, name: Starter }
        - { id: 2, name: Pro }
      html: '<strong>{{ item.name }}</strong>'
    events:
      onChange:
        - id: set_ls_value
          type: SetState
          params:
            ls_basic_event:
              _event: value

  - id: ls_basic_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'Selected: '
          - _json.stringify:
              - _state: ls_basic_event

  - id: ls_size_default
    type: ListSelector
    properties:
      size: default
      data:
        - Alpha
      html: '{{ item }}'

  - id: ls_size_small
    type: ListSelector
    properties:
      size: small
      data:
        - Alpha
      html: '{{ item }}'
