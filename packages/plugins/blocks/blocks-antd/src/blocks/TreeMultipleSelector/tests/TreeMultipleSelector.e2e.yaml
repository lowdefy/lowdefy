id: treemultipleselector
type: Box

events:
  onInit:
    - id: set_defaults
      type: SetState
      params:
        tms_responsive:
          - alpha
          - bravo
          - charlie
          - delta
          - echo
        tms_remove_icon:
          - apple
        tms_strict_value:
          - fruit

blocks:
  - id: tms_basic
    type: TreeMultipleSelector
    properties:
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      treeDefaultExpandAll: true
      data:
        - { id: fruit, label: Fruit }
        - { id: apple, label: Apple, parentId: fruit }
        - { id: banana, label: Banana, parentId: fruit }
    events:
      onChange:
        - id: set_basic_value
          type: SetState
          params:
            tms_basic_event:
              _event: value

  - id: tms_basic_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'Value: '
          - _json.stringify:
              - _state: tms_basic_event

  - id: tms_max_count
    type: TreeMultipleSelector
    properties:
      maxCount: 1
      treeDefaultExpandAll: true
      options:
        - label: Apple
          value: apple
        - label: Banana
          value: banana

  - id: tms_responsive
    type: TreeMultipleSelector
    layout:
      span: 8
    properties:
      maxTagCount: responsive
      options:
        - label: Alpha option
          value: alpha
        - label: Bravo option
          value: bravo
        - label: Charlie option
          value: charlie
        - label: Delta option
          value: delta
        - label: Echo option
          value: echo

  - id: tms_check_strictly
    type: TreeMultipleSelector
    properties:
      checkable: true
      checkStrictly: true
      treeDefaultExpandAll: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: fruit, label: Fruit }
        - { id: apple, label: Apple, parentId: fruit }
        - { id: banana, label: Banana, parentId: fruit }
    events:
      onChange:
        - id: set_strict_value
          type: SetState
          params:
            tms_strict_event:
              _event: value

  - id: tms_strict_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'Strict: '
          - _json.stringify:
              - _state: tms_strict_event

  - id: tms_strict_value
    type: TreeMultipleSelector
    properties:
      checkable: true
      checkStrictly: true
      treeDefaultExpandAll: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: fruit, label: Fruit }
        - { id: apple, label: Apple, parentId: fruit }
        - { id: banana, label: Banana, parentId: fruit }

  - id: tms_strict_value_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'Strict value: '
          - _json.stringify:
              - _state: tms_strict_value

  - id: tms_remove_icon
    type: TreeMultipleSelector
    properties:
      removeIcon: delete
      options:
        - label: Apple
          value: apple
        - label: Banana
          value: banana
