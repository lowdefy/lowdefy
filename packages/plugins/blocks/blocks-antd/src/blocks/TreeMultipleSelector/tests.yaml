- id: default
  type: TreeMultipleSelector
  properties:
    primaryKey: id
    parentKey: parentId
    valueKey: id
    html: '{{ item.label }}'
    data:
      - { id: fruit, label: Fruit }
      - { id: apple, label: Apple, parentId: fruit }
      - { id: banana, label: Banana, parentId: fruit }
      - { id: veg, label: Vegetables }
