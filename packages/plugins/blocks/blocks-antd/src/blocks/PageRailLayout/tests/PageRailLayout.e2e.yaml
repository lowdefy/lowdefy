id: pagerail
type: PageRailLayout
properties:
  panel:
    storageKey: pagerail-panel-width
  menu:
    selectedKeys:
      - rail_controls
    links:
      - id: rail_controls
        type: MenuLink
        properties:
          title: Controls
          icon: ShieldCheck
          tip: All controls
      - id: rail_documents
        type: MenuLink
        properties:
          title: Documents
          icon: FileText
      - id: rail_people
        type: MenuLink
        properties:
          title: People
          icon: Users
      - id: rail_reports
        type: MenuLink
        properties:
          title: Reports
          icon: ChartBar
      - id: rail_audit
        type: MenuLink
        properties:
          title: Audit
          icon: ClipboardList
  badges:
    rail_controls: 12
    rail_documents:
      count: 3
      tone: error
  footItems:
    - id: search
      icon: Search
      title: Search
      tip: Search everything
  notifications:
    count: 4
  profile:
    title: Account
    avatar:
      content: AB
    links:
      - id: rail_sign_out
        type: MenuLink
        properties:
          title: Sign out
  darkModeToggle: true
  breadcrumb:
    list:
      - Controls
      - Access control

slots:
  panelHeader:
    blocks:
      - id: rail_panel_header_text
        type: Span
        properties:
          content: Panel Header
  panel:
    blocks:
      - id: rail_panel_text
        type: Span
        properties:
          content: Panel Content
  contentHeader:
    blocks:
      - id: rail_content_header_text
        type: Span
        properties:
          content: Content Header
  content:
    blocks:
      - id: rail_main_content
        type: Title
        properties:
          content: Main Content Area
          level: 3
      - id: rail_foot_display
        type: Span
        properties:
          content:
            _if:
              test:
                _ne:
                  - _state: rail_foot_clicked
                  - null
              then:
                _string.concat:
                  - 'Foot clicked: '
                  - _state: rail_foot_clicked
              else: ''
      - id: rail_place_display
        type: Span
        properties:
          content:
            _if:
              test:
                _ne:
                  - _state: rail_place_clicked
                  - null
              then:
                _string.concat:
                  - 'Place clicked: '
                  - _state: rail_place_clicked
              else: ''
      - id: rail_resize_display
        type: Span
        properties:
          content:
            _if:
              test:
                _ne:
                  - _state: rail_resized
                  - null
              then:
                _string.concat:
                  - 'Resized: '
                  - _state: rail_resized
              else: ''

events:
  onFootItemClick:
    - id: set_foot_clicked
      type: SetState
      params:
        rail_foot_clicked:
          _event: id
  onMenuItemClick:
    - id: set_place_clicked
      type: SetState
      params:
        rail_place_clicked:
          _event: key
  onPanelResize:
    - id: set_resized
      type: SetState
      params:
        rail_resized:
          _event: width
