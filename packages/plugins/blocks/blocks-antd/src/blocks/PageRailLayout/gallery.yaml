- title: PageRailLayout with a panel
  fullWidth: true
  blocks:
    - id: prl_basic
      type: PageRailLayout
      style:
        .element:
          height: 560px
          overflow: auto
          --lf-rail-viewport-height: 560px
      properties:
        menu:
          selectedKeys:
            - prl_basic_controls
          links:
            - id: prl_basic_controls
              type: MenuLink
              properties:
                title: Controls
                icon: ShieldCheck
            - id: prl_basic_documents
              type: MenuLink
              properties:
                title: Documents
                icon: FileText
            - id: prl_basic_people
              type: MenuLink
              properties:
                title: People
                icon: Users
        badges:
          prl_basic_controls: 12
          prl_basic_documents:
            count: 3
            tone: error
        footItems:
          - id: search
            icon: Search
            title: Search
            tip: Search everything
          - id: settings
            icon: Settings
            title: Settings
        notifications:
          count: 4
        profile:
          title: Account
          avatar:
            content: AB
          links:
            - id: prl_basic_sign_out
              type: MenuLink
              properties:
                title: Sign out
        darkModeToggle: true
        panel:
          title: Controls
          storageKey: prl_basic_panel
        crumbs:
          - id: org
            label: Acme Ltd
            mark:
              text: AL
              color: '#17b3a3'
            switcher:
              title: Organisations
              options:
                - id: acme
                  label: Acme Ltd
                  description: Owner
                  selected: true
                  mark:
                    text: AL
                    color: '#17b3a3'
                - id: globex
                  label: Globex
                  description: Admin
                  extra: 4
                  mark:
                    text: GX
                    color: '#5b7fd6'
              actions:
                - id: new
                  label: New organisation
                  icon: Plus
          - id: lens
            label: ISO 27001
            mark:
              percent: 62
            switcher:
              options:
                - id: all
                  label: All frameworks
                  mark:
                    percent: 48
                - id: iso
                  label: ISO 27001
                  selected: true
                  mark:
                    percent: 62
          - id: place
            label: Controls
          - id: record
            label: Access control
      slots:
        header:
          blocks:
            - id: prl_basic_comment
              type: Button
              properties:
                title: Comment
                size: small
                icon: MessageCircle
        panel:
          blocks:
            - id: prl_basic_menu
              type: Menu
              properties:
                mode: inline
                links:
                  - id: prl_basic_menu_a
                    type: MenuLink
                    properties:
                      title: Access control
                  - id: prl_basic_menu_b
                    type: MenuLink
                    properties:
                      title: Asset management
                  - id: prl_basic_menu_c
                    type: MenuLink
                    properties:
                      title: Incident response
        content:
          blocks:
            - id: prl_basic_title
              type: Title
              properties:
                content: Access control
                level: 3
            - id: prl_basic_text
              type: Paragraph
              properties:
                content: Drag the panel edge to resize it, or past its smallest width to collapse it. Double-click the edge to reset it, and press Ctrl or Cmd with the backslash key to show or hide the panel. Pick the organisation or the framework from the crumbs.
- title: PageRailLayout with an aside
  fullWidth: true
  blocks:
    - id: prl_aside
      type: PageRailLayout
      style:
        .element:
          height: 480px
          overflow: auto
          --lf-rail-viewport-height: 480px
      properties:
        panel:
          storageKey: prl_aside_panel_width
        aside:
          open: true
          width: 320
        menu:
          links:
            - id: prl_aside_home
              type: MenuLink
              properties:
                title: Home
                icon: House
            - id: prl_aside_work
              type: MenuLink
              properties:
                title: Work
                icon: Briefcase
      slots:
        panel:
          blocks:
            - id: prl_aside_panel_text
              type: Paragraph
              properties:
                content: A page fills this slot with its own menu or list.
        content:
          blocks:
            - id: prl_aside_title
              type: Title
              properties:
                content: Work
                level: 3
        aside:
          blocks:
            - id: prl_aside_assistant
              type: Paragraph
              properties:
                content: An assistant panel docks here.
- title: PageRailLayout without a panel
  fullWidth: true
  blocks:
    - id: prl_plain
      type: PageRailLayout
      style:
        .element:
          height: 360px
          overflow: auto
          --lf-rail-viewport-height: 360px
      properties:
        menu:
          links:
            - id: prl_plain_home
              type: MenuLink
              properties:
                title: Home
                icon: House
            - id: prl_plain_settings
              type: MenuLink
              properties:
                title: Settings
                icon: Settings
      slots:
        content:
          blocks:
            - id: prl_plain_title
              type: Title
              properties:
                content: A page with only a rail
                level: 3
