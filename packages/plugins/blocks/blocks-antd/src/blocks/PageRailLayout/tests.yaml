- id: default
  type: PageRailLayout
- id: 'properties.menu'
  type: PageRailLayout
  properties:
    menu:
      links:
        - id: controls
          type: MenuLink
          pageId: controls
          properties:
            icon: ShieldCheck
            title: Controls
            tip: Controls and their evidence
        - id: documents
          type: MenuLink
          pageId: documents
          properties:
            icon: FileText
            title: Documents
- id: 'properties.badges'
  type: PageRailLayout
  properties:
    menu:
      links:
        - id: controls
          type: MenuLink
          properties:
            icon: ShieldCheck
            title: Controls
        - id: documents
          type: MenuLink
          properties:
            icon: FileText
            title: Documents
    badges:
      controls: 12
      documents:
        count: 3
        tone: error
- id: 'properties.footItems'
  type: PageRailLayout
  properties:
    footItems:
      - id: search
        icon: Search
        title: Search
        tip: Search everything (Cmd+K)
      - id: settings
        icon: Settings
        title: Settings
        pageId: settings
- id: 'properties.notifications'
  type: PageRailLayout
  properties:
    notifications:
      count: 4
- id: 'properties.profile'
  type: PageRailLayout
  properties:
    darkModeToggle: true
    profile:
      title: Account
      avatar:
        content: AB
      links:
        - id: sign_out
          type: MenuLink
          pageId: sign-out
          properties:
            title: Sign out
- id: 'properties.panel'
  type: PageRailLayout
  properties:
    panel:
      minWidth: 200
      maxWidth: 400
      initialWidth: 260
      storageKey: tests-panel-width
      drawerBreakpoint: 1000
  slots:
    panelHeader:
      blocks: []
    panel:
      blocks: []
- id: 'properties.panel.startOpen'
  type: PageRailLayout
  properties:
    panel:
      title: Controls
      startOpen: true
      closeOnNavigate: false
      shortcut: null
  slots:
    panel:
      blocks: []
- id: 'properties.mobileBreakpoint'
  type: PageRailLayout
  properties:
    mobileBreakpoint: 600
    mobileTabs: 3
    headerOnPhone: true
- id: 'properties.aside'
  type: PageRailLayout
  properties:
    aside:
      open: true
      width: 320
      title: Assistant
  slots:
    aside:
      blocks: []
- id: 'properties.crumbs'
  type: PageRailLayout
  properties:
    crumbs:
      - id: org
        label: Northwind Holdings
        mark:
          text: NH
          color: '#17b3a3'
        switcher:
          title: Organisations
          options:
            - id: nh
              label: Northwind Holdings
              description: Owner
              selected: true
              mark:
                text: NH
            - id: ag
              label: Acme Group
              extra: 5
              pageId: switch
              urlQuery:
                org: ag
          actions:
            - id: new
              label: New organisation
              icon: Plus
      - id: lens
        label: All frameworks
        mark:
          percent: 30
        switcher:
          options:
            - id: all
              label: All frameworks
              selected: true
              mark:
                percent: 30
      - id: place
        label: Controls
        pageId: controls
      - id: record
        label: Privacy Notice
  slots:
    header:
      blocks: []
- id: 'properties.padding: compact'
  type: PageRailLayout
  properties:
    padding: compact
- id: 'properties.padding: none'
  type: PageRailLayout
  properties:
    padding: none
- id: 'style.element'
  type: PageRailLayout
  style:
    .element:
      border: 5px solid blue
- id: 'style.rail'
  type: PageRailLayout
  style:
    .rail:
      border: 5px solid blue
- id: 'style.bar'
  type: PageRailLayout
  style:
    .bar:
      border: 5px solid blue
  slots:
    header:
      blocks: []
- id: 'style.panel'
  type: PageRailLayout
  style:
    .panel:
      border: 5px solid blue
  slots:
    panel:
      blocks: []
- id: 'style.main'
  type: PageRailLayout
  style:
    .main:
      border: 5px solid blue
  slots:
    content:
      blocks: []
