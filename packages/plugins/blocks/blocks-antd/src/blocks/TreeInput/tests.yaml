- id: default
  type: TreeInput
  properties:
    primaryKey: id
    parentKey: parentId
    valueKey: id
    html: '{{ item.label }}'
    data:
      - { id: fruit, label: Fruit }
      - { id: apple, label: Apple, parentId: fruit }
      - { id: banana, label: Banana, parentId: fruit }
      - { id: veg, label: Vegetables }
- id: 'properties.options'
  type: TreeInput
  properties:
    primaryKey: value
    parentKey: parent
    defaultExpandAll: true
    options:
      - { value: eng, label: Engineering }
      - { value: fe, label: Frontend, parent: eng }
      - { value: be, label: Backend, parent: eng }
      - { value: ops, label: Operations }
