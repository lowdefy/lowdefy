id: treeinput
type: Box

events:
  onInit:
    - id: set_defaults
      type: SetState
      params:
        ts_with_value: child1

blocks:
  - id: ts_basic
    type: TreeInput
    properties:
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      defaultExpandAll: true
      data:
        - { id: parent1, label: Parent 1 }
        - { id: child1, label: Child 1, parentId: parent1 }
        - { id: child2, label: Child 2, parentId: parent1 }
        - { id: parent2, label: Parent 2 }

  - id: ts_with_value
    type: TreeInput
    properties:
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      defaultExpandAll: true
      data:
        - { id: parent1, label: Parent 1 }
        - { id: child1, label: Child 1, parentId: parent1 }
        - { id: child2, label: Child 2, parentId: parent1 }

  - id: ts_disabled
    type: TreeInput
    properties:
      disabled: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: item1, label: Item 1 }
        - { id: item2, label: Item 2 }

  - id: ts_show_line
    type: TreeInput
    properties:
      showLine: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      defaultExpandAll: true
      data:
        - { id: parent, label: Parent }
        - { id: child1, label: Child 1, parentId: parent }
        - { id: child2, label: Child 2, parentId: parent }

  - id: ts_checkable
    type: TreeInput
    properties:
      checkable: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: item1, label: Item 1 }
        - { id: item2, label: Item 2 }
        - { id: item3, label: Item 3 }

  - id: ts_onchange
    type: TreeInput
    properties:
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: parent, label: Parent }
        - { id: apple, label: Apple, parentId: parent }
        - { id: banana, label: Banana, parentId: parent }
    events:
      onChange:
        - id: set_onchange
          type: SetState
          params:
            ts_onchange_value:
              _state: ts_onchange

  - id: ts_onchange_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ts_onchange_value
              - null
          then:
            _string.concat:
              - 'Selected: '
              - _json.stringify:
                  - _state: ts_onchange_value
          else: ''

  - id: ts_interaction
    type: TreeInput
    properties:
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: fruits, label: Fruits }
        - { id: apple, label: Apple, parentId: fruits }
        - { id: banana, label: Banana, parentId: fruits }
        - { id: vegetables, label: Vegetables }
        - { id: carrot, label: Carrot, parentId: vegetables }

  # ============================================
  # ANTD 6.6 FEATURES
  # ============================================

  - id: ts_block_node
    type: TreeInput
    properties:
      blockNode: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: item1, label: Item 1 }
        - { id: item2, label: Item 2 }

  - id: ts_height
    type: TreeInput
    properties:
      height: 120
      defaultExpandAll: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: n1, label: Node 1 }
        - { id: n2, label: Node 2 }
        - { id: n3, label: Node 3 }
        - { id: n4, label: Node 4 }
        - { id: n5, label: Node 5 }
        - { id: n6, label: Node 6 }
        - { id: n7, label: Node 7 }
        - { id: n8, label: Node 8 }
        - { id: n9, label: Node 9 }
        - { id: n10, label: Node 10 }
        - { id: n11, label: Node 11 }
        - { id: n12, label: Node 12 }

  - id: ts_semantic_css
    type: TreeInput
    class:
      .item: ts-item-tailwind
      .itemTitle: ts-item-title-tailwind
      .itemSwitcher: ts-item-switcher-tailwind
    style:
      .itemTitle:
        fontStyle: italic
    properties:
      defaultExpandAll: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: parent, label: Parent }
        - { id: child, label: Child, parentId: parent }

  - id: ts_theme
    type: TreeInput
    properties:
      theme:
        indentSize: 40
        titleHeight: 32
      defaultExpandAll: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: parent, label: Parent }
        - { id: child, label: Child, parentId: parent }
