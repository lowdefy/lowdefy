id: controlledlist
type: Box

events:
  onInit:
    - id: set_defaults
      type: SetState
      params:
        controlledlist_with_items:
          - name: Item 1
          - name: Item 2
          - name: Item 3
        controlledlist_minitems:
          - name: Item 1
        controlledlist_remove:
          - name: Item A
          - name: Item B
          - name: Item C
        controlledlist_small_items:
          - name: Item 1
          - name: Item 2
        controlledlist_large_items:
          - name: Item 1
          - name: Item 2
        controlledlist_front_items:
          - name: Item 1
          - name: Item 2
        controlledlist_theme:
          - name: Item 1
          - name: Item 2
        controlledlist_theme_small:
          - name: Item 1
          - name: Item 2

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: controlledlist_basic
    type: ControlledList
    properties:
      title: Basic List

  - id: controlledlist_with_items
    type: ControlledList
    properties:
      title: List With Items
    slots:
      content:
        blocks:
          - id: controlledlist_with_items_text
            type: Span
            properties:
              content:
                _string.concat:
                  - 'Item: '
                  - _state: controlledlist_with_items.$.name

  # ============================================
  # STYLE TESTS
  # ============================================

  - id: controlledlist_small
    type: ControlledList
    properties:
      title: Small Size List
      size: small

  - id: controlledlist_large
    type: ControlledList
    properties:
      title: Large Size List
      size: large

  # ============================================
  # ADD BUTTON TESTS
  # ============================================

  - id: controlledlist_add_front
    type: ControlledList
    properties:
      title: Add to Front
      addToFront: true

  - id: controlledlist_hide_add
    type: ControlledList
    properties:
      title: Hidden Add Button
      hideAddButton: true

  - id: controlledlist_custom_add
    type: ControlledList
    properties:
      title: Custom Add Button
      addItemButton:
        title: New Entry
        type: primary

  # ============================================
  # EMPTY STATE
  # ============================================

  - id: controlledlist_nodata
    type: ControlledList
    properties:
      title: Empty List
      noDataTitle: No items available

  # ============================================
  # MIN ITEMS
  # ============================================

  - id: controlledlist_minitems
    type: ControlledList
    properties:
      title: Min Items List
      minItems: 2
    slots:
      content:
        blocks:
          - id: controlledlist_minitems_text
            type: Span
            properties:
              content:
                _string.concat:
                  - 'Name: '
                  - _state: controlledlist_minitems.$.name

  # ============================================
  # INTERACTION TESTS
  # ============================================

  - id: controlledlist_add
    type: ControlledList
    properties:
      title: Add Items List
    slots:
      content:
        blocks:
          - id: controlledlist_add_text
            type: Span
            properties:
              content:
                _string.concat:
                  - 'Index: '
                  - _index: true

  - id: controlledlist_remove
    type: ControlledList
    properties:
      title: Remove Items List
    slots:
      content:
        blocks:
          - id: controlledlist_remove_text
            type: Span
            properties:
              content:
                _string.concat:
                  - 'Item: '
                  - _state: controlledlist_remove.$.name

  # ============================================
  # LOOK: sizes, header-only lists and theme tokens
  # ============================================

  - id: controlledlist_small_items
    type: ControlledList
    properties:
      title: Small List With Items
      size: small
    slots:
      content:
        blocks:
          - id: controlledlist_small_items_text
            type: Span
            properties:
              content:
                _state: controlledlist_small_items.$.name

  - id: controlledlist_large_items
    type: ControlledList
    properties:
      title: Large List With Items
      size: large
    slots:
      content:
        blocks:
          - id: controlledlist_large_items_text
            type: Span
            properties:
              content:
                _state: controlledlist_large_items.$.name

  - id: controlledlist_front_items
    type: ControlledList
    properties:
      title: Add To Front With Items
      addToFront: true
    slots:
      content:
        blocks:
          - id: controlledlist_front_items_text
            type: Span
            properties:
              content:
                _state: controlledlist_front_items.$.name

  - id: controlledlist_theme
    type: ControlledList
    properties:
      title: Themed List
      theme:
        headerBg: 'rgb(230, 244, 255)'
        footerBg: 'rgb(246, 255, 237)'
        itemPadding: 20px 0
        colorSplit: 'rgb(255, 77, 79)'
        colorBorder: 'rgb(114, 46, 209)'
        borderRadiusLG: 2
    slots:
      content:
        blocks:
          - id: controlledlist_theme_text
            type: Span
            properties:
              content:
                _state: controlledlist_theme.$.name

  - id: controlledlist_theme_small
    type: ControlledList
    properties:
      title: Themed Small List
      size: small
      theme:
        itemPaddingSM: 2px 40px
    slots:
      content:
        blocks:
          - id: controlledlist_theme_small_text
            type: Span
            properties:
              content:
                _state: controlledlist_theme_small.$.name

  - id: controlledlist_theme_empty
    type: ControlledList
    properties:
      title: Themed Empty List
      hideAddButton: true
      theme:
        emptyTextPadding: 4
