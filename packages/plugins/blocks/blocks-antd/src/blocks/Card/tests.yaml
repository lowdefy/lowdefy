- id: default
  type: Card
- id: 'properties.title'
  type: Card
  properties:
    title: Card block
- id: 'properties.size: small'
  type: Card
  properties:
    size: small
    title: Card block small
- id: 'properties.bordered: false'
  type: Card
  properties:
    title: Card block
    bordered: false
- id: 'properties.hoverable: true'
  type: Card
  properties:
    title: Card block
    hoverable: true
- id: 'properties.inner: true'
  type: Card
  properties:
    title: Card block
    inner: true
- id: 'style.body: border: 5px solid blue'
  type: Card
  style:
    .body:
      border: 5px solid blue
  properties:
    title: Card block
- id: 'style.header: border: 5px solid blue'
  type: Card
  style:
    .header:
      border: 5px solid blue
  properties:
    title: Card block
- id: 'slots.extra:'
  type: Card
  properties:
    title: Card block
  slots:
    extra:
      blocks:
        - id: test
          type: Test
- id: 'with html in title'
  type: Card
  properties:
    title: <div style="color:green">Card Title</div>
- id: 'with onClick event'
  type: Card
  properties:
    title: Card block
  events:
    onClick:
      - id: message
        type: DisplayMessage
        params:
          content: Success
- id: 'properties.variant: borderless'
  type: Card
  properties:
    title: Card block
    variant: borderless
- id: 'properties.loading: true'
  type: Card
  properties:
    title: Card block
    loading: true
- id: 'slots.actions'
  type: Card
  properties:
    title: Card block
  slots:
    actions:
      blocks:
        - id: card_action_edit
          type: Button
          properties:
            title: Edit
            type: link
- id: 'properties.padding: compact'
  type: Card
  properties:
    padding: compact
- id: 'properties.padding: none'
  type: Card
  properties:
    padding: none
