id: config_provider
type: Box

events:
  onInit:
    - id: set_defaults
      type: SetState
      params:
        cp_disabled_list:
          - name: Item A
          - name: Item B

blocks:
  - id: cp_theme
    type: ConfigProvider
    properties:
      theme:
        colorPrimary: 'rgb(255, 0, 0)'
    blocks:
      - id: cp_theme_btn
        type: Button
        properties:
          title: Theme button
          type: primary

  - id: cp_token_wins
    type: ConfigProvider
    properties:
      theme:
        colorPrimary: 'rgb(255, 0, 0)'
      token:
        colorPrimary: 'rgb(0, 0, 255)'
    blocks:
      - id: cp_token_wins_btn
        type: Button
        properties:
          title: Token button
          type: primary

  - id: cp_size
    type: ConfigProvider
    properties:
      componentSize: small
    blocks:
      - id: cp_size_btn
        type: Button
        properties:
          title: Small button

  - id: cp_not_virtual
    type: ConfigProvider
    properties:
      virtual: false
    blocks:
      - id: cp_not_virtual_selector
        type: Selector
        properties:
          title: Not virtual
          options:
            - Option 1
            - Option 2
            - Option 3
            - Option 4
            - Option 5
            - Option 6
            - Option 7
            - Option 8
            - Option 9
            - Option 10
            - Option 11
            - Option 12
            - Option 13
            - Option 14
            - Option 15
            - Option 16
            - Option 17
            - Option 18
            - Option 19
            - Option 20
            - Option 21
            - Option 22
            - Option 23
            - Option 24
            - Option 25
            - Option 26
            - Option 27
            - Option 28
            - Option 29
            - Option 30
      - id: cp_not_virtual_multiple_selector
        type: MultipleSelector
        properties:
          title: Not virtual multiple
          options:
            - Option 1
            - Option 2
            - Option 3
            - Option 4
            - Option 5
            - Option 6
            - Option 7
            - Option 8
            - Option 9
            - Option 10
            - Option 11
            - Option 12
            - Option 13
            - Option 14
            - Option 15
            - Option 16
            - Option 17
            - Option 18
            - Option 19
            - Option 20
      - id: cp_not_virtual_tree_selector
        type: TreeSelector
        properties:
          title: Not virtual tree
          options:
            - Node 1
            - Node 2
            - Node 3
            - Node 4
            - Node 5
            - Node 6
            - Node 7
            - Node 8
            - Node 9
            - Node 10
            - Node 11
            - Node 12
            - Node 13
            - Node 14
            - Node 15
            - Node 16
            - Node 17
            - Node 18
            - Node 19
            - Node 20

  - id: cp_disabled
    type: ConfigProvider
    properties:
      componentDisabled: true
    blocks:
      - id: cp_disabled_text_input
        type: TextInput
        properties:
          title: Disabled by context
      - id: cp_disabled_button
        type: Button
        properties:
          title: Disabled by context
      - id: cp_disabled_selector
        type: Selector
        properties:
          title: Disabled by context
          options:
            - A
            - B
      - id: cp_disabled_date_selector
        type: DateSelector
        properties:
          title: Disabled by context
      - id: cp_disabled_switch
        type: Switch
        properties:
          title: Disabled by context
      - id: cp_disabled_tag_selector
        type: TagSelector
        properties:
          title: Disabled by context
          options:
            - X
            - Y
      - id: cp_disabled_segmented_selector
        type: SegmentedSelector
        properties:
          title: Disabled by context
          options:
            - X
            - Y
      - id: cp_disabled_button_selector
        type: ButtonSelector
        properties:
          title: Disabled by context
          options:
            - X
            - Y
      - id: cp_disabled_dropdown_button
        type: DropdownButton
        properties:
          title: Disabled by context
          trigger: hover
          items:
            - title: First item
              eventName: onFirst
      - id: cp_disabled_list
        type: ControlledList
        properties:
          title: Disabled by context
        slots:
          content:
            blocks:
              - id: cp_disabled_list.$.name
                type: TextInput
      - id: cp_enabled_text_input
        type: TextInput
        properties:
          title: Re-enabled with disabled false
          disabled: false
      - id: cp_enabled_button
        type: Button
        properties:
          title: Re-enabled with disabled false
          disabled: false
      - id: cp_enabled_tag_selector
        type: TagSelector
        properties:
          title: Re-enabled with disabled false
          disabled: false
          options:
            - X
            - Y

  - id: cp_disabled_false
    type: ConfigProvider
    properties:
      componentDisabled: false
    blocks:
      - id: cp_disabled_false_text_input
        type: TextInput
        properties:
          title: componentDisabled false
      - id: cp_disabled_false_disabled_input
        type: TextInput
        properties:
          title: Own disabled wins
          disabled: true
