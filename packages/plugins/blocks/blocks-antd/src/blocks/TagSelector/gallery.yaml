- title: Basic String Options
  blocks:
    - id: basic_strings
      type: TagSelector
      properties:
        title: Domains
        options:
          - Ethics
          - Environment
          - Governance
          - Social
          - Data Privacy

- title: Label-Value Options
  blocks:
    - id: label_value
      type: TagSelector
      properties:
        title: Status Filter
        options:
          - label: Draft
            value: draft
          - label: In Review
            value: in_review
          - label: Published
            value: published
          - label: Archived
            value: archived
            disabled: true

- title: Explicit Colors and Single Accent
  blocks:
    - id: explicit_colors
      type: TagSelector
      properties:
        title: Priority
        options:
          - label: Low
            value: low
            color: '#59A14F'
          - label: Medium
            value: medium
            color: '#EDC948'
          - label: High
            value: high
            color: '#E15759'
    - id: single_accent
      type: TagSelector
      properties:
        title: Interests
        colored: false
        options:
          - Design
          - Engineering
          - Product
          - Research
