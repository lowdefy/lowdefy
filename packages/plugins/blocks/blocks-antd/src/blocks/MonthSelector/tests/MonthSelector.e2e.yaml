id: monthselector
type: Box

events:
  onInit:
    - id: set_defaults
      type: SetState
      params:
        ms_with_value:
          _date: '2024-06-01'
        ms_clearable:
          _date: '2024-01-01'
        ms_onclear:
          _date: '2024-03-01'

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: ms_basic
    type: MonthSelector
    properties:
      title: Basic Month

  - id: ms_with_value
    type: MonthSelector
    properties:
      title: With Value

  # ============================================
  # PROPERTY TESTS
  # ============================================

  - id: ms_disabled
    type: MonthSelector
    properties:
      title: Disabled
      disabled: true

  - id: ms_small
    type: MonthSelector
    properties:
      title: Small Size
      size: small

  - id: ms_large
    type: MonthSelector
    properties:
      title: Large Size
      size: large

  - id: ms_placeholder
    type: MonthSelector
    properties:
      title: Custom Placeholder
      placeholder: Pick a month...

  - id: ms_borderless
    type: MonthSelector
    properties:
      title: Borderless
      bordered: false

  - id: ms_no_allowclear
    type: MonthSelector
    properties:
      title: No Allow Clear
      allowClear: false

  - id: ms_with_title
    type: MonthSelector
    properties:
      title: Month with Title

  - id: ms_with_label
    type: MonthSelector
    properties:
      title: Month Label
      label:
        extra: Select a month from the calendar

  # ============================================
  # EVENT TESTS
  # ============================================

  - id: ms_onchange
    type: MonthSelector
    properties:
      title: OnChange Test
    events:
      onChange:
        - id: set_onchange
          type: SetState
          params:
            ms_onchange_value:
              _event: value

  - id: ms_onchange_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ms_onchange_value
              - null
          then: Month selected
          else: ''

  # ============================================
  # INTERACTION TESTS
  # ============================================

  - id: ms_interaction
    type: MonthSelector
    properties:
      title: Interaction Test

  - id: ms_clearable
    type: MonthSelector
    properties:
      title: Clearable
      allowClear: true

  # ============================================
  # PRESETS
  # ============================================

  - id: ms_presets
    type: MonthSelector
    properties:
      title: Presets
      format: YYYY-MM
      presets:
        - label: March 2024
          value: '2024-03-01'
        - label: Month of mid 2024
          value:
            _date: '2024-06-15'

  # The recommended idiom for a relative shortcut: a local time chain ending in a format step, so
  # the preset selects the month the browser is in rather than the UTC month.
  - id: ms_presets_this_month
    type: MonthSelector
    properties:
      title: Presets This Month
      format: YYYY-MM
      presets:
        - label: This month
          value:
            _dayjs:
              - now
              - startOf: month
              - format: YYYY-MM-DD

  # ============================================
  # ANTD 6 FEATURES
  # ============================================

  - id: ms_underlined
    type: MonthSelector
    properties:
      title: Underlined
      variant: underlined

  - id: ms_prefix_text
    type: MonthSelector
    properties:
      title: Prefix Text
      prefix: From

  - id: ms_prefix_icon
    type: MonthSelector
    properties:
      title: Prefix Icon
      prefixIcon: clock

  - id: ms_readonly
    type: MonthSelector
    properties:
      title: Read-only Input
      inputReadOnly: true

  - id: ms_placement
    type: MonthSelector
    class:
      .popup: ms-custom-popup
    properties:
      title: Placement and Popup Class
      placement: bottomRight

  - id: ms_events
    type: MonthSelector
    properties:
      title: Focus, Blur and Open Events
    events:
      onFocus:
        - id: set_focus
          type: SetState
          params:
            ms_focus_event: true
      onBlur:
        - id: set_blur
          type: SetState
          params:
            ms_blur_event: true
      onOpenChange:
        - id: set_open
          type: SetState
          params:
            ms_open_event:
              _event: open

  - id: ms_focus_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ms_focus_event
              - null
          then:
            _string.concat:
              - 'Focus: '
              - _json.stringify:
                  - _state: ms_focus_event
          else: ''

  - id: ms_blur_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ms_blur_event
              - null
          then:
            _string.concat:
              - 'Blur: '
              - _json.stringify:
                  - _state: ms_blur_event
          else: ''

  - id: ms_open_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ms_open_event
              - null
          then:
            _string.concat:
              - 'Open: '
              - _json.stringify:
                  - _state: ms_open_event
          else: ''

  - id: ms_onclear
    type: MonthSelector
    properties:
      title: OnClear Test
    events:
      onClear:
        - id: set_onclear
          type: SetState
          params:
            ms_onclear_fired: true

  - id: ms_onclear_display
    type: Span
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: ms_onclear_fired
              - true
          then: Clear fired
          else: ''
