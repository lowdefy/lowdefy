id: float_button
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: fb_basic
    type: FloatButton
    properties:
      icon: help

  # ============================================
  # PRIMARY TYPE
  # ============================================

  - id: fb_primary
    type: FloatButton
    properties:
      type: primary
      icon: help

  # ============================================
  # EVENT TESTS
  # ============================================

  - id: fb_click
    type: FloatButton
    properties:
      icon: add
    events:
      onClick:
        - id: set_fb_clicked
          type: SetState
          params:
            fb_clicked: true

  - id: fb_click_display
    type: Paragraph
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: fb_clicked
              - true
          then: Clicked!
          else: ''

  # ============================================
  # TOOLTIP TEST
  # ============================================

  - id: fb_tooltip
    type: FloatButton
    properties:
      tooltip: Help
      icon: help

  # ============================================
  # CONTENT, DISABLED AND BACK TO TOP
  # ============================================

  - id: fb_description
    type: FloatButton
    style:
      .element:
        insetInlineEnd: 96px
    properties:
      shape: square
      icon: help
      description: HELP

  - id: fb_default_icon
    type: FloatButton
    style:
      .element:
        insetInlineEnd: 152px
    properties:
      tooltip: No icon set

  - id: fb_disabled
    type: FloatButton
    style:
      .element:
        insetInlineEnd: 208px
    properties:
      icon: add
      disabled: true
    events:
      onClick:
        - id: set_fb_disabled_clicked
          type: SetState
          params:
            fb_disabled_clicked: true

  - id: fb_disabled_display
    type: Paragraph
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: fb_disabled_clicked
              - true
          then: disabled:clicked
          else: disabled:idle

  - id: fb_back_top
    type: FloatButton
    style:
      .element:
        insetInlineEnd: 264px
    properties:
      backTop: true
      showProgress: true
      visibilityHeight: 0
    events:
      onClick:
        - id: set_fb_back_top_clicked
          type: SetState
          params:
            fb_back_top_clicked: true

  - id: fb_back_top_display
    type: Paragraph
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: fb_back_top_clicked
              - true
          then: backtop:clicked
          else: backtop:idle
