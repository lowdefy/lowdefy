- id: default
  type: DropdownMenu
  properties:
    links:
      - id: profile
        type: MenuLink
        pageId: profile
        properties:
          title: Profile
  blocks:
    - id: default_trigger
      type: Button
      properties:
        title: Account
- id: 'properties.placement: right'
  type: DropdownMenu
  properties:
    trigger: click
    placement: right
    links:
      - id: settings
        type: MenuLink
        pageId: settings
        properties:
          title: Settings
  blocks:
    - id: placement_trigger
      type: Button
      properties:
        title: More
- id: 'properties.selectable: true'
  type: DropdownMenu
  properties:
    trigger: click
    selectable: true
    links:
      - id: newest
        type: MenuLink
        properties:
          title: Newest first
      - id: oldest
        type: MenuLink
        properties:
          title: Oldest first
  blocks:
    - id: selectable_trigger
      type: Button
      properties:
        title: Sort
