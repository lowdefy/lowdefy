  properties:
    centered: true
- id: 'properties: closable: false'
  type: Modal
  properties:
    closable: false
- id: 'properties: footer: false'
  type: Modal
  properties:
    footer: false
- id: 'properties: mask: false'
  type: Modal
  properties:
    mask: false
- id: 'properties: maskClosable: false'
  type: Modal
  properties:
    maskClosable: false
- id: 'properties: okText: Text of the OK button'
  type: Modal
