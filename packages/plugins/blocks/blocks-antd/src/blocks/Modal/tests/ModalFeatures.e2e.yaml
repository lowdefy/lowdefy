id: modal_features
type: Box

blocks:
  - id: modal_blur
    type: Modal
    properties:
      title: Blur
      mask:
        blur: true
    slots:
      content:
        blocks:
          - id: modal_blur_text
            type: Paragraph
            properties:
              content: Content of modal_blur.

  - id: open_modal_blur
    type: Button
    properties:
      title: Open modal_blur
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_blur
            method: setOpen
            args:
              - open: true

  - id: modal_mask_object_not_closable
    type: Modal
    properties:
      title: Mask object not closable
      maskClosable: true
      mask:
        closable: false
    slots:
      content:
        blocks:
          - id: modal_mask_object_not_closable_text
            type: Paragraph
            properties:
              content: Content of modal_mask_object_not_closable.

  - id: open_modal_mask_object_not_closable
    type: Button
    properties:
      title: Open modal_mask_object_not_closable
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_mask_object_not_closable
            method: setOpen
            args:
              - open: true

  - id: modal_close_disabled
    type: Modal
    properties:
      title: Close disabled
      closable:
        disabled: true
    slots:
      content:
        blocks:
          - id: modal_close_disabled_text
            type: Paragraph
            properties:
              content: Content of modal_close_disabled.

  - id: open_modal_close_disabled
    type: Button
    properties:
      title: Open modal_close_disabled
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_close_disabled
            method: setOpen
            args:
              - open: true

  - id: modal_no_keyboard
    type: Modal
    properties:
      title: No keyboard
      keyboard: false
    slots:
      content:
        blocks:
          - id: modal_no_keyboard_text
            type: Paragraph
            properties:
              content: Content of modal_no_keyboard.

  - id: open_modal_no_keyboard
    type: Button
    properties:
      title: Open modal_no_keyboard
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_no_keyboard
            method: setOpen
            args:
              - open: true

  - id: modal_loading
    type: Modal
    properties:
      title: Loading
      loading: true
    slots:
      content:
        blocks:
          - id: modal_loading_text
            type: Paragraph
            properties:
              content: Content of modal_loading.

  - id: open_modal_loading
    type: Button
    properties:
      title: Open modal_loading
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_loading
            method: setOpen
            args:
              - open: true

  - id: modal_styled
    type: Modal
    properties:
      title: Styled
    class:
      .content: modal-styled-content
      .title: modal-styled-title
    style:
      .header:
        background: rgb(255, 0, 0)
      .content:
        border: 3px solid rgb(0, 0, 255)
    slots:
      content:
        blocks:
          - id: modal_styled_text
            type: Paragraph
            properties:
              content: Content of modal_styled.

  - id: open_modal_styled
    type: Button
    properties:
      title: Open modal_styled
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_styled
            method: setOpen
            args:
              - open: true

  - id: modal_after_open_change
    type: Modal
    properties:
      title: After open change
    events:
      afterOpenChange:
        - id: set_after_open_change
          type: SetState
          params:
            after_open_change:
              _if:
                test:
                  _event: open
                then: opened
                else: closed
    slots:
      content:
        blocks:
          - id: modal_after_open_change_text
            type: Paragraph
            properties:
              content: Content of modal_after_open_change.

  - id: open_modal_after_open_change
    type: Button
    properties:
      title: Open modal_after_open_change
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_after_open_change
            method: setOpen
            args:
              - open: true

  - id: after_open_change_display
    type: Span
    properties:
      content:
        _if_none:
          - _state: after_open_change
          - ''

  - id: modal_force_render
    type: Modal
    properties:
      title: Force render
      forceRender: true
    slots:
      content:
        blocks:
          - id: modal_force_render_text
            type: Paragraph
            properties:
              content: Content of modal_force_render.

  - id: open_modal_force_render
    type: Button
    properties:
      title: Open modal_force_render
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_force_render
            method: setOpen
            args:
              - open: true

  - id: modal_destroy_on_hidden
    type: Modal
    properties:
      title: Destroy on hidden
      destroyOnHidden: true
    slots:
      content:
        blocks:
          - id: modal_destroy_on_hidden_text
            type: Paragraph
            properties:
              content: Content of modal_destroy_on_hidden.

  - id: open_modal_destroy_on_hidden
    type: Button
    properties:
      title: Open modal_destroy_on_hidden
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_destroy_on_hidden
            method: setOpen
            args:
              - open: true

  - id: modal_responsive_width
    type: Modal
    properties:
      title: Responsive width
      width:
        xs: 300
        md: 640
    slots:
      content:
        blocks:
          - id: modal_responsive_width_text
            type: Paragraph
            properties:
              content: Content of modal_responsive_width.

  - id: open_modal_responsive_width
    type: Button
    properties:
      title: Open modal_responsive_width
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_responsive_width
            method: setOpen
            args:
              - open: true

  - id: modal_no_scroll_lock
    type: Modal
    properties:
      title: No scroll lock
      scrollLock: false
    slots:
      content:
        blocks:
          - id: modal_no_scroll_lock_text
            type: Paragraph
            properties:
              content: Content of modal_no_scroll_lock.

  - id: open_modal_no_scroll_lock
    type: Button
    properties:
      title: Open modal_no_scroll_lock
    events:
      onClick:
        - id: open_modal
          type: CallMethod
          params:
            blockId: modal_no_scroll_lock
            method: setOpen
            args:
              - open: true
