id: paragraph
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: para_basic
    type: Paragraph
    properties:
      content: This is a basic paragraph.

  - id: para_html
    type: Paragraph
    properties:
      content: '<strong>Bold</strong> and <em>italic</em> text.'

  # ============================================
  # STYLE TESTS
  # ============================================

  - id: para_code
    type: Paragraph
    properties:
      content: Code paragraph
      code: true

  - id: para_italic
    type: Paragraph
    properties:
      content: Italic paragraph
      italic: true

  - id: para_strong
    type: Paragraph
    properties:
      content: Strong paragraph
      strong: true

  - id: para_underline
    type: Paragraph
    properties:
      content: Underline paragraph
      underline: true

  - id: para_delete
    type: Paragraph
    properties:
      content: Delete paragraph
      delete: true

  - id: para_mark
    type: Paragraph
    properties:
      content: Marked paragraph
      mark: true

  - id: para_disabled
    type: Paragraph
    properties:
      content: Disabled paragraph
      disabled: true

  # ============================================
  # TYPE TESTS
  # ============================================

  - id: para_secondary
    type: Paragraph
    properties:
      content: Secondary paragraph
      type: secondary

  - id: para_success
    type: Paragraph
    properties:
      content: Success paragraph
      type: success

  - id: para_warning
    type: Paragraph
    properties:
      content: Warning paragraph
      type: warning

  - id: para_danger
    type: Paragraph
    properties:
      content: Danger paragraph
      type: danger

  # ============================================
  # COPYABLE TESTS
  # ============================================

  - id: para_copyable
    type: Paragraph
    properties:
      content: Copy this paragraph
      copyable: true

  - id: para_copyable_event
    type: Paragraph
    properties:
      content: Copy me
      copyable:
        text: Custom copy text
    events:
      onCopy:
        - id: set_oncopy
          type: SetState
          params:
            para_oncopy_fired: true

  - id: oncopy_display
    type: Span
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: para_oncopy_fired
              - true
          then: Copy fired
          else: ''

  # ============================================
  # ELLIPSIS TESTS
  # ============================================

  - id: para_ellipsis
    type: Paragraph
    properties:
      content: This is a very long paragraph that should be truncated with ellipsis when it exceeds a certain number of rows. The content continues to demonstrate the ellipsis functionality.
      ellipsis:
        rows: 2
    style:
      .element:
        width: 300px

  # ============================================
  # KEYBOARD, TYPE DEFAULT, ACTIONS AND ELLIPSIS OPTIONS
  # ============================================

  - id: para_keyboard
    type: Paragraph
    properties:
      content: Ctrl
      keyboard: true

  - id: para_type_default
    type: Paragraph
    properties:
      content: Default type
      type: default

  - id: para_actions_start
    type: Paragraph
    class:
      .actions: para-actions-class
    properties:
      content: Actions before the text
      copyable: true
      actions:
        placement: start

  - id: para_ellipsis_collapsible
    type: Paragraph
    style:
      .element:
        width: 300
    properties:
      content: This is a long piece of text that is truncated to a single row until the reader expands it, and it keeps going so that it is always longer than the box it sits in.
      ellipsis:
        rows: 1
        expandable: collapsible
        symbol:
          - Show more
          - Show less
    events:
      onExpand:
        - id: set_para_expanded
          type: SetState
          params:
            para_expanded:
              _event: expanded

  - id: para_expanded_display
    type: Span
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: para_expanded
              - true
          then: Expanded
          else: Collapsed

  - id: para_ellipsis_default_expanded
    type: Paragraph
    style:
      .element:
        width: 300
    properties:
      content: This is a long piece of text that is truncated to a single row until the reader expands it, and it keeps going so that it is always longer than the box it sits in.
      ellipsis:
        rows: 1
        expandable: collapsible
        defaultExpanded: true

  - id: para_ellipsis_tooltip
    type: Paragraph
    style:
      .element:
        width: 200
    properties:
      content: This is a long piece of text that is truncated to a single row until the reader expands it, and it keeps going so that it is always longer than the box it sits in.
      ellipsis:
        tooltip: Full text in a tooltip

  - id: para_ellipsis_selection
    type: Paragraph
    style:
      .element:
        width: 300
    properties:
      content: Selectable text that is cut to a single row with an expand button after it, so it is always longer than its box.
      ellipsis:
        rows: 1
        expandable: true
    events:
      onTextSelection:
        - id: set_para_selection
          type: SetState
          params:
            para_selection:
              _event: selection

  - id: para_selection_display
    type: Span
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: para_selection
              - Selectable
          then: Selected Selectable
          else: Nothing selected
