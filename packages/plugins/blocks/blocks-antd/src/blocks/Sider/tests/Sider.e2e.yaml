id: sider
type: Box

events:
  onInit:
    - id: set_sider_null_value
      type: SetState
      params:
        sider_null_value: null

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: sider_basic
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_basic_sider
            type: Sider
            properties:
              initialCollapsed: false
            slots:
              content:
                blocks:
                  - id: sider_basic_content
                    type: Span
                    properties:
                      content: Sider content

  # ============================================
  # THEME TESTS
  # ============================================

  - id: sider_theme_light
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_theme_light_sider
            type: Sider
            properties:
              theme: light
              initialCollapsed: false
            slots:
              content:
                blocks:
                  - id: sider_theme_light_content
                    type: Span
                    properties:
                      content: Light sider

  - id: sider_theme_dark
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_theme_dark_sider
            type: Sider
            properties:
              theme: dark
              initialCollapsed: false
            slots:
              content:
                blocks:
                  - id: sider_theme_dark_content
                    type: Span
                    properties:
                      content: Dark sider

  # ============================================
  # COLLAPSED TESTS
  # ============================================

  - id: sider_collapsed
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_collapsed_sider
            type: Sider
            properties:
              initialCollapsed: true
              collapsible: true
            slots:
              content:
                blocks:
                  - id: sider_collapsed_content
                    type: Span
                    properties:
                      content: Collapsed sider

  - id: sider_expanded
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_expanded_sider
            type: Sider
            properties:
              initialCollapsed: false
              collapsible: true
            slots:
              content:
                blocks:
                  - id: sider_expanded_content
                    type: Span
                    properties:
                      content: Expanded sider

  # ============================================
  # WIDTH TESTS
  # ============================================

  - id: sider_custom_width
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_custom_width_sider
            type: Sider
            properties:
              width: 300
              initialCollapsed: false
            slots:
              content:
                blocks:
                  - id: sider_custom_width_content
                    type: Span
                    properties:
                      content: Wide sider

  # ============================================
  # COLLAPSIBLE TESTS
  # ============================================

  - id: sider_collapsible
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_collapsible_sider
            type: Sider
            properties:
              collapsible: true
              initialCollapsed: false
            slots:
              content:
                blocks:
                  - id: sider_collapsible_content
                    type: Span
                    properties:
                      content: Collapsible sider
            events:
              onClose:
                - id: set_sider_collapsible_closed
                  type: SetState
                  params:
                    sider_collapsible_closed: true

  - id: sider_collapsible_display
    type: Span
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: sider_collapsible_closed
              - true
          then: sider:closed
          else: sider:open

  # ============================================
  # BODY CSS KEY AND BREAKPOINT
  # ============================================

  - id: sider_body
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_body_sider
            type: Sider
            class:
              .body: sider-custom-body
            style:
              .body:
                padding: 12px
            properties:
              initialCollapsed: false
              breakpoint: xxxl
            events:
              onBreakpoint:
                - id: set_sider_broken
                  type: SetState
                  params:
                    sider_broken:
                      _event: broken
            slots:
              content:
                blocks:
                  - id: sider_body_content
                    type: Span
                    properties:
                      content: Sider body

  - id: sider_broken_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'broken:'
          - _if_none:
              - _state: sider_broken
              - unset

  # ============================================
  # NULL PROPERTIES (as an unset module var property gives them)
  # ============================================

  - id: sider_null_widths
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_null_widths_sider
            type: Sider
            properties:
              width: 232
              initialCollapsed: false
              collapsedWidth:
                _state: sider_null_value
              breakpoint:
                _state: sider_null_value
            slots:
              content:
                blocks:
                  - id: sider_null_widths_content
                    type: Span
                    properties:
                      content: Null widths sider

  - id: sider_null_widths_toggle
    type: Button
    properties:
      title: Toggle null widths sider
    events:
      onClick:
        - id: toggle_sider_null_widths
          type: CallMethod
          params:
            blockId: sider_null_widths_sider
            method: toggleOpen

  - id: sider_null_widths_collapsed
    type: Layout
    slots:
      content:
        blocks:
          - id: sider_null_widths_collapsed_sider
            type: Sider
            properties:
              initialCollapsed: true
              collapsedWidth:
                _state: sider_null_value
              width:
                _state: sider_null_value
            slots:
              content:
                blocks:
                  - id: sider_null_widths_collapsed_content
                    type: Span
                    properties:
                      content: Collapsed null widths

  - id: sider_null_widths_collapsed_toggle
    type: Button
    properties:
      title: Toggle collapsed null widths sider
    events:
      onClick:
        - id: toggle_sider_null_widths_collapsed
          type: CallMethod
          params:
            blockId: sider_null_widths_collapsed_sider
            method: toggleOpen
