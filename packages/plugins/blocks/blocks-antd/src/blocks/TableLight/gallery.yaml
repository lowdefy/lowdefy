- title: Recent orders with a row link and a summary
  fullWidth: true
  blocks:
    - id: orders_table
      type: TableLight
      properties:
        rowLink:
          pageId: order
          urlQuery:
            _id: _id
        columns:
          - key: number
            title: Order
          - key: customer
            type: avatar
          - key: status
            type: tag
            options:
              pending: { label: Pending, color: warning }
              shipped: { label: Shipped, color: processing }
              delivered: { label: Delivered, color: success }
              cancelled: { label: Cancelled, color: error }
          - key: total
            type: currency
            cell:
              currency: USD
            aggregate: sum
          - key: placed
            type: date
            cell:
              relative: true
        data:
          - {
              _id: o1,
              number: ORD-1042,
              customer: Sarah Johnson,
              status: delivered,
              total: 129.97,
              placed: '2026-09-20T10:15:00',
            }
          - {
              _id: o2,
              number: ORD-1043,
              customer: Alex Chen,
              status: shipped,
              total: 54.5,
              placed: '2026-09-24T16:40:00',
            }
          - {
              _id: o3,
              number: ORD-1044,
              customer: Maria Garcia,
              status: pending,
              total: 310,
              placed: '2026-09-27T08:05:00',
            }
          - {
              _id: o4,
              number: ORD-1045,
              customer: Jordan Rivera,
              status: cancelled,
              total: 18.99,
              placed: '2026-09-27T12:30:00',
            }

- title: Cell types
  fullWidth: true
  blocks:
    - id: cell_types_table
      type: TableLight
      properties:
        columns:
          - key: company
            type: relation
            cell:
              labelField: name
          - key: owners
            type: people
          - key: stage
            type: status
            options:
              - { value: lead, label: Lead, color: default }
              - { value: qualified, label: Qualified, color: processing }
              - { value: won, label: Won, color: success }
          - key: labels
            type: tags
            cell:
              max: 2
          - key: probability
            type: percent
          - key: health
            type: progress
          - key: rating
            type: rating
          - key: active
            type: boolean
          - key: website
            type: url
          - key: phone
            type: phone
        data:
          - _id: d1
            company: { _id: c1, name: Acme Ltd }
            owners: [{ name: Ann Lee }, { name: Bob Stone }, { name: Cy Dunn }, { name: Di Park }]
            stage: won
            labels: [enterprise, renewal, priority]
            probability: 0.9
            health: 82
            rating: 4
            active: true
            website: acme.example.com
            phone: '+1 555 010 2000'
          - _id: d2
            company: { _id: c2, name: Globex }
            owners: [{ name: Bob Stone }]
            stage: qualified
            labels: [smb]
            probability: 0.4
            health: 35
            rating: 3
            active: false
            website: https://globex.example.com
            phone: '+1 555 010 3000'

- title: Conditional formatting and templates
  fullWidth: true
  blocks:
    - id: rules_table
      type: TableLight
      properties:
        size: compact
        bordered: true
        rowRules:
          - when: { key: overdue, op: isTrue }
            style:
              fontStyle: italic
        columns:
          - key: task
          - key: score
            type: number
            rules:
              - when: { op: gte, value: 8 }
                color: success
              - when: { op: lt, value: 5 }
                color: error
          - key: summary
            type: html
            ellipsis: 2
            width: 260
            cell:
              template: '<b>{{ row.task }}</b>: {{ value }}'
          - key: overdue
            type: boolean
            cell:
              trueLabel: Overdue
              falseLabel: On time
              trueColor: error
        data:
          - {
              _id: t1,
              task: Onboarding,
              score: 9,
              summary: Welcome pack sent and first call booked.,
              overdue: false,
            }
          - {
              _id: t2,
              task: Renewal,
              score: 4,
              summary: Waiting on the signed order form from procurement.,
              overdue: true,
            }
          - {
              _id: t3,
              task: Upsell,
              score: 6,
              summary: Demo scheduled for next week.,
              overdue: false,
            }

- title: Row buttons and menus
  fullWidth: true
  blocks:
    - id: actions_table
      type: TableLight
      properties:
        columns:
          - key: name
          - key: email
            type: email
          - key: actions
            type: buttons
            align: end
            cell:
              showOn: hover
              buttons:
                - eventName: onEdit
                  title: Edit
                  icon: edit
                - eventName: onArchive
                  title: Archive
                  icon: Archive
                  hideTitle: true
                  hidden:
                    when: { key: archived, op: isTrue }
          - key: more
            title: ''
            type: menu
            width: 48
            cell:
              items:
                - eventName: onDuplicate
                  title: Duplicate
                - eventName: onDelete
                  title: Delete
                  danger: true
        data:
          - { _id: u1, name: Sarah Johnson, email: sarah@example.com, archived: false }
          - { _id: u2, name: Alex Chen, email: alex@example.com, archived: true }
      events:
        onEdit:
          - id: edit_message
            type: DisplayMessage
            params:
              content:
                _string.concat:
                  - 'Edit '
                  - _event: row.name

