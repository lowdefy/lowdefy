      type: TableLight
      properties:
        columns:
          - name
          - key: email
            type: email
          - key: role
          - key: joined
            type: date
        data:
          - {
              _id: 1,
              name: Sarah Johnson,
              email: sarah@example.com,
              role: Engineer,
              joined: '2023-04-12',
            }
          - {
              _id: 2,
              name: Alex Chen,
              email: alex@example.com,
              role: Product,
              joined: '2022-11-01',
            }
          - {
              _id: 3,
              name: Maria Garcia,
