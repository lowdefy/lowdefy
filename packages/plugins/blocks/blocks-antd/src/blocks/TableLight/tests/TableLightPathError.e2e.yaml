# A cell link to a patterned page that misses a placeholder, on a page of its own because the
# block fails to render and logs the error on every load.
id: tablelight-path-error
type: Box
blocks:
  - id: tl_path_params_ok
    type: Span
    properties:
      content: Path error page
  - id: tl_path_params_missing
    type: TableLight
    properties:
      columns:
        - key: link
          type: link
          cell:
            pageId: tablelight-path-target
            pathParams: { space: space }
      data:
        - { _id: t2, space: support, link: Broken link }
