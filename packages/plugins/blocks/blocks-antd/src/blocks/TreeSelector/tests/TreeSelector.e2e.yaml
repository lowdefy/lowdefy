id: treeselector
type: Box

events:
  onInit:
    - id: set_defaults
      type: SetState
      params:
        tsel_with_value: apple

blocks:
  - id: tsel_basic
    type: TreeSelector
    properties:
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      treeDefaultExpandAll: true
      data:
        - { id: fruit, label: Fruit }
        - { id: apple, label: Apple, parentId: fruit }
        - { id: banana, label: Banana, parentId: fruit }
        - { id: veg, label: Vegetables }
        - { id: carrot, label: Carrot, parentId: veg }
    events:
      onChange:
        - id: set_basic_value
          type: SetState
          params:
            tsel_basic_event:
              _event: value

  - id: tsel_basic_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'Value: '
          - _json.stringify:
              - _state: tsel_basic_event

  - id: tsel_with_value
    type: TreeSelector
    properties:
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: fruit, label: Fruit }
        - { id: apple, label: Apple, parentId: fruit }

  - id: tsel_search
    type: TreeSelector
    properties:
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      treeDefaultExpandAll: true
      data:
        - { id: fruit, label: Fruit }
        - { id: apple, label: Apple, parentId: fruit }
        - { id: banana, label: Banana, parentId: fruit }
    events:
      onSearch:
        - id: set_search
          type: SetState
          params:
            tsel_search_value:
              _event: value

  - id: tsel_search_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'Search: '
          - _state: tsel_search_value

  - id: tsel_tree_line
    type: TreeSelector
    properties:
      treeLine: true
      treeDefaultExpandAll: true
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: fruit, label: Fruit }
        - { id: apple, label: Apple, parentId: fruit }

  - id: tsel_expand_action
    type: TreeSelector
    properties:
      treeExpandAction: click
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: fruit, label: Fruit, selectable: false }
        - { id: apple, label: Apple, parentId: fruit }

  - id: tsel_placement_popup
    type: TreeSelector
    class:
      .popup: tsel-popup-tailwind
    properties:
      placement: topRight
      primaryKey: id
      parentKey: parentId
      valueKey: id
      html: '{{ item.label }}'
      data:
        - { id: fruit, label: Fruit }

  - id: tsel_prefix_icon
    type: TreeSelector
    properties:
      prefixIcon: search
      options:
        - label: Fruit
          value: fruit

  - id: tsel_loading
    type: TreeSelector
    loading: true
    properties:
      options:
        - label: Fruit
          value: fruit

  - id: tsel_theme
    type: TreeSelector
    properties:
      theme:
        selectorBg: 'rgb(255, 240, 246)'
        nodeSelectedBg: 'rgb(255, 214, 231)'
      treeDefaultExpandAll: true
      options:
        - label: Fruit
          value: fruit

  - id: tsel_open_change
    type: TreeSelector
    properties:
      options:
        - label: Fruit
          value: fruit
    events:
      onOpenChange:
        - id: set_open
          type: SetState
          params:
            tsel_open_state:
              _event: open

  - id: tsel_open_change_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'Open: '
          - _json.stringify:
              - _state: tsel_open_state

  - id: tsel_selector_css
    type: TreeSelector
    style:
      .selector:
        padding: 12px
    properties:
      options:
        - label: Fruit
          value: fruit
