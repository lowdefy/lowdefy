id: daterangeselector
type: Box

events:
  onInit:
    - id: set_defaults
      type: SetState
      params:
        drs_with_value:
          - _date: '2024-06-01'
          - _date: '2024-06-30'
        drs_clearable:
          - _date: '2024-01-01'
          - _date: '2024-01-31'
        drs_onclear:
          - _date: '2024-03-01'
          - _date: '2024-03-10'
        drs_disabled_start:
          - _date: '2024-06-01'
          - _date: '2024-06-30'

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: drs_basic
    type: DateRangeSelector
    properties:
      title: Basic Date Range

  - id: drs_with_value
    type: DateRangeSelector
    properties:
      title: With Value

  # ============================================
  # PROPERTY TESTS
  # ============================================

  - id: drs_disabled
    type: DateRangeSelector
    properties:
      title: Disabled
      disabled: true

  - id: drs_small
    type: DateRangeSelector
    properties:
      title: Small Size
      size: small

  - id: drs_large
    type: DateRangeSelector
    properties:
      title: Large Size
      size: large

  - id: drs_placeholder
    type: DateRangeSelector
    properties:
      title: Custom Placeholder
      placeholder:
        - From date
        - To date

  - id: drs_borderless
    type: DateRangeSelector
    properties:
      title: Borderless
      bordered: false

  - id: drs_no_allowclear
    type: DateRangeSelector
    properties:
      title: No Allow Clear
      allowClear: false

  - id: drs_separator
    type: DateRangeSelector
    properties:
      title: Custom Separator
      separator: ' to '

  - id: drs_with_title
    type: DateRangeSelector
    properties:
      title: Date Range with Title

  - id: drs_with_label
    type: DateRangeSelector
    properties:
      title: Date Range Label
      label:
        extra: Select start and end dates

  # ============================================
  # EVENT TESTS
  # ============================================

  - id: drs_onchange
    type: DateRangeSelector
    properties:
      title: OnChange Test
    events:
      onChange:
        - id: set_onchange
          type: SetState
          params:
            drs_onchange_value:
              _event: value

  - id: drs_onchange_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: drs_onchange_value
              - null
          then: Range selected
          else: ''

  # ============================================
  # INTERACTION TESTS
  # ============================================

  - id: drs_interaction
    type: DateRangeSelector
    properties:
      title: Interaction Test

  - id: drs_clearable
    type: DateRangeSelector
    properties:
      title: Clearable
      allowClear: true

  # ============================================
  # PRESETS
  # ============================================

  - id: drs_presets
    type: DateRangeSelector
    properties:
      title: Presets
      format: YYYY-MM-DD
      presets:
        - label: Q1 2024
          value: ['2024-01-01', '2024-03-31']
        - label: Q2 2024
          value:
            - _date: '2024-04-01'
            - _date: '2024-06-30'
        - label: '<b>Html label</b>'
          value: ['2024-07-01', '2024-09-30']

  - id: drs_no_presets
    type: DateRangeSelector
    properties:
      title: No Presets

  - id: drs_presets_min_now
    type: DateRangeSelector
    properties:
      title: Presets with a minimum date
      format: YYYY-MM-DD
      disabledDates:
        min:
          _dayjs: [now, { format: YYYY-MM-DD }]
      presets:
        - label: Last 7 Days
          value:
            - _dayjs: [now, { subtract: [7, days] }, { format: YYYY-MM-DD }]
            - _dayjs: [now, { format: YYYY-MM-DD }]
        - label: Next 7 Days
          value:
            - _dayjs: [now, { format: YYYY-MM-DD }]
            - _dayjs: [now, { add: [7, days] }, { format: YYYY-MM-DD }]
        - label: Last Year
          value: ['2025-01-01', '2025-12-31']

  - id: drs_presets_max_now
    type: DateRangeSelector
    properties:
      title: Presets with a maximum date
      format: YYYY-MM-DD
      disabledDates:
        max:
          _dayjs: [now, { format: YYYY-MM-DD }]
      presets:
        - label: Next 7 Days
          value:
            - _dayjs: [now, { format: YYYY-MM-DD }]
            - _dayjs: [now, { add: [7, days] }, { format: YYYY-MM-DD }]

  # ============================================
  # ANTD 6 FEATURES
  # ============================================

  - id: drs_underlined
    type: DateRangeSelector
    properties:
      title: Underlined
      variant: underlined

  - id: drs_prefix_text
    type: DateRangeSelector
    properties:
      title: Prefix Text
      prefix: From

  - id: drs_prefix_icon
    type: DateRangeSelector
    properties:
      title: Prefix Icon
      prefixIcon: clock

  - id: drs_readonly
    type: DateRangeSelector
    properties:
      title: Read-only Input
      inputReadOnly: true

  - id: drs_placement
    type: DateRangeSelector
    class:
      .popup: drs-custom-popup
    properties:
      title: Placement and Popup Class
      placement: bottomRight

  - id: drs_events
    type: DateRangeSelector
    properties:
      title: Focus, Blur and Open Events
    events:
      onFocus:
        - id: set_focus
          type: SetState
          params:
            drs_focus_event:
              _event: range
      onBlur:
        - id: set_blur
          type: SetState
          params:
            drs_blur_event:
              _event: range
      onOpenChange:
        - id: set_open
          type: SetState
          params:
            drs_open_event:
              _event: open

  - id: drs_focus_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: drs_focus_event
              - null
          then:
            _string.concat:
              - 'Focus: '
              - _json.stringify:
                  - _state: drs_focus_event
          else: ''

  - id: drs_blur_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: drs_blur_event
              - null
          then:
            _string.concat:
              - 'Blur: '
              - _json.stringify:
                  - _state: drs_blur_event
          else: ''

  - id: drs_open_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: drs_open_event
              - null
          then:
            _string.concat:
              - 'Open: '
              - _json.stringify:
                  - _state: drs_open_event
          else: ''

  - id: drs_onclear
    type: DateRangeSelector
    properties:
      title: OnClear Test
    events:
      onClear:
        - id: set_onclear
          type: SetState
          params:
            drs_onclear_fired: true

  - id: drs_onclear_display
    type: Span
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: drs_onclear_fired
              - true
          then: Clear fired
          else: ''

  - id: drs_show_week
    type: DateRangeSelector
    properties:
      title: Show Week
      showWeek: true

  - id: drs_allow_empty
    type: DateRangeSelector
    properties:
      title: Open End
      format: YYYY-MM-DD
      allowEmpty:
        - false
        - true

  - id: drs_allow_empty_display
    type: Span
    properties:
      content:
        _if:
          test:
            _and:
              - _ne:
                  - _state: drs_allow_empty.0
                  - null
              - _eq:
                  - _state: drs_allow_empty.1
                  - null
          then: Open end
          else: ''

  - id: drs_disabled_start
    type: DateRangeSelector
    properties:
      title: Fixed Start
      disabled:
        - true
        - false
