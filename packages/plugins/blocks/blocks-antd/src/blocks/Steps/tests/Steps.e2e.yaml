id: steps
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: steps_basic
    type: Steps
    class:
      .item: steps-custom-item
      .itemTitle: steps-custom-title
      .itemContent: steps-custom-content
    properties:
      current: 1
      size: default
      items:
        - title: Cart
          description: Review items
        - title: Payment
          subTitle: Card or EFT
          description: Pay securely
        - title: Done
          description: Order placed

  # ============================================
  # DOT STYLE
  # ============================================

  - id: steps_progress_dot
    type: Steps
    properties:
      current: 1
      progressDot: true
      items:
        - title: One
        - title: Two
        - title: Three

  # ============================================
  # MAX COUNT
  # ============================================

  - id: steps_max_count
    type: Steps
    properties:
      current: 4
      maxCount: 5
      items:
        - title: Step 1
        - title: Step 2
        - title: Step 3
        - title: Step 4
        - title: Step 5
        - title: Step 6
        - title: Step 7
        - title: Step 8
        - title: Step 9

  # ============================================
  # CLICKABLE STEPS
  # ============================================

  - id: steps_clickable
    type: Steps
    properties:
      current:
        _if_none:
          - _state: steps_current
          - 0
      items:
        - title: First
        - title: Second
        - title: Third
    events:
      onChange:
        - id: set_steps_current
          type: SetState
          params:
            steps_current:
              _event: current

  - id: steps_clickable_display
    type: Span
    properties:
      content:
        _string.concat:
          - 'current:'
          - _if_none:
              - _state: steps_current
              - 0
