id: dateselector
type: Box

events:
  onInit:
    - id: set_defaults
      type: SetState
      params:
        ds_with_value:
          _date: '2024-06-15'
        ds_clearable:
          _date: '2024-01-01'
        ds_onclear:
          _date: '2024-03-01'

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: ds_basic
    type: DateSelector
    properties:
      title: Basic Date

  - id: ds_with_value
    type: DateSelector
    properties:
      title: With Value

  # ============================================
  # PROPERTY TESTS
  # ============================================

  - id: ds_disabled
    type: DateSelector
    properties:
      title: Disabled
      disabled: true

  - id: ds_small
    type: DateSelector
    properties:
      title: Small Size
      size: small

  - id: ds_large
    type: DateSelector
    properties:
      title: Large Size
      size: large

  - id: ds_placeholder
    type: DateSelector
    properties:
      title: Custom Placeholder
      placeholder: Pick a date...

  - id: ds_borderless
    type: DateSelector
    properties:
      title: Borderless
      bordered: false

  - id: ds_no_allowclear
    type: DateSelector
    properties:
      title: No Allow Clear
      allowClear: false

  - id: ds_with_title
    type: DateSelector
    properties:
      title: Date with Title

  - id: ds_with_label
    type: DateSelector
    properties:
      title: Date Label
      label:
        extra: Select a date from the calendar

  # ============================================
  # DISABLED DATES TESTS
  # ============================================

  - id: ds_disabled_dates_min_max
    type: DateSelector
    properties:
      title: Min/Max Range
      disabledDates:
        min:
          _date: '2024-06-01'
        max:
          _date: '2024-06-30'

  - id: ds_disabled_specific_dates
    type: DateSelector
    properties:
      title: Specific Disabled Dates
      disabledDates:
        dates:
          - _date: '2024-06-10'
          - _date: '2024-06-20'

  # ============================================
  # EVENT TESTS
  # ============================================

  - id: ds_onchange
    type: DateSelector
    properties:
      title: OnChange Test
    events:
      onChange:
        - id: set_onchange
          type: SetState
          params:
            ds_onchange_value:
              _event: value

  - id: ds_onchange_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ds_onchange_value
              - null
          then: Date selected
          else: ''

  # ============================================
  # INTERACTION TESTS
  # ============================================

  - id: ds_interaction
    type: DateSelector
    properties:
      title: Interaction Test

  - id: ds_clearable
    type: DateSelector
    properties:
      title: Clearable
      allowClear: true

  # ============================================
  # PRESETS
  # ============================================

  - id: ds_presets
    type: DateSelector
    properties:
      title: Presets
      format: YYYY-MM-DD
      presets:
        - label: New Year 2024
          value: '2024-01-01'
        - label: Mid 2024
          value:
            _date: '2024-06-15'

  # The recommended idiom for a relative shortcut: a local time chain ending in a format step, so
  # the preset selects the calendar date the browser shows as today rather than the UTC date.
  - id: ds_presets_today
    type: DateSelector
    properties:
      title: Presets Today
      format: YYYY-MM-DD
      presets:
        - label: Today
          value:
            _dayjs:
              - now
              - format: YYYY-MM-DD

  - id: ds_presets_min_now
    type: DateSelector
    properties:
      title: Presets with a minimum date
      format: YYYY-MM-DD
      disabledDates:
        min:
          _dayjs: [now, { format: YYYY-MM-DD }]
      presets:
        - label: A Week Ago
          value:
            _dayjs: [now, { subtract: [7, days] }, { format: YYYY-MM-DD }]
        - label: Today
          value:
            _dayjs: [now, { format: YYYY-MM-DD }]

  - id: ds_disabled_ranges_from_to
    type: DateSelector
    properties:
      title: Disabled ranges as from and to
      format: YYYY-MM-DD
      disabledDates:
        ranges:
          - from: '2026-03-10'
            to: '2026-03-14'
      presets:
        - label: In the disabled range
          value: '2026-03-12'
        - label: Outside the disabled range
          value: '2026-03-17'

  - id: ds_disabled_ranges_array
    type: DateSelector
    properties:
      title: Disabled ranges as an array
      format: YYYY-MM-DD
      disabledDates:
        ranges:
          - ['2026-03-10', '2026-03-14']

  # ============================================
  # ANTD 6 FEATURES
  # ============================================

  - id: ds_underlined
    type: DateSelector
    properties:
      title: Underlined
      variant: underlined

  - id: ds_prefix_text
    type: DateSelector
    properties:
      title: Prefix Text
      prefix: From

  - id: ds_prefix_icon
    type: DateSelector
    properties:
      title: Prefix Icon
      prefixIcon: clock

  - id: ds_readonly
    type: DateSelector
    properties:
      title: Read-only Input
      inputReadOnly: true

  - id: ds_placement
    type: DateSelector
    class:
      .popup: ds-custom-popup
    properties:
      title: Placement and Popup Class
      placement: bottomRight

  - id: ds_events
    type: DateSelector
    properties:
      title: Focus, Blur and Open Events
    events:
      onFocus:
        - id: set_focus
          type: SetState
          params:
            ds_focus_event: true
      onBlur:
        - id: set_blur
          type: SetState
          params:
            ds_blur_event: true
      onOpenChange:
        - id: set_open
          type: SetState
          params:
            ds_open_event:
              _event: open

  - id: ds_focus_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ds_focus_event
              - null
          then:
            _string.concat:
              - 'Focus: '
              - _json.stringify:
                  - _state: ds_focus_event
          else: ''

  - id: ds_blur_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ds_blur_event
              - null
          then:
            _string.concat:
              - 'Blur: '
              - _json.stringify:
                  - _state: ds_blur_event
          else: ''

  - id: ds_open_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: ds_open_event
              - null
          then:
            _string.concat:
              - 'Open: '
              - _json.stringify:
                  - _state: ds_open_event
          else: ''

  - id: ds_onclear
    type: DateSelector
    properties:
      title: OnClear Test
    events:
      onClear:
        - id: set_onclear
          type: SetState
          params:
            ds_onclear_fired: true

  - id: ds_onclear_display
    type: Span
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: ds_onclear_fired
              - true
          then: Clear fired
          else: ''

  - id: ds_show_week
    type: DateSelector
    properties:
      title: Show Week
      showWeek: true

  - id: ds_show_today_false
    type: DateSelector
    properties:
      title: No Today Button
      showToday: false
