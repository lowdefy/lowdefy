- id: default
  type: PageSiderMenu
- id: 'properties.menu'
  type: PageSiderMenu
  properties:
    menu:
      links:
        - id: Introduction
          type: MenuLink
          pageId: introduction
          properties:
            icon: Rocket
            title: Introduction
        - id: alert
          type: MenuLink
          pageId: Alert
          properties:
            icon: CircleAlert
            title: Alert
- id: 'properties.logo.src'
  type: PageSiderMenu
  properties:
    logo:
      src: 'https://lowdefy.com/logos/name_250.png'
    menu:
      links:
        - id: Introduction
          type: MenuLink
          pageId: introduction
          properties:
            icon: Rocket
            title: Introduction
        - id: alert
          pageId: Alert
          type: MenuLink
          properties:
            icon: CircleAlert
            title: Alert
- id: 'properties.logo.alt'
  type: PageSiderMenu
  properties:
    logo:
      alt: 'Header logo alt text'
    menu:
      links:
        - id: Introduction
          type: MenuLink
          pageId: introduction
          properties:
            icon: Rocket
            title: Introduction
        - id: alert
          type: MenuLink
          pageId: Alert
          properties:
            icon: CircleAlert
            title: Alert
- id: 'style.logo'
  type: PageSiderMenu
  style:
    .logo:
      border: 5px solid blue
- id: 'properties.logo.srcMobile'
  type: PageSiderMenu
  properties:
    logo:
      src: 'https://lowdefy.com/logos/name_250.png'
      srcMobile: /logo_square.png
    menu:
      links:
        - id: Introduction
          type: MenuLink
          pageId: introduction
          properties:
            icon: Rocket
            title: Introduction
        - id: alert
          type: MenuLink
          pageId: Alert
          properties:
            icon: CircleAlert
            title: Alert
- id: 'properties.logo.breakpoint'
  type: PageSiderMenu
  properties:
    logo:
      src: 'https://lowdefy.com/logos/name_250.png'
      srcMobile: /logo_square.png
      breakpoint: 768
    menu:
      links:
        - id: Introduction
          type: MenuLink
          pageId: introduction
          properties:
            icon: Rocket
            title: Introduction
        - id: alert
          type: MenuLink
          pageId: Alert
          properties:
            icon: CircleAlert
            title: Alert
- id: 'properties.breadcrumb.list'
  type: PageSiderMenu
  properties:
    breadcrumb:
      list:
        - Link one
        - Link two
- id: 'style.footer'
  type: PageSiderMenu
  style:
    .footer:
      border: 5px solid blue
  slots:
    footer:
      blocks: []
- id: 'style.content'
  type: PageSiderMenu
  style:
    .content:
      border: 5px solid blue
  slots:
    content:
      blocks: []
- id: 'style.sider'
  type: PageSiderMenu
  style:
    .sider:
      border: 5px solid blue
  slots:
    sider:
      blocks: []
- id: 'properties.sider.initialCollapsed'
  type: PageSiderMenu
  properties:
    sider:
      initialCollapsed: true
  slots:
    sider:
      blocks: []
- id: 'properties.toggleSiderButton.color'
  type: PageSiderMenu
  properties:
    toggleSiderButton:
      color: primary
      variant: solid
  slots:
    sider:
      blocks: []
- id: 'properties.sider.hideToggleButton'
  type: PageSiderMenu
  properties:
    sider:
      hideToggleButton: true
  slots:
    sider:
      blocks: []
- id: 'style.header'
  type: PageSiderMenu
  style:
    .header:
      border: 5px solid blue
  slots:
    header:
      blocks: []
- id: 'style.element'
  type: PageSiderMenu
  style:
    .element:
      border: 5px solid blue
