id: qr_code
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: qr_basic
    type: QRCode
    properties:
      value: 'https://lowdefy.com'

  - id: qr_bordered
    type: QRCode
    properties:
      bordered: true
      value: 'test'

  - id: qr_size
    type: QRCode
    properties:
      size: 200
      value: 'size-test'

  # ============================================
  # EVENT TESTS
  # ============================================

  - id: qr_expired
    type: QRCode
    properties:
      status: expired
      value: 'expired'
    events:
      onRefresh:
        - id: set_refreshed
          type: SetState
          params:
            qr_refreshed: true

  - id: qr_refresh_display
    type: Paragraph
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: qr_refreshed
              - true
          then: Refresh fired
          else: ''

  # ============================================
  # ICON SIZE AND SEMANTIC KEYS
  # ============================================

  - id: qr_icon_size
    type: QRCode
    properties:
      type: svg
      errorLevel: H
      value: 'icon-size'
      icon: "data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='60'%20height='30'%3E%3Crect%20width='60'%20height='30'%20fill='%231677ff'/%3E%3C/svg%3E"
      iconSize:
        width: 60
        height: 30

  - id: qr_cover_style
    type: QRCode
    class:
      .cover: qr-cover-class
    style:
      .cover:
        backgroundColor: 'rgb(255, 255, 0)'
    properties:
      status: loading
      value: 'cover'

  # ============================================
  # NULL PROPERTIES
  # ============================================

  # _state on a missing key gives null, which must fall back to antd's defaults.
  - id: qr_null_props
    type: QRCode
    properties:
      value: 'null-props'
      errorLevel:
        _state: qr_null_missing
      size:
        _state: qr_null_missing
      status:
        _state: qr_null_missing
      bordered:
        _state: qr_null_missing
