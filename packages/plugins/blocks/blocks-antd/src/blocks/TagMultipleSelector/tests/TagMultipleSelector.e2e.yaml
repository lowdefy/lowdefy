id: tag_multiple_selector
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: tms_basic
    type: TagMultipleSelector
    properties:
      label:
        disabled: true
      options:
        - Ethics
        - Environment
        - Governance

  # ============================================
  # EVENT / SELECTION TESTS
  # ============================================

  - id: tms_change
    type: TagMultipleSelector
    properties:
      label:
        disabled: true
      options:
        - label: Option A
          value: a
        - label: Option B
          value: b
    events:
      onChange:
        - id: set_tms_result
          type: SetState
          params:
            tms_result:
              _event: value

  - id: tms_change_display
    type: Paragraph
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: tms_result
              - null
          then:
            _json.stringify:
              - _state: tms_result
          else: ''

  # ============================================
  # DISABLED TESTS
  # ============================================

  - id: tms_disabled
    type: TagMultipleSelector
    properties:
      label:
        disabled: true
      disabled: true
      options:
        - X
        - Y

  - id: tms_disabled_option
    type: TagMultipleSelector
    properties:
      label:
        disabled: true
      options:
        - label: Enabled
          value: enabled
        - label: Locked
          value: locked
          disabled: true
