id: header
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: header_basic
    type: Header
    slots:
      content:
        blocks:
          - id: header_basic_content
            type: Span
            properties:
              content: Header content

  # ============================================
  # THEME TESTS
  # ============================================

  - id: header_default_background
    type: Header
    slots:
      content:
        blocks:
          - id: header_default_background_content
            type: Span
            properties:
              content: Default background header

  - id: header_color
    type: Header
    properties:
      color: '#001529'
    slots:
      content:
        blocks:
          - id: header_color_content
            type: Span
            properties:
              content: Colored header

  # ============================================
  # STYLE TESTS
  # ============================================

  - id: header_with_style
    type: Header
    style:
      .element:
        padding: 20px
        borderBottom: '1px solid #e8e8e8'
    slots:
      content:
        blocks:
          - id: header_with_style_content
            type: Span
            properties:
              content: Styled header

  # ============================================
  # PROFILE MENU CSS KEY
  # ============================================

  - id: header_profile
    type: Header
    class:
      .profileMenu: header-profile-menu
    properties:
      profile:
        trigger: click
        avatar:
          content: AB
        links:
          - id: header_profile_settings
            type: MenuLink
            properties:
              title: Account settings
