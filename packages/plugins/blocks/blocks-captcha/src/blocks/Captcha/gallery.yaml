# The galleries use Cloudflare Turnstile's documented always-pass test site
# key so the widget renders without an account. A real app normally feeds
# provider and siteKey from the auth config projection instead:
#   properties:
#     provider:
#       _build.authConfig: captcha.provider
#     siteKey:
#       _build.authConfig: captcha.siteKey

- title: Basic
  blocks:
    - id: captcha_basic
      type: Captcha
      properties:
        provider: cloudflare-turnstile
        siteKey: 1x00000000000000000000AA

- title: Compact light theme
  blocks:
    - id: captcha_compact
      type: Captcha
      properties:
        provider: cloudflare-turnstile
        siteKey: 1x00000000000000000000AA
        theme: light
        size: compact
