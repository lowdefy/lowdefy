id: agent-chat
type: PageHeaderMenu
properties:
  title: AgentChat
blocks:
  # Both chats are driven from the messages property, so nothing here calls the agent.
  - id: chat_wired
    type: AgentChat
    properties:
      agentId: test_agent
      height: 300
      conversationId: wired
      messageDisplay:
        actions:
          - feedback
      messages:
        - id: w1
          role: assistant
          parts:
            - type: text
              text: |
                [in-app link](/agent-chat-target) and [external link](https://example.com)
    events:
      onLinkClick:
        - id: record_link_click
          type: SetState
          params:
            last_href:
              _event: href
            last_text:
              _event: text
            click_count:
              _sum:
                - _if_none:
                    - _state: click_count
                    - 0
                - 1

  - id: wired_readout
    type: Html
    properties:
      html:
        _nunjucks:
          template: |
            <span id="readout_href">{{ href }}</span>
            <span id="readout_text">{{ text }}</span>
            <span id="readout_count">{{ count or 0 }}</span>
          on:
            href:
              _state: last_href
            text:
              _state: last_text
            count:
              _state: click_count

  - id: chat_unwired
    type: AgentChat
    properties:
      agentId: test_agent
      height: 300
      conversationId: unwired
      messages:
        - id: u1
          role: assistant
          parts:
            - type: text
              text: '[in-app link](/agent-chat-target) and [external link](https://example.com)'
