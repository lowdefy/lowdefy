id: agent-conversations
type: PageHeaderMenu
properties:
  title: AgentConversations
events:
  onInit:
    - id: init
      type: SetState
      params:
        active: conv-1
blocks:
  # Selecting a row marks it as loading until finish_loading clears loadingKey, standing in
  # for an app that reads the transcript on select.
  - id: conversations
    type: AgentConversations
    properties:
      activeKey:
        _state: active
      loadingKey:
        _state: loading
      items:
        - key: conv-1
          label: First conversation
        - key: conv-2
          label: Second conversation
        - key: conv-3
          label: Generating a title
          loading: true
    events:
      onSelect:
        - id: select
          type: SetState
          params:
            active:
              _event: key
            loading:
              _event: key
  - id: finish_loading
    type: Button
    properties:
      title: Finish loading
    events:
      onClick:
        - id: clear_loading
          type: SetState
          params:
            loading: null
  - id: readout_active
    type: Html
    properties:
      html:
        _string.concat:
          - _if_none:
              - _state: active
              - ''
