# Cross-cutting theming page: the claims asserted here span AgGridLowdefy, AgGridLowdefyInput and a
# legacy block, so they live on their own page rather than in any one block's test page.
id: aggridtheming
type: Box

# The input core reads its rows from the block value, so the input grids are seeded from state.
events:
  onInit:
    - id: set_input_rows
      type: SetState
      params:
        theming_input_size_small:
          - name: Alice
            age: 25
          - name: Bob
            age: 30
          - name: Charlie
            age: 35
        theming_input_size_large:
          - name: Alice
            age: 25
          - name: Bob
            age: 30
          - name: Charlie
            age: 35

blocks:
  # ============================================
  # DARK MODE
  # ============================================

  - id: theming_dark_on
    type: Button
    properties:
      title: Dark
    events:
      onClick:
        - id: set_dark
          type: SetDarkMode
          params:
            darkMode: dark

  - id: theming_dark_off
    type: Button
    properties:
      title: Light
    events:
      onClick:
        - id: set_light
          type: SetDarkMode
          params:
            darkMode: light

  - id: theming_dark_grid
    type: AgGridLowdefy
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
      rowData:
        - name: Alice
        - name: Bob

  # ============================================
  # SIZE — row density and avatar density
  # ============================================

  # The three grids differ only in size. The name column renders an avatar so the same grids cover
  # the avatar custom properties, which track size on these blocks.

  - id: theming_size_small
    type: AgGridLowdefy
    properties:
      size: small
      height: 300
      columnDefs:
        - headerName: Name
          field: name
          cell:
            type: avatar
            nameField: name
            idField: id
        - headerName: Age
          field: age
      rowData:
        - id: u1
          name: Alice Johnson
          age: 25
        - id: u2
          name: Bob Smith
          age: 30
        - id: u3
          name: Charlie Brown
          age: 35

  - id: theming_size_middle
    type: AgGridLowdefy
    properties:
      size: middle
      height: 300
      columnDefs:
        - headerName: Name
          field: name
          cell:
            type: avatar
            nameField: name
            idField: id
        - headerName: Age
          field: age
      rowData:
        - id: u1
          name: Alice Johnson
          age: 25
        - id: u2
          name: Bob Smith
          age: 30
        - id: u3
          name: Charlie Brown
          age: 35

  - id: theming_size_large
    type: AgGridLowdefy
    properties:
      size: large
      height: 300
      columnDefs:
        - headerName: Name
          field: name
          cell:
            type: avatar
            nameField: name
            idField: id
        - headerName: Age
          field: age
      rowData:
        - id: u1
          name: Alice Johnson
          age: 25
        - id: u2
          name: Bob Smith
          age: 30
        - id: u3
          name: Charlie Brown
          age: 35

  # ============================================
  # SIZE — input core
  # ============================================

  - id: theming_input_size_small
    type: AgGridLowdefyInput
    properties:
      size: small
      height: 300
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Age
          field: age

  - id: theming_input_size_large
    type: AgGridLowdefyInput
    properties:
      size: large
      height: 300
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Age
          field: age

  # ============================================
  # MIXED — a legacy-named block and a Lowdefy block on one page
  # ============================================

  # Both are Theming API grids now. The pair proves two different theme objects on one page stay
  # independent and that neither trips AG Grid's legacy-CSS error.

  - id: theming_mixed_legacy
    type: AgGridBalham
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Age
          field: age
      rowData:
        - name: Alice
          age: 25
        - name: Bob
          age: 30

  - id: theming_mixed_lowdefy
    type: AgGridLowdefy
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Age
          field: age
      rowData:
        - name: Alice
          age: 25
        - name: Bob
          age: 30
