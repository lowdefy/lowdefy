# Cross-cutting theming page: the claims asserted here span AgGridLowdefy, AgGridLowdefyInput and a
# legacy block, so they live on their own page rather than in any one block's test page.
id: aggridtheming
type: Box

# The input core reads its rows from the block value, so the input grids are seeded from state.
events:
  onInit:
    - id: set_input_rows
      type: SetState
      params:
        theming_input_size_small:
          - name: Alice
            age: 25
          - name: Bob
            age: 30
          - name: Charlie
            age: 35
        theming_input_size_large:
          - name: Alice
            age: 25
          - name: Bob
            age: 30
          - name: Charlie
            age: 35

blocks:
  # ============================================
  # DARK MODE
  # ============================================

  - id: theming_dark_on
    type: Button
    properties:
      title: Dark
    events:
      onClick:
        - id: set_dark
          type: SetDarkMode
          params:
            darkMode: dark

  - id: theming_dark_off
    type: Button
    properties:
      title: Light
    events:
      onClick:
        - id: set_light
          type: SetDarkMode
          params:
            darkMode: light

  - id: theming_dark_grid
    type: AgGridLowdefy
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
      rowData:
        - name: Alice
        - name: Bob

  # ============================================
  # SIZE — row density and avatar density
  # ============================================

  # The three grids differ only in size. The name column renders an avatar so the same grids cover
  # the avatar custom properties, which track size on these blocks.

  - id: theming_size_small
    type: AgGridLowdefy
    properties:
      size: small
      height: 300
      columnDefs:
        - headerName: Name
          field: name
          cell:
            type: avatar
            nameField: name
            idField: id
        - headerName: Age
          field: age
      rowData:
        - id: u1
          name: Alice Johnson
          age: 25
        - id: u2
          name: Bob Smith
          age: 30
        - id: u3
          name: Charlie Brown
          age: 35

  - id: theming_size_middle
    type: AgGridLowdefy
    properties:
      size: middle
      height: 300
      columnDefs:
        - headerName: Name
          field: name
          cell:
            type: avatar
            nameField: name
            idField: id
        - headerName: Age
          field: age
      rowData:
        - id: u1
          name: Alice Johnson
          age: 25
        - id: u2
          name: Bob Smith
          age: 30
        - id: u3
          name: Charlie Brown
          age: 35

  - id: theming_size_large
    type: AgGridLowdefy
    properties:
      size: large
      height: 300
      columnDefs:
        - headerName: Name
          field: name
          cell:
            type: avatar
            nameField: name
            idField: id
        - headerName: Age
          field: age
      rowData:
        - id: u1
          name: Alice Johnson
          age: 25
        - id: u2
          name: Bob Smith
          age: 30
        - id: u3
          name: Charlie Brown
          age: 35

  # ============================================
  # SIZE — input core
  # ============================================

  # theming_input_size_small also carries the dark-mode check for the input core, which shares
  # antdParams with every other block but has its own wrapper.

  - id: theming_input_size_small
    type: AgGridLowdefyInput
    properties:
      size: small
      height: 300
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Age
          field: age

  - id: theming_input_size_large
    type: AgGridLowdefyInput
    properties:
      size: large
      height: 300
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Age
          field: age

  # ============================================
  # MIXED — a legacy-named block and a Lowdefy block on one page
  # ============================================

  # Both are Theming API grids now. The pair proves two different theme objects on one page stay
  # independent and that neither trips AG Grid's legacy-CSS error. The legacy block also carries the
  # dark-mode check for the legacy bases, whose antdParams the Lowdefy blocks share.

  - id: theming_mixed_legacy
    type: AgGridBalham
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Age
          field: age
      rowData:
        - name: Alice
          age: 25
        - name: Bob
          age: 30

  - id: theming_mixed_lowdefy
    type: AgGridLowdefy
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Age
          field: age
      rowData:
        - name: Alice
          age: 25
        - name: Bob
          age: 30

  # ============================================
  # LEGACY BASES — identity markers
  # ============================================

  # The Balham grid above completes the set. Alpine and Material are here for the zebra check, which
  # has to see all three bases: the stripe comes from antdParams' oddRowBackgroundColor, and Balham
  # is the only base that would still stripe on its own if that param were dropped. Two rows each so
  # row-index="1" is an odd row. The Material grid also carries the borderRadius and primary-colour
  # checks — it is the only block that takes themeMaterialAntd.

  - id: theming_legacy_alpine
    type: AgGridAlpine
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
      rowData:
        - name: Alice
        - name: Bob

  - id: theming_legacy_material
    type: AgGridMaterial
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
      rowData:
        - name: Alice
        - name: Bob

  # ============================================
  # THEME PARAMS — per-grid override
  # ============================================

  # Two AgGridLowdefy grids that differ only in themeParams. The override colour is a literal here
  # rather than an antd token so the assertion cannot be satisfied by the value the base theme would
  # have resolved anyway, and headerBackgroundColor is chosen because .ag-header paints it with no
  # interaction. The sibling is what proves the override did not reach the shared module-scope theme.

  - id: theming_params_override
    type: AgGridLowdefy
    properties:
      height: 200
      themeParams:
        headerBackgroundColor: rgb(255, 0, 255)
      columnDefs:
        - headerName: Name
          field: name
      rowData:
        - name: Alice
        - name: Bob

  - id: theming_params_sibling
    type: AgGridLowdefy
    properties:
      height: 200
      columnDefs:
        - headerName: Name
          field: name
      rowData:
        - name: Alice
        - name: Bob

  # ============================================
  # CHECKBOXES — ticked boxes show a tick
  # ============================================

  # A boolean field renders AG Grid's checkbox cell, read-only unless the column is editable. The
  # read-only one is the case that read as unticked: it is disabled, and AG Grid greys a disabled box,
  # so a tick drawn in the box colour left a plain grey square. Balham is here as well because its
  # base draws the tick in the accent colour, the same primary colour antdParams gives the box; the
  # Quartz base behind the Lowdefy blocks draws it in the background colour. Row selection uses the
  # same checkbox styling, so the second grid of each pair covers it too.

  - id: theming_checkbox_lowdefy
    type: AgGridLowdefy
    properties:
      height: 200
      rowSelection:
        mode: multiRow
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Active
          field: active
        - headerName: Editable
          field: active
          editable: true
      rowData:
        - name: Alice
          active: true
        - name: Bob
          active: false

  - id: theming_checkbox_balham
    type: AgGridBalham
    properties:
      height: 200
      rowSelection:
        mode: multiRow
      columnDefs:
        - headerName: Name
          field: name
        - headerName: Active
          field: active
        - headerName: Editable
          field: active
          editable: true
      rowData:
        - name: Alice
          active: true
        - name: Bob
          active: false

  # ============================================
  # CELL OVERFLOW — ellipsis
  # ============================================

  # Narrow columns whose text is wider than them, one per way text reaches the cell: straight into
  # the cell, through a cellRenderer function, through a built-in cell type, and inside
  # .ag-cell-wrapper, which AG Grid adds for a checkbox column.

  - id: theming_cell_ellipsis
    type: AgGridLowdefy
    properties:
      height: 200
      columnDefs:
        - headerName: Plain
          field: dealer
          width: 120
        - headerName: Renderer
          field: dealer
          width: 120
          cellRenderer:
            _function:
              __args: 0.value
        - headerName: Link
          field: dealer
          width: 120
          cell:
            type: link
            href: https://example.com
        - headerName: Checkbox
          field: dealer
          width: 120
          checkboxSelection: true
      rowData:
        - dealer: A dealership name far wider than its column
        - dealer: Another dealership name far wider than its column
