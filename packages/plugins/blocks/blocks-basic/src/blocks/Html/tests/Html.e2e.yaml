id: html
type: Box

blocks:
  - id: html_basic
    type: Html
    properties:
      html: <p>Hello World</p>

  - id: html_styled
    type: Html
    properties:
      html: <p>Styled content</p>
      style:
        backgroundColor: rgb(240, 240, 240)
        padding: 10px

  - id: html_complex
    type: Html
    properties:
      html: |
        <div>
          <h1>Title</h1>
          <p>Paragraph with <strong>bold</strong> text</p>
        </div>

  - id: html_sanitized
    type: Html
    properties:
      html: <p>Safe content</p><script>alert('xss')</script>

  - id: html_selection
    type: Html
    properties:
      html: <p>Select this text to trigger event</p>
    events:
      onTextSelection:
        - id: set_selection
          type: SetState
          params:
            selected_text:
              _event: selectedText

  - id: html_enhanced
    type: Html
    properties:
      html: >-
        <i id="enh_icon" data-icon="edit"></i>
        <span id="enh_tooltip" data-tooltip="&lt;img src=x onerror=&quot;window.tooltipXss=1&quot;&gt;">Hover</span>
        <span id="enh_popover" data-popover="more">More</span>
        <div data-popover-content="more" hidden><b class="enh-popover-body">Popover body</b></div>
        <a id="enh_page_link" data-page-id="clickablehtml" data-url-query="tab=a">Clickable</a>
        <a id="enh_dot_link" href="/.//evil.example/x" data-link>Dot link</a>
