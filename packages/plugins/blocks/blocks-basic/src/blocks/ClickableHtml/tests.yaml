- id: default
  type: ClickableHtml
- id: properties.html
  type: ClickableHtml
  properties:
    html: |
      <p>Plain markup <button data-event="onGoClick" data-item-id="1">Go</button></p>
- id: properties.html-no-events
  type: ClickableHtml
  properties:
    html: |
      <p>No data-event here, clicks do nothing.</p>
- id: properties.html-bad-code
  type: ClickableHtml
  properties:
    html: |
      <button data-event="onOkClick" onclick="alert('inline handler stripped')">Ok</button>
      <script>alert('script tag');</script>
- id: properties.html is number 0
  type: ClickableHtml
  properties:
    html: 0
