- title: A named event per button
  blocks:
    - id: buttons_basic
      type: ClickableHtml
      properties:
        html: '<p>Pick a size: <button data-event="onSmallClick">Small</button> <button data-event="onLargeClick">Large</button></p>'
      events:
        onSmallClick:
          - id: set_small
            type: SetState
            params:
              buttons_basic_selected: small
        onLargeClick:
          - id: set_large
            type: SetState
            params:
              buttons_basic_selected: large
    - id: buttons_basic_result
      type: Html
      properties:
        html:
          _string.concat:
            - '<p>State: <code>'
            - _state:
                key: buttons_basic_selected
                default: 'nothing yet'
            - '</code></p>'

- title: Data attributes are the event object
  blocks:
    - id: list_rows
      type: ClickableHtml
      properties:
        html: '<ul style="list-style: none; padding: 0; margin: 0;"><li data-event="onRowClick" data-record-id="rec_1" style="padding: 8px; cursor: pointer; border-bottom: 1px solid var(--ant-color-border);">First record</li><li data-event="onRowClick" data-record-id="rec_2" style="padding: 8px; cursor: pointer; border-bottom: 1px solid var(--ant-color-border);">Second record</li><li data-event="onRowClick" data-record-id="rec_3" style="padding: 8px; cursor: pointer;">Third record</li></ul>'
      events:
        onRowClick:
          - id: set_clicked
            type: SetState
            params:
              list_rows_clicked:
                _event: true
    - id: list_rows_result
      type: Html
      properties:
        html:
          _string.concat:
            - '<p>Last event: <code>'
            - _json.stringify:
                _state:
                  key: list_rows_clicked
                  default: {}
            - '</code></p>'

- title: Links and plain markup are left to the browser
  blocks:
    - id: mixed_content
      type: ClickableHtml
      properties:
        html: '<p>This <a href="https://lowdefy.com" target="_blank">link</a> navigates normally, but <a href="#" data-event="onCommentClick" data-thread-id="t_9">this one</a> fires onCommentClick instead.</p>'
      events:
        onCommentClick:
          - id: set_mixed
            type: SetState
            params:
              mixed_content_thread:
                _event: thread_id
    - id: mixed_content_result
      type: Html
      properties:
        html:
          _string.concat:
            - '<p>Thread: <code>'
            - _state:
                key: mixed_content_thread
                default: 'none'
            - '</code></p>'

- title: Style Overrides
  blocks:
    - id: style_card
      type: ClickableHtml
      style:
        .element:
          padding: 16
          borderRadius: 8
          border: 1px solid var(--ant-color-border)
          background: var(--ant-color-bg-container)
      properties:
        html: '<h4 style="margin: 0 0 8px 0;">Card</h4><p style="margin: 0 0 8px 0; color: var(--ant-color-text-secondary);">Yours to change or remove until tomorrow.</p><button data-event="onEditClick">Edit</button> <button data-event="onRemoveClick">Remove</button>'
      events:
        onEditClick:
          - id: set_card_edit
            type: SetState
            params:
              style_card_action: edit
        onRemoveClick:
          - id: set_card_remove
            type: SetState
            params:
              style_card_action: remove

- title: Clickable icons and a popover menu
  blocks:
    - id: row_actions
      type: ClickableHtml
      properties:
        html: '<p>Invoice INV-042 <i data-icon="edit" data-event="onEdit" data-id="42" data-tooltip="Edit" style="cursor: pointer"></i> <span data-popover="more" style="cursor: pointer"><i data-icon="more-vertical"></i></span></p><div data-popover-content="more" hidden><p data-event="onDuplicate" data-id="42" style="cursor: pointer; margin: 0 0 8px"><i data-icon="copy"></i> Duplicate</p><p data-event="onDelete" data-id="42" style="cursor: pointer; margin: 0; color: var(--ant-color-error)"><i data-icon="delete"></i> Delete</p></div>'
      events:
        onEdit:
          - id: set_edit
            type: SetState
            params:
              row_actions_last: { _string.concat: ['edit ', { _event: id }] }
        onDuplicate:
          - id: set_duplicate
            type: SetState
            params:
              row_actions_last: { _string.concat: ['duplicate ', { _event: id }] }
        onDelete:
          - id: set_delete
            type: SetState
            params:
              row_actions_last: { _string.concat: ['delete ', { _event: id }] }
    - id: row_actions_result
      type: Html
      properties:
        html:
          _string.concat:
            - '<p>Last action: <code>'
            - _state:
                key: row_actions_last
                default: 'none yet'
            - '</code></p>'

- title: Confirm before an event
  blocks:
    - id: confirm_actions
      type: ClickableHtml
      properties:
        html: '<p>INV-2026-0042 <i data-icon="delete" data-event="onDelete" data-id="42" data-tooltip="Delete" data-confirm="Delete invoice INV-2026-0042?" style="cursor: pointer; color: var(--ant-color-error)"></i> <span data-event="onArchive" data-id="42" data-confirm style="cursor: pointer; color: var(--ant-color-primary)">Archive</span></p>'
      events:
        onDelete:
          - id: deleted
            type: SetState
            params:
              confirm_last:
                _string.concat:
                  - 'deleted '
                  - _event: id
        onArchive:
          - id: archived
            type: SetState
            params:
              confirm_last:
                _string.concat:
                  - 'archived '
                  - _event: id
    - id: confirm_result
      type: Html
      properties:
        html:
          _string.concat:
            - '<p>Last action: <code>'
            - _state:
                key: confirm_last
                default: 'none yet'
            - '</code></p>'
