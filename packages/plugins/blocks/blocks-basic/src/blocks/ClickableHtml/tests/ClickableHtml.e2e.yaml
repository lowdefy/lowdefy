id: clickablehtml
type: Box

blocks:
  - id: clickable_basic
    type: ClickableHtml
    properties:
      dataEvents:
        - onGreetClick
        - onWaveClick
      html: '<p>Hello <button data-event="onGreetClick" data-user-id="u_1">World</button> <button data-event="onWaveClick" data-user-id="u_2">Wave</button></p>'
    events:
      onGreetClick:
        - id: set_greeted
          type: SetState
          params:
            clicked:
              event: greet
              user_id:
                _event: user_id
      onWaveClick:
        - id: set_waved
          type: SetState
          params:
            clicked:
              event: wave
              user_id:
                _event: user_id

  - id: clickable_result
    type: Html
    properties:
      html:
        _string.concat:
          - '<span id="clicked_event">'
          - _state:
              key: clicked.event
              default: ''
          - '</span><span id="clicked_user_id">'
          - _state:
              key: clicked.user_id
              default: ''
          - '</span>'

  - id: clickable_no_event
    type: ClickableHtml
    properties:
      html: '<p><button>Plain button</button></p>'
    events:
      onPlainClick:
        - id: set_plain
          type: SetState
          params:
            plain_clicked: true

  - id: clickable_sanitized
    type: ClickableHtml
    properties:
      html: <p>Safe content</p><script>alert('xss')</script>

  - id: clickable_confirm
    type: ClickableHtml
    properties:
      dataEvents:
        - onDelete
      html: '<button id="confirm_delete" data-event="onDelete" data-row-id="7" data-confirm="Delete row 7?">Delete</button> <button id="proto_event" data-event="__proto__">Proto</button>'
    events:
      onDelete:
        - id: count_delete
          type: SetState
          params:
            delete_count:
              _sum:
                - _state:
                    key: delete_count
                    default: 0
                - 1

  - id: clickable_confirm_result
    type: Html
    properties:
      html:
        _string.concat:
          - '<span id="delete_count">'
          - _json.stringify:
              - _state:
                  key: delete_count
                  default: 0
          - '</span>'

  - id: clickable_allowlist
    type: ClickableHtml
    properties:
      dataEvents:
        - onListedClick
      html: '<span id="listed_target" data-event="onListedClick">Listed</span> <span id="unlisted_target" data-event="onUnlistedClick">Unlisted</span>'
    events:
      onListedClick:
        - id: set_listed
          type: SetState
          params:
            allowlist_fired: listed
      onUnlistedClick:
        - id: set_unlisted
          type: SetState
          params:
            allowlist_fired: unlisted

  - id: clickable_declared_confirm
    type: ClickableHtml
    properties:
      dataEvents:
        - name: onRemove
          confirm: Remove row 3?
      html: '<button id="declared_remove" data-event="onRemove" data-row-id="3">Remove</button>'
    events:
      onRemove:
        - id: set_removed
          type: SetState
          params:
            removed_row:
              _event: row_id

  - id: clickable_events_result
    type: Html
    properties:
      html:
        _string.concat:
          - '<span id="allowlist_fired">'
          - _state:
              key: allowlist_fired
              default: ''
          - '</span><span id="removed_row">'
          - _state:
              key: removed_row
              default: ''
          - '</span>'
