id: row
type: Box

blocks:
  # Test 1: children sit side by side and keep their #bl-<id> wrappers
  - id: row_basic
    type: Row
    blocks:
      - id: row_basic_first
        type: Box
        properties:
          content: First
      - id: row_basic_second
        type: Box
        properties:
          content: Second

  # Test 2: a child sizes itself with its own class
  - id: row_sized
    type: Row
    properties:
      gap: none
      wrap: nowrap
    blocks:
      - id: row_sized_fixed
        type: Box
        class: w-32 shrink-0
        properties:
          content: Fixed
      - id: row_sized_fill
        type: Box
        class: grow
        properties:
          content: Fill

  # Test 3: properties map to flex utilities
  - id: row_arranged
    type: Row
    properties:
      gap: lg
      align: center
      justify: between
      wrap: nowrap
    blocks:
      - id: row_arranged_left
        type: Box
        properties:
          content: Left
      - id: row_arranged_right
        type: Box
        properties:
          content: Right
