id: grid
type: Box

blocks:
  # Test 1: the default grid is 24 columns and a child spans with col-span-N
  - id: grid_basic
    type: Grid
    properties:
      gap: none
    blocks:
      - id: grid_basic_main
        type: Box
        class: col-span-16
        properties:
          content: Main
      - id: grid_basic_side
        type: Box
        class: col-span-8
        properties:
          content: Side

  # Test 2: columns sets the track count
  - id: grid_tiles
    type: Grid
    properties:
      columns: 4
      gap: none
    blocks:
      - id: grid_tiles_one
        type: Box
        properties:
          content: One
      - id: grid_tiles_two
        type: Box
        properties:
          content: Two
      - id: grid_tiles_three
        type: Box
        properties:
          content: Three
      - id: grid_tiles_four
        type: Box
        properties:
          content: Four
