# A page whose title reads state that is set after mount, once per page instance.
id: box-page-title
path: box-page-title/{record}
type: Box
properties:
  title:
    _if_none:
      - _state: record_title
      - Record
events:
  onMount:
    - id: wait_before_title
      type: Wait
      params:
        ms: 300
    - id: set_record_title
      type: SetState
      params:
        record_title:
          _string.concat:
            - 'Record '
            - _path_params: record
blocks:
  - id: rename_record
    type: Anchor
    properties:
      title: Rename record
    events:
      onClick:
        - id: set_renamed_title
          type: SetState
          params:
            record_title:
              _string.concat:
                - 'Renamed '
                - _path_params: record
  - id: open_record_b
    type: Anchor
    properties:
      title: Open record b
      pageId: box-page-title
      pathParams:
        record: b
