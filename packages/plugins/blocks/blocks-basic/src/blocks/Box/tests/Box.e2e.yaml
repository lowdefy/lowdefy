id: box
type: Box
properties:
  style:
    padding: 20px

blocks:
  # Test 1: Basic Box renders
  - id: box_basic
    type: Box

  # Test 2: Box with content property
  - id: box_content
    type: Box
    properties:
      content: Hello from Box

  # Test 3: Box with style property
  - id: box_styled
    type: Box
    properties:
      content: Styled Box
      style:
        backgroundColor: rgb(0, 128, 255)
        color: white
        padding: 10px

  # Test 4: Box with nested child block
  - id: box_with_children
    type: Box
    blocks:
      - id: child_span
        type: Span
        properties:
          content: Child content

  # Test 5: Box with dotted block ID (regression test for CSS selector escaping)
  - id: form.field.name
    type: Box
    properties:
      content: Dotted ID Box

  # Test 6: Box with onClick event using SetState
  - id: box_clickable
    type: Box
    properties:
      content:
        _if:
          test:
            _eq:
              - _state: clicked
              - true
          then: Clicked!
          else: Click me
      style:
        cursor: pointer
        padding: 10px
        border: 1px solid gray
    events:
      onClick:
        - id: set_clicked
          type: SetState
          params:
            clicked: true

  # Test 7: nested clickable Boxes. The inner Box handles the click, so the outer Box does not
  # fire unless the inner event sets bubble: true.
  - id: box_nested_outer
    type: Box
    style:
      padding: 20px
    events:
      onClick:
        - id: set_outer_clicked
          type: SetState
          params:
            outer_clicks:
              _sum:
                - _if_none:
                    - _state: outer_clicks
                    - 0
                - 1
    blocks:
      - id: box_nested_inner
        type: Box
        properties:
          content: Inner
        events:
          onClick:
            - id: set_inner_clicked
              type: SetState
              params:
                inner_clicked: true
      - id: box_nested_inner_bubble
        type: Box
        properties:
          content: Inner bubble
        events:
          onClick:
            bubble: true
            try:
              - id: set_inner_bubble_clicked
                type: SetState
                params:
                  inner_bubble_clicked: true
      - id: box_nested_plain
        type: Box
        properties:
          content: Plain child
  - id: box_nested_display
    type: Box
    properties:
      content:
        _string.concat:
          - 'outer='
          - _if_none:
              - _state: outer_clicks
              - 0
          - ' inner='
          - _if_none:
              - _state: inner_clicked
              - false
          - ' bubble='
          - _if_none:
              - _state: inner_bubble_clicked
              - false
