id: stack
type: Box

blocks:
  # Test 1: children stack vertically and keep their #bl-<id> wrappers
  - id: stack_basic
    type: Stack
    blocks:
      - id: stack_basic_first
        type: Box
        properties:
          content: First
      - id: stack_basic_second
        type: Box
        properties:
          content: Second

  # Test 2: align maps to an items-* utility
  - id: stack_aligned
    type: Stack
    properties:
      gap: none
      align: center
    blocks:
      - id: stack_aligned_child
        type: Box
        class: w-32
        properties:
          content: Centered

  # Test 3: a Row nested in a Stack keeps its own arrangement
  - id: stack_nested
    type: Stack
    blocks:
      - id: stack_nested_row
        type: Row
        properties:
          gap: none
        blocks:
          - id: stack_nested_left
            type: Box
            properties:
              content: Left
          - id: stack_nested_right
            type: Box
            properties:
              content: Right
