# Note: All examples on this page are wrapped in a single GoogleMapsScript block
# loading the places library via the docs page template. Individual examples do
# not need their own script.

- title: Default
  blocks:
    - id: pa_default
      type: PlacesAutocomplete

- title: Title and Placeholder
  blocks:
    - id: pa_title
      type: PlacesAutocomplete
      properties:
        title: Delivery address
        placeholder: Search for an address
    - id: pa_label_extra
      type: PlacesAutocomplete
      properties:
        title: Site address
        label:
          extra: Start typing, then pick a suggestion to capture the full address.
          tooltip: Addresses are verified against Google Places.

- title: Fetch Place Fields
  blocks:
    - id: pa_fetch_fields
      type: PlacesAutocomplete
      properties:
        title: Address
        fetchFields:
          - addressComponents
          - location
          - id
          - displayName

- title: Result Mapping
  blocks:
    - id: pa_result_mapping
      type: PlacesAutocomplete
      properties:
        title: Address
        fetchFields:
          - location
          - addressComponents
        resultMapping:
          formattedAddress: address.line1
          location: address.coordinates
          addressComponents: address.components
        labelField: address.line1

- title: Restrict and Bias Suggestions
  blocks:
    - id: pa_region_codes
      type: PlacesAutocomplete
      properties:
        title: Address in the United Kingdom
        requestOptions:
          includedRegionCodes:
            - gb
    - id: pa_location_bias
      type: PlacesAutocomplete
      properties:
        title: Near central London
        requestOptions:
          includedPrimaryTypes:
            - street_address
          locationBias:
            center:
              lat: 51.5074
              lng: -0.1278
            radius: 20000

- title: Sizes
  blocks:
    - id: pa_size_small
      type: PlacesAutocomplete
      properties:
        title: Small
        size: small
    - id: pa_size_middle
      type: PlacesAutocomplete
      properties:
        title: Middle
        size: middle
    - id: pa_size_large
      type: PlacesAutocomplete
      properties:
        title: Large
        size: large

- title: Variants
  blocks:
    - id: pa_variant_filled
      type: PlacesAutocomplete
      properties:
        title: Filled
        variant: filled
    - id: pa_variant_borderless
      type: PlacesAutocomplete
      properties:
        title: Borderless
        variant: borderless
    - id: pa_variant_underlined
      type: PlacesAutocomplete
      properties:
        title: Underlined
        variant: underlined

- title: Disabled and No Clear
  blocks:
    - id: pa_disabled
      type: PlacesAutocomplete
      properties:
        title: Disabled
        disabled: true
    - id: pa_no_clear
      type: PlacesAutocomplete
      properties:
        title: Clear button hidden
        allowClear: false

- title: Custom Suggestion Icon and Dropdown Text
  blocks:
    - id: pa_custom_icon
      type: PlacesAutocomplete
      properties:
        title: Address
        optionsIcon:
          name: MdOutlineHome
          color: '#1890ff'
        loadingPlaceholder: Searching addresses...
        notFoundContent: No matching address

- title: Required with Validation
  blocks:
    - id: pa_required
      type: PlacesAutocomplete
      required: true
      properties:
        title: Address
      validate:
        - message: An address must be selected.
          status: error
          pass:
            _if_none:
              - _state: pa_required.formattedAddress
              - false

- title: Event Actions
  blocks:
    - id: pa_events
      type: PlacesAutocomplete
      properties:
        title: Address
        fetchFields:
          - location
      events:
        onPlaceChanged:
          - id: pa_place_changed_message
            type: DisplayMessage
            params:
              content: Place selected.
              duration: 2
        onSearch:
          - id: pa_search_state
            type: SetState
            params:
              pa_last_search:
                _event: value
        onClear:
          - id: pa_clear_state
            type: SetState
            params:
              pa_last_search: null

- title: PlacesAutocomplete in an Address Form
  fullWidth: true
  blocks:
    - id: pa_form_title
      type: Title
      properties:
        content: Delivery details
        level: 4
    - id: pa_form_address
      type: PlacesAutocomplete
      properties:
        title: Street address
        placeholder: Search for a delivery address
        fetchFields:
          - addressComponents
          - location
        label:
          extra: Pick a suggestion to capture the coordinates for the driver.
    - id: pa_form_instructions
      type: TextArea
      properties:
        title: Delivery instructions
        placeholder: Gate code, buzzer, where to leave the parcel
    - id: pa_form_submit
      type: Button
      properties:
        title: Save address
        icon: AiOutlineSave
