# The rows. Each row's enrichment state sits beside its data, under _enrich.<column key>, so
# there is no queue collection. A tenant-scoped app sets the connection's tenant options here.
- id: leads
  type: MongoDBCollection
  properties:
    databaseUri:
      _secret: ENRICHMENT_MONGODB_URI
    collection: leads
    write: true

# The user-defined columns: { tableId, key, title, type, kind, config, position, createdBy }.
- id: table_columns
  type: MongoDBCollection
  properties:
    databaseUri:
      _secret: ENRICHMENT_MONGODB_URI
    collection: table_columns
    write: true

# The enrichment services the providers call. Keys and base URLs stay on the server: a column
# can only call a provider endpoint of this app, never a URL a user typed.
- id: company_api
  type: AxiosHttp
  properties:
    baseURL:
      _string.concat:
        - _secret: ENRICHMENT_API_URL
        - /company
    # Shorter than the claim lease, so a hung call fails the attempt (and is retried) before
    # another worker could claim the cell.
    timeout: 10000

- id: email_source_a
  type: AxiosHttp
  properties:
    baseURL:
      _string.concat:
        - _secret: ENRICHMENT_API_URL
        - /email-a
    timeout: 10000

- id: email_source_b
  type: AxiosHttp
  properties:
    baseURL:
      _string.concat:
        - _secret: ENRICHMENT_API_URL
        - /email-b
    timeout: 10000

# treg (https://treg.to): thousands of provider endpoints behind one token, each call billed at
# its exact cost. The find_work_email_treg provider calls its routed treg.people.email.find
# endpoint, which tries provider after provider. baseUrl defaults to https://treg.to; the e2e
# run points it at the mock.
- id: treg
  type: TregConnection
  properties:
    token:
      _secret: TREG_TOKEN
    baseUrl:
      _string.concat:
        - _secret: ENRICHMENT_API_URL
        - /treg
    # Below the claim lease, like the AxiosHttp timeouts. Short for the e2e run, whose mock
    # answers one call slower than this (an answer lost after it was charged).
    timeout: 2000
    # The most one call may cost, in USD (X-Treg-Route-Max-Cost): a routed endpoint's whole
    # waterfall stays below it.
    maxCost: 0.05
    meta:
      app: enrichment-reference

# The AI provider's model. The app, not the column, picks the model and the token limit.
- id: ai
  type: Anthropic
  properties:
    apiKey:
      _secret: ANTHROPIC_API_KEY
    baseURL:
      _secret: ANTHROPIC_BASE_URL
    maxOutputTokens: 300
    timeout: 20000
