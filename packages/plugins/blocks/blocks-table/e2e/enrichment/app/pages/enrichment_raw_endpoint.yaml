# The leads table with rows that leave every cell's raw result out: the provider's whole answer,
# often many times the size of the value. The details panel loads the raw result of the cell it
# shows from `rawEndpoint` (api/leads/leads_cell_raw.yaml). Extract columns read the raw result
# from the row, so this table leaves them out; a table with extract columns keeps the fields
# they read in its rows.
id: enrichment_raw_endpoint
type: Box

requests:
  - id: leads
    type: MongoDBAggregation
    connectionId: leads
    properties:
      pipeline:
        - $sort:
            createdAt: 1
            position: 1
            _id: 1
        - $limit: 5000
        - $project:
            name: 1
            title: 1
            domain: 1
            values: 1
            # Every cell of _enrich without its raw result.
            _enrich:
              $arrayToObject:
                $map:
                  input:
                    $objectToArray:
                      $ifNull:
                        - $_enrich
                        - {}
                  in:
                    k: $$this.k
                    v:
                      $unsetField:
                        field: raw
                        input: $$this.v

  - id: get_columns
    type: MongoDBAggregation
    connectionId: table_columns
    properties:
      _ref: leads/get_columns.yaml

events:
  onMount:
    - id: load
      type: Request
      params:
        - leads
        - get_columns

blocks:
  - id: leads_table
    type: Table
    properties:
      height: 520
      providers:
        _ref: leads/providers.yaml
      rawEndpoint: leads_cell_raw
      loading:
        _request_details: leads.0.loading
      columns:
        _array.filter:
          - _if_none:
              - _request: get_columns
              - []
          - _function:
              __ne:
                - __args: 0.kind
                - extract
      data:
        _if_none:
          - _request: leads
          - []
