# E2E only: starts two workers at once, each in its own invocation, to check that concurrent
# workers never run the same cell.
id: test_start_workers
type: Api
routine:
  - id: worker_one
    type: CallApi
    properties:
      endpointId: enrichment_worker
      detached: true
  - id: worker_two
    type: CallApi
    properties:
      endpointId: enrichment_worker
      detached: true
  - :return:
      started: 2
