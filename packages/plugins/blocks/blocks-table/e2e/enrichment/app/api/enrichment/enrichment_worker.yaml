# The worker: claims queued cells, calls each cell's provider endpoint, writes the results and
# queues the autoRun columns they feed, until nothing is left to claim or its time is spent.
#
# InternalApi: a page can not call it. It runs from the schedule below (every minute, which
# also picks up retries once their backoff has passed and cells whose worker crashed), and
# from enrichment_run as a detached call, so a run starts at once. Any number of workers can
# run at the same time: a claim is a compare-and-set, so two workers never get the same cell,
# and a result is only written while the cell still holds the worker's claim.
id: enrichment_worker
type: InternalApi
schedules:
  - cron: '* * * * *'
routine:
  - _ref: leads/load_table.yaml
  - :set_state:
      deadline:
        _date:
          _sum:
            - _date.getTime:
                _date: now
            - _ref:
                path: leads/queue.yaml
                key: timeBudgetMs
      # Loop until a claim returns no cells.
      claimed: null
      rounds: 0
      cells: 0
  - :while:
      _and:
        - _ne:
            - _state: claimed
            - 0
        - _lt:
            - _state: rounds
            - _ref:
                path: leads/queue.yaml
                key: maxRounds
        - _lt:
            - _date: now
            - _state: deadline
    :do:
      # Queued cells that are due (a retry waits out its backoff) and running cells whose
      # lease ran out, oldest first. Each is now running, with a lease and a claimToken.
      - id: claim
        type: MongoDBEnrichmentClaim
        connectionId: leads
        properties:
          # The cells were scoped when they were queued; a tenant-scoped connection scopes
          # the claim by tenant as well.
          filter: {}
          fields:
            _state: fields
          columnDefs:
            _state: columnDefs
          limit:
            _ref:
              path: leads/queue.yaml
              key: claimLimit
          leaseMs:
            _ref:
              path: leads/queue.yaml
              key: leaseMs
          maxAttempts:
            _ref:
              path: leads/queue.yaml
              key: maxAttempts
      # The claimed cells by provider, each provider running at most its own number of cells
      # at once (providerConcurrency), so a slow or rate-limited provider never gets the whole
      # batch at the same moment. Each cell is completed on its own, so its result shows as
      # soon as its provider answers. A claim carries its column's provider, prompt and output,
      # so nothing here reads the columns again.
      - :parallel_for: group
        :in:
          _js:
            fn: |
              const groups = new Map();
              args.cells.forEach((cell) => {
                if (!groups.has(cell.provider)) groups.set(cell.provider, []);
                groups.get(cell.provider).push(cell);
              });
              return [...groups].map(([provider, cells]) => ({
                cells,
                concurrency: args.limits[provider] ?? args.limits.default,
              }));
            args:
              cells:
                _step: claim
              limits:
                _ref:
                  path: leads/queue.yaml
                  key: providerConcurrency
        :do:
          :parallel_for: cell
          :in:
            _item: group.cells
          :concurrency:
            _item: group.concurrency
          :do:
            _ref: api/enrichment/run_cell.yaml
      - :set_state:
          claimed:
            _array.length:
              _step: claim
          rounds:
            _sum:
              - _state: rounds
              - 1
          cells:
            _sum:
              - _state: cells
              - _array.length:
                  _step: claim
  - :return:
      rounds:
        _state: rounds
      cells:
        _state: cells
