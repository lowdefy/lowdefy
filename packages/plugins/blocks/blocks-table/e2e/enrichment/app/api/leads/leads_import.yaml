# Imports rows: the Table's onImport { rows }, a batch of at most 500 parsed CSV rows keyed by
# column key. The rows' autoRun columns start at once.
id: leads_import
type: Api
payloadSchema:
  type: object
  required:
    - rows
  additionalProperties: false
  properties:
    rows:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: object
routine:
  - _ref: leads/load_table.yaml
  - :set_state:
      rows:
        _payload: rows
  - :set_state:
      converted:
        _ref: leads/rows_to_docs.yaml
      autoRun:
        _ref: leads/auto_run_roots.yaml
  - :if:
      _gt:
        - _array.length:
            _state: converted.errors
        - 0
    :then:
      - :reject:
          _array.join:
            - _state: converted.errors
            - ' '
  - id: insert_leads
    type: MongoDBInsertMany
    connectionId: leads
    properties:
      docs:
        _state: converted.docs
  - _ref:
      path: api/leads/start_auto_run.yaml
      vars:
        selection:
          _object.values:
            _step: insert_leads.insertedIds
  - :return:
      insertedCount:
        _step: insert_leads.insertedCount
