# E2E only: overwrites one enrichment cell, to set up states a test can not reach by running
# the worker, such as a running cell whose worker crashed and whose lease ran out.
id: test_set_cell
type: Api
routine:
  - id: set_cell
    type: MongoDBUpdateOne
    connectionId: leads
    properties:
      filter:
        _id:
          _payload: rowKey
      update:
        $set:
          _object.fromEntries:
            - - _string.concat:
                  - _enrich.
                  - _payload: columnKey
              - _payload: cell
  - :return:
      matched:
        _step: set_cell.matchedCount
