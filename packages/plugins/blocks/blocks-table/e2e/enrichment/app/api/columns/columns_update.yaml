# Updates a user-defined column: the Table's onColumnUpdate { column, previous } (rename, edit).
# The key names the column and can not change, since its cells are stored under
# _enrich.<key>. Declared columns can not be changed here.
id: columns_update
type: Api
payloadSchema:
  type: object
  required:
    - column
  additionalProperties: false
  properties:
    column:
      type: object
      required:
        - key
      properties:
        key:
          type: string
    # The column before the change, as the Table had it. The stored column is what counts.
    previous:
      type: object
    position:
      type: number
routine:
  - _ref: leads/load_table.yaml
  - id: existing
    type: MongoDBFindOne
    connectionId: table_columns
    properties:
      query:
        tableId: leads
        key:
          _payload: column.key
  - :if:
      _eq:
        - _step: existing
        - null
    :then:
      - :reject: Only user-defined columns can be changed.
  - :set_state:
      replacing:
        _payload: column.key
  - :set_state:
      check:
        _ref: leads/check_column.yaml
  - :if:
      _gt:
        - _array.length:
            _state: check.errors
        - 0
    :then:
      - :reject:
          _array.join:
            - _state: check.errors
            - ' '
  - id: update_column
    type: MongoDBUpdateOne
    connectionId: table_columns
    properties:
      filter:
        tableId: leads
        key:
          _payload: column.key
      update:
        $set:
          title:
            _state: check.doc.title
          type:
            _state: check.doc.type
          kind:
            _state: check.doc.kind
          config:
            _state: check.doc.config
          position:
            _if_none:
              - _payload: position
              - _step: existing.position
          updatedAt:
            _date: now
  - :return:
      column:
        _state: check.doc
