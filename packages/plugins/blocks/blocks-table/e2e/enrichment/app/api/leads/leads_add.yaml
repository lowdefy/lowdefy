# Adds a row: the Table's onRowAdd { values }. The row's autoRun columns start at once.
id: leads_add
type: Api
payloadSchema:
  type: object
  required:
    - values
  additionalProperties: false
  properties:
    values:
      type: object
routine:
  - _ref: leads/load_table.yaml
  - :set_state:
      rows:
        - _payload: values
  - :set_state:
      converted:
        _ref: leads/rows_to_docs.yaml
      autoRun:
        _ref: leads/auto_run_roots.yaml
  - :if:
      _gt:
        - _array.length:
            _state: converted.errors
        - 0
    :then:
      - :reject:
          _array.join:
            - _state: converted.errors
            - ' '
  - id: insert_lead
    type: MongoDBInsertOne
    connectionId: leads
    properties:
      doc:
        _object.assign:
          - _state: converted.docs.0
          # - org_id:
          #     _user: organization.id
          - createdAt:
              _date: now
  - _ref:
      path: api/leads/start_auto_run.yaml
      vars:
        selection:
          - _step: insert_lead.insertedId
  - :return:
      insertedId:
        _step: insert_lead.insertedId
