# ============================================================================================
# E2E ONLY. DO NOT COPY api/test/ INTO AN APP.
# The api/test endpoints delete, overwrite and dump every lead and column. They exist so the
# enrichment e2e suite can seed and inspect its database, and they are no part of the
# reference. This guard is their first step: an endpoint refuses every call unless the
# ENRICHMENT_E2E_SECRET secret (LOWDEFY_SECRET_ENRICHMENT_E2E_SECRET, set only by the e2e
# Playwright config) is set and the payload's e2eSecret equals it.
# ============================================================================================
:if:
  _not:
    _and:
      - _type:
          type: string
          on:
            _secret: ENRICHMENT_E2E_SECRET
      - _ne:
          - _secret: ENRICHMENT_E2E_SECRET
          - ''
      - _eq:
          - _payload: e2eSecret
          - _secret: ENRICHMENT_E2E_SECRET
:then:
  - :reject: This endpoint is only for the end-to-end tests.
