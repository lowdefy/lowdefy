# ============================================================================================
# E2E ONLY. DO NOT COPY: this endpoint deletes every lead and user column.
# It refuses every call without the e2e secret (api/test/e2e_guard.yaml), and is no part
# of the enrichment reference.
# ============================================================================================
# E2E only: empties both collections and inserts the seed leads.
id: test_reset
type: Api
routine:
  - _ref: api/test/e2e_guard.yaml
  - id: clear_leads
    type: MongoDBDeleteMany
    connectionId: leads
    properties:
      filter: {}
  - id: clear_columns
    type: MongoDBDeleteMany
    connectionId: table_columns
    properties:
      filter: {}
  - id: seed
    type: MongoDBInsertMany
    connectionId: leads
    properties:
      docs:
        _ref: api/test/seed_leads.yaml
  - :return:
      insertedCount:
        _step: seed.insertedCount
