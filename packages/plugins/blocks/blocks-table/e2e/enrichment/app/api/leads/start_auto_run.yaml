# Queues the autoRun columns (`_state: autoRun`) of new rows (the `selection` var) and starts
# a worker, as enrichment_run does.
- :if:
    _gt:
      - _array.length:
          _state: autoRun
      - 0
  :then:
    - id: enqueue_auto_run
      type: MongoDBEnrichmentEnqueue
      connectionId: leads
      properties:
        filter: {}
        fields:
          _state: fields
        columnDefs:
          _state: columnDefs
        columns:
          _state: autoRun
        selection:
          _var: selection
    - :if:
        _gt:
          - _step: enqueue_auto_run.queued
          - 0
      :then:
        - id: start_worker
          type: CallApi
          properties:
            endpointId: enrichment_worker
            detached: true
