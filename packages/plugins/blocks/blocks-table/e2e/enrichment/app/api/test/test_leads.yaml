# ============================================================================================
# E2E ONLY. DO NOT COPY: this endpoint returns every lead with all its fields.
# It refuses every call without the e2e secret (api/test/e2e_guard.yaml), and is no part
# of the enrichment reference.
# ============================================================================================
# E2E only: every lead, with its enrichment cells, in insert order.
id: test_leads
type: Api
routine:
  - _ref: api/test/e2e_guard.yaml
  - id: find
    type: MongoDBFind
    connectionId: leads
    properties:
      query: {}
      options:
        sort:
          _id: 1
  - :return:
      _step: find
