# The enrichment tables reference app: a leads table whose columns compute per row from other
# columns, through providers (API endpoints of this app) run by a server-side worker over a
# MongoDB run queue. See code-docs/plans/enrichment-tables.md and the "Enrichment run queue"
# section of the MongoDB connection docs.
#
#   leads/        the table: declared columns, MongoDBTableQuery fields, provider catalogue,
#                 queue settings, and the shared routine that loads the merged columns
#   api/enrichment/  enrichment_run (queue cells, start a worker) and enrichment_worker
#   api/providers/   one endpoint per provider: enrich_<provider id>
#   api/columns/     add, update and delete user-defined columns
#   api/leads/       add, import and update rows
#   api/test/        e2e only: seeding and inspecting the database. Not part of the reference.
#   websockets.yaml  live cell updates from a change stream on the rows
#   pages/           the enrichment page
#
# Secrets (LOWDEFY_SECRET_<name>): ENRICHMENT_MONGODB_URI (a replica set, for change streams),
# ENRICHMENT_API_URL (the enrichment services), ANTHROPIC_API_KEY and ANTHROPIC_BASE_URL. The
# CRON_SECRET environment variable secures the cron route and detached endpoint calls. The e2e
# run points all services at local mocks (e2e/enrichment/mocks/mockServices.mjs).
#
# The app has no auth, so every Api endpoint is public. A real app protects enrichment_run and
# the columns and leads endpoints under auth.api, and scopes every request by tenant (see the
# commented `org_id` lines).

lowdefy: local
name: Enrichment tables reference

connections:
  _ref: connections.yaml

api:
  - _ref: api/enrichment/enrichment_run.yaml
  - _ref: api/enrichment/enrichment_worker.yaml
  - _ref: api/providers/enrich_company_lookup.yaml
  - _ref: api/providers/enrich_email_finder.yaml
  - _ref: api/providers/enrich_ai.yaml
  - _ref: api/columns/columns_add.yaml
  - _ref: api/columns/columns_update.yaml
  - _ref: api/columns/columns_delete.yaml
  - _ref: api/leads/leads_add.yaml
  - _ref: api/leads/leads_import.yaml
  - _ref: api/leads/leads_update.yaml
  - _ref: api/test/test_reset.yaml
  - _ref: api/test/test_leads.yaml
  - _ref: api/test/test_columns.yaml
  - _ref: api/test/test_set_cell.yaml
  - _ref: api/test/test_start_workers.yaml

websockets:
  _ref: websockets.yaml

pages:
  - _ref: pages/enrichment.yaml
