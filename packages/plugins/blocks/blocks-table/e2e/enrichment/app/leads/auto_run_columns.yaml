# The autoRun columns a new row starts: every enrichment and ai column with autoRun. They are
# queued together: a column that reads another of them waits for it (MongoDBEnrichmentEnqueue
# queues it with waitingFor, and MongoDBEnrichmentComplete releases it when the column it reads
# completes), so the waterfall between columns needs nothing here.
_js:
  fn: |
    return args.columns
      .filter(
        (column) =>
          (column.kind === 'enrichment' || column.kind === 'ai') && column.autoRun === true
      )
      .map((column) => column.key);
  args:
    columns:
      _state: columnDefs
