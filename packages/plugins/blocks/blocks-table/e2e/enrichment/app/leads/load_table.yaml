# Loads the table for an endpoint: the merged columns as `columnDefs`, and the fields allowlist
# with the user-defined input columns added. Every endpoint reads the columns on the server,
# never from the payload, so a browser can not send a column the table does not have.
- id: load_columns
  type: MongoDBAggregation
  connectionId: table_columns
  properties:
    _ref: leads/get_columns.yaml
- :set_state:
    columnDefs:
      _step: load_columns
    fields:
      _js:
        fn: |
          // A user-defined input column stores what users type under values.<key>, so it can
          // never name (and expose) another field of the row.
          const fields = { ...args.declared };
          args.columns
            .filter((column) => column.userDefined === true && column.kind === 'input')
            .forEach((column) => {
              fields[column.key] = { type: column.type ?? 'text', path: `values.${column.key}` };
            });
          return fields;
        args:
          declared:
            _ref: leads/fields.yaml
          columns:
            _step: load_columns
