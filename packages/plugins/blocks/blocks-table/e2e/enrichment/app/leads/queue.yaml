# Run queue settings, shared by the worker's claim and complete requests.
#
# Tuned small for the e2e run so retries are fast. In production keep the request defaults
# (backoffMs: 30000, doubled per attempt; leaseMs: 120000), and keep the lease longer than
# the slowest provider call (the AxiosHttp timeouts in connections.yaml).

# Cells per claim. :parallel_for runs every claimed cell at once, so this is the worker's
# concurrency.
claimLimit: 5
leaseMs: 60000
maxAttempts: 3
backoffMs: 300
# How long one worker run keeps claiming. Keep it below the server's request timeout
# (config.requestTimeout, 30 seconds by default): a cron run is a request.
timeBudgetMs: 20000
maxRounds: 50
