# The MongoDBAggregation properties of the column list: the user-defined columns of the leads
# table, flattened from { key, title, type, kind, config, position }, merged with the declared
# columns and sorted by position. One definition, used by the page (`_request: get_columns`,
# for the Table `columns`) and by every endpoint (leads/load_table.yaml, for `columnDefs`), so
# the browser and the server always see the same columns.
pipeline:
  - $match:
      tableId: leads
      # A multi-tenant app scopes user columns too:
      # org_id:
      #   _user: organization.id
  - $replaceWith:
      $mergeObjects:
        - $config
        - key: $key
          title: $title
          type: $type
          kind: $kind
          position: $position
          userDefined: true
  - $unionWith:
      pipeline:
        # $literal, so text in the declared columns (a prompt with a "$") is never read as
        # an aggregation expression.
        - $documents:
            $literal:
              _ref: leads/columns.yaml
  - $sort:
      position: 1
      key: 1
