# The autoRun columns a new row starts: those whose inputs are all fields or literal values.
# The columns that read other enrichment columns follow on their own, as the cells they read
# complete (MongoDBEnrichmentComplete returns them as `downstream`). Queued together, they
# would find their inputs not yet run and be set to "Missing input".
_js:
  fn: |
    const runnable = new Set(
      args.columns
        .filter((column) => column.kind === 'enrichment' || column.kind === 'ai')
        .map((column) => column.key)
    );
    return args.columns
      .filter(
        (column) =>
          runnable.has(column.key) &&
          column.autoRun === true &&
          Object.values(column.inputs ?? {}).every((input) => !runnable.has(input.column))
      )
      .map((column) => column.key);
  args:
    columns:
      _state: columnDefs
