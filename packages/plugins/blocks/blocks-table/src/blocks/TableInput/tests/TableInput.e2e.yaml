id: table-input
type: Box

blocks:
  # ============================================
  # EDIT, ADD, DELETE, ORDER (value = the changes over data)
  # ============================================

  - id: lines
    type: TableInput
    properties:
      rowKey: id
      addRow: true
      rowDrag: true
      deleteRows: true
      rowActions:
        delete: true
      columns:
        - key: item
          editable: true
          validate:
            - pass: { op: notEmpty }
              message: Item is required
        - key: qty
          type: number
          width: 100
          editable: true
          default: 1
          validate:
            - pass: { op: gte, value: 0 }
              message: Quantity cannot be negative
        - key: note
          field: details.note
          editable: true
        - key: id
          title: Key
      data:
        - id: a
          item: Apples
          qty: 3
          details:
            note: fresh
        - id: b
          item: Bread
          qty: 1
          details:
            note: rye
        - id: c
          item: Cheese
          qty: 2
          details:
            note: aged
    events:
      onChange:
        - id: record_change
          type: SetState
          params:
            lines_change:
              cause:
                _event: cause
              rowKey:
                _event: rowKey
              skipped:
                _event: skipped
      onRowClick:
        - id: record_lines_click
          type: SetState
          params:
            lines_click:
              rowKey:
                _event: rowKey
              index:
                _event: index

  - id: lines_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'value='
          - _json.stringify:
              - _state: lines
              - space: 0

  - id: lines_click_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'click='
          - _json.stringify:
              - _state: lines_click
              - space: 0

  - id: lines_change_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'change='
          - _json.stringify:
              - _state: lines_change
              - space: 0

  - id: lines_reset
    type: Button
    properties:
      title: Reset changes
    events:
      onClick:
        - id: reset_lines
          type: CallMethod
          params:
            blockId: lines
            method: resetChanges

  # ============================================
  # FRACTIONAL POSITIONS
  # ============================================

  - id: steps
    type: TableInput
    properties:
      addRow: true
      rowDrag:
        positionField: position
      columns:
        - key: title
          editable: true
        - key: position
          type: number
      data:
        - _id: s1
          title: Plan
          position: 1024
        - _id: s2
          title: Build
          position: 2048
        - _id: s3
          title: Ship
          position: 3072

  - id: steps_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'steps='
          - _json.stringify:
              - _state: steps
              - space: 0

  # ============================================
  # PAGINATED: moves and adds over every page
  # ============================================

  - id: lines_paged
    type: TableInput
    properties:
      rowKey: id
      pagination: true
      pageSize: 2
      rowDrag: true
      columns:
        - key: item
      data:
        - id: a
          item: Apples
        - id: b
          item: Bread
        - id: c
          item: Cheese
        - id: d
          item: Dates
        - id: e
          item: Eggs

  - id: lines_paged_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'paged='
          - _json.stringify:
              - _state: lines_paged
              - space: 0

  - id: steps_paged
    type: TableInput
    properties:
      pagination: true
      pageSize: 2
      addRow: true
      rowDrag:
        positionField: position
      columns:
        - key: title
          editable: true
        - key: position
          type: number
      data:
        - _id: s1
          title: Plan
          position: 1024
        - _id: s2
          title: Build
          position: 2048
        - _id: s3
          title: Test
          position: 3072
        - _id: s4
          title: Ship
          position: 4096
        - _id: s5
          title: Launch
          position: 5120

  - id: steps_paged_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'steps='
          - _json.stringify:
              - _state: steps_paged
              - space: 0

  # ============================================
  # SORTED: edits by key, reorder off
  # ============================================

  - id: lines_sorted
    type: TableInput
    properties:
      rowKey: id
      rowDrag: true
      defaultView:
        sort:
          - key: item
            desc: true
      columns:
        - key: item
          editable: true
      data:
        - id: a
          item: Apples
        - id: b
          item: Bread

  - id: lines_sorted_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'sorted='
          - _json.stringify:
              - _state: lines_sorted
              - space: 0
