id: table-header-menu
type: Box

blocks:
  # ============================================
  # HEADER MENU
  # ============================================

  - id: menu_table
    type: Table
    properties:
      columns:
        - key: name
          title: Name
        - key: team
          filterable: false
        - key: age
          type: number
          width: 100
        - key: city
          width: 70
      data:
        _ref: ../../src/blocks/Table/tests/people.yaml
    events:
      onChange:
        - id: set_menu_cause
          type: SetState
          params:
            menu_cause:
              _event: cause

  - id: menu_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'sort='
          - _json.stringify:
              - _state: menu_table.view.sort
              - space: 0
          - ' columns='
          - _json.stringify:
              - _state: menu_table.view.columns
              - space: 0
          - ' cause='
          - _if_none:
              - _state: menu_cause
              - none

  - id: menu_off_table
    type: Table
    properties:
      headerMenu: false
      columns:
        _ref: ../../src/blocks/Table/tests/people_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/people.yaml

  # ============================================
  # COLUMN MANAGER
  # ============================================

  - id: manager_table
    type: Table
    properties:
      defaultView:
        columns:
          - key: name
            pinned: start
          - key: team
          - key: age
          - key: city
            hidden: true
      columns:
        _ref: ../../src/blocks/Table/tests/people_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/people.yaml
    events:
      onChange:
        - id: set_manager_cause
          type: SetState
          params:
            manager_cause:
              _event: cause
            manager_changes:
              _sum:
                - _if_none:
                    - _state: manager_changes
                    - 0
                - 1

  - id: manager_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'columns='
          - _json.stringify:
              - _state: manager_table.view.columns
              - space: 0
          - ' cause='
          - _if_none:
              - _state: manager_cause
              - none
          - ' changes='
          - _if_none:
              - _state: manager_changes
              - 0

  - id: open_manager
    type: Button
    properties:
      title: Open column manager
    events:
      onClick:
        - id: open_manager_action
          type: CallMethod
          params:
            blockId: manager_table
            method: openColumnManager
