id: bulk
type: Box

blocks:
  # ============================================
  # BULK ACTION BAR
  # ============================================

  - id: bk
    type: Table
    properties:
      rowSelection:
        type: checkbox
      columns:
        _ref: ../../src/blocks/Table/tests/people_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/people.yaml
    slots:
      bulkActions:
        blocks:
          - id: bk_assign
            type: Button
            properties:
              title: Assign
            events:
              onClick:
                - id: read_selection
                  type: SetState
                  params:
                    bk_assigned:
                      _state: bk.selected
          - id: bk_done
            type: Button
            properties:
              title: Done
            events:
              onClick:
                - id: clear_bk_selection
                  type: CallMethod
                  params:
                    blockId: bk
                    method: clearSelection
    events:
      onSelectionChange:
        - id: set_bk_rows
          type: SetState
          params:
            bk_rows:
              _array.length:
                _event: rows

  - id: bk_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'selected='
          - _json.stringify:
              - _state: bk.selected
              - space: 0
          - ' assigned='
          - _json.stringify:
              - _if_none:
                  - _state: bk_assigned
                  - null
              - space: 0
          - ' rows='
          - _if_none:
              - _state: bk_rows
              - none

  # ============================================
  # QUEUE: SINGLE-KEY ACTIONS AND keyboard.next
  # ============================================

  - id: queue
    type: Table
    properties:
      keyboard:
        next: true
      columns:
        - key: name
          title: Name
        - key: team
        - key: actions
          type: buttons
          cell:
            buttons:
              - eventName: onArchive
                title: Archive
                key: a
              - eventName: onFlag
                title: Flag
                key: f
                hiddenField: flagged
        - key: more
          type: menu
          cell:
            items:
              - eventName: onSnooze
                title: Snooze
                key: s
      data:
        - id: 1
          name: Charlie
          team: Blue
        - id: 2
          name: alice
          team: Red
          flagged: true
        - id: 3
          name: Bob
          team: Blue
    events:
      onArchive:
        - id: log_archive
          type: SetState
          params:
            queue_last:
              _string.concat:
                - 'archive:'
                - _event: rowKey
                - ':'
                - _event: button.title
                - ':'
                - _event: buttonIndex
      onFlag:
        - id: log_flag
          type: SetState
          params:
            queue_last:
              _string.concat:
                - 'flag:'
                - _event: rowKey
      onSnooze:
        - id: log_snooze
          type: SetState
          params:
            queue_last:
              _string.concat:
                - 'snooze:'
                - _event: rowKey
                - ':'
                - _event: item.title
                - ':'
                - _event: itemIndex

  - id: queue_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'last='
          - _if_none:
              - _state: queue_last
              - none

  - id: queue_stay
    type: Table
    properties:
      columns:
        - key: name
        - key: actions
          type: buttons
          cell:
            buttons:
              - eventName: onArchive
                title: Archive
                key: a
      data:
        - id: 1
          name: Charlie
        - id: 2
          name: alice
    events:
      onArchive:
        - id: log_archive
          type: SetState
          params:
            queue_stay_last:
              _event: rowKey

  - id: queue_stay_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'last='
          - _if_none:
              - _state: queue_stay_last
              - none
