id: table-parity
type: Box

blocks:
  - id: parity_light
    type: TableLight
    properties:
      _ref: ../../src/blocks/Table/tests/parity_properties.yaml
    events:
      onRowClick:
        - id: set_light_row
          type: SetState
          params:
            light_row:
              _json.stringify:
                - _event: true
                - space: 0
      onCellClick:
        - id: set_light_cell
          type: SetState
          params:
            light_cell:
              _json.stringify:
                - _event: true
                - space: 0
      onEdit:
        - id: set_light_button
          type: SetState
          params:
            light_button:
              _json.stringify:
                - _event: true
                - space: 0

  - id: parity_light_events
    type: Span
    properties:
      content:
        _string.concat:
          - 'row='
          - _if_none: [{ _state: light_row }, none]
          - ' cell='
          - _if_none: [{ _state: light_cell }, none]
          - ' button='
          - _if_none: [{ _state: light_button }, none]

  - id: parity_table
    type: Table
    properties:
      _ref: ../../src/blocks/Table/tests/parity_properties.yaml
    events:
      onRowClick:
        - id: set_table_row
          type: SetState
          params:
            table_row:
              _json.stringify:
                - _event: true
                - space: 0
      onCellClick:
        - id: set_table_cell
          type: SetState
          params:
            table_cell:
              _json.stringify:
                - _event: true
                - space: 0
      onEdit:
        - id: set_table_button
          type: SetState
          params:
            table_button:
              _json.stringify:
                - _event: true
                - space: 0

  - id: parity_table_events
    type: Span
    properties:
      content:
        _string.concat:
          - 'row='
          - _if_none: [{ _state: table_row }, none]
          - ' cell='
          - _if_none: [{ _state: table_cell }, none]
          - ' button='
          - _if_none: [{ _state: table_button }, none]
