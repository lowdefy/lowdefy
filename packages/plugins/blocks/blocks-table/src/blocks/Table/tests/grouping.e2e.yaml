id: grouping
type: Box

blocks:
  # ============================================
  # ONE LEVEL, COLLAPSE AND VALUE
  # ============================================

  - id: group_single
    type: Table
    properties:
      columns:
        _ref: ../../src/blocks/Table/tests/grouping_deals_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/grouping_deals.yaml
      defaultView:
        group:
          - key: region
        aggregates:
          margin: avg
    events:
      onChange:
        - id: set_group_single_cause
          type: SetState
          params:
            group_single_cause:
              _event: cause

  - id: group_nokeys
    type: Table
    properties:
      keyboard: false
      columns:
        _ref: ../../src/blocks/Table/tests/grouping_deals_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/grouping_deals.yaml
      defaultView:
        group:
          - key: region

  - id: group_single_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'group='
          - _json.stringify:
              - _state: group_single.view.group
              - space: 0
          - ' collapsed='
          - _json.stringify:
              - _state: group_single.view.collapsedGroups
              - space: 0
          - ' cause='
          - _if_none:
              - _state: group_single_cause
              - none

  - id: group_single_collapse_apac
    type: Button
    properties:
      title: Collapse APAC by value
    events:
      onClick:
        - id: set_group_single_collapsed
          type: SetState
          params:
            group_single.view.collapsedGroups:
              - '["APAC"]'

  # ============================================
  # TWO LEVELS
  # ============================================

  - id: group_two
    type: Table
    properties:
      columns:
        _ref: ../../src/blocks/Table/tests/grouping_deals_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/grouping_deals.yaml
      defaultView:
        group:
          - key: region
          - key: rep
        collapsedGroups:
          - '["APAC"]'

  # ============================================
  # ORDER: ENUM OPTIONS AND SORTED GROUP COLUMN
  # ============================================

  - id: group_enum
    type: Table
    properties:
      columns:
        _ref: ../../src/blocks/Table/tests/grouping_deals_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/grouping_deals.yaml
      defaultView:
        group:
          - key: stage

  - id: group_sorted
    type: Table
    properties:
      columns:
        _ref: ../../src/blocks/Table/tests/grouping_deals_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/grouping_deals.yaml
      defaultView:
        group:
          - key: region
        sort:
          - key: region
          - key: amount
            desc: true

  # ============================================
  # SELECTION
  # ============================================

  - id: group_select
    type: Table
    properties:
      rowSelection:
        type: checkbox
      columns:
        _ref: ../../src/blocks/Table/tests/grouping_deals_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/grouping_deals.yaml
      defaultView:
        group:
          - key: region

  - id: group_select_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'selected='
          - _json.stringify:
              - _state: group_select.selected
              - space: 0

  # ============================================
  # METHODS
  # ============================================

  - id: group_methods
    type: Table
    properties:
      columns:
        _ref: ../../src/blocks/Table/tests/grouping_deals_columns.yaml
      data:
        _ref: ../../src/blocks/Table/tests/grouping_deals.yaml
    events:
      onChange:
        - id: set_group_methods_cause
          type: SetState
          params:
            group_methods_cause:
              _event: cause

  - id: group_methods_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'group='
          - _json.stringify:
              - _state: group_methods.view.group
              - space: 0
          - ' collapsed='
          - _json.stringify:
              - _state: group_methods.view.collapsedGroups
              - space: 0
          - ' cause='
          - _if_none:
              - _state: group_methods_cause
              - none

  - id: group_by_region_rep
    type: Button
    properties:
      title: Group by region and rep
    events:
      onClick:
        - id: call_set_group
          type: CallMethod
          params:
            blockId: group_methods
            method: setGroup
            args:
              - - region
                - key: rep

  - id: group_collapse_all
    type: Button
    properties:
      title: Collapse all
    events:
      onClick:
        - id: call_collapse_all
          type: CallMethod
          params:
            blockId: group_methods
            method: collapseAllGroups

  - id: group_expand_all
    type: Button
    properties:
      title: Expand all
    events:
      onClick:
        - id: call_expand_all
          type: CallMethod
          params:
            blockId: group_methods
            method: expandAllGroups

  - id: group_remove
    type: Button
    properties:
      title: Remove grouping
    events:
      onClick:
        - id: call_remove_group
          type: CallMethod
          params:
            blockId: group_methods
            method: setGroup
            args:
              - []

  # ============================================
  # STICKY GROUP HEADER
  # ============================================

  - id: group_sticky
    type: Table
    properties:
      height: 300
      columns:
        - key: bucket
          groupable: true
        - key: id
          type: number
      data:
        _js: |
          const rows = new Array(300);
          for (let i = 0; i < rows.length; i++) {
            rows[i] = { id: i, bucket: 'B' + String(Math.floor(i / 30)).padStart(2, '0') };
          }
          return rows;
      defaultView:
        group:
          - key: bucket
