# Enrichment tables with static data: every cell run state, the header progress chip, the
# add-column picker, column management, runs, the details panel, new rows, CSV import, stale
# detection and push updates. The events record their payloads (ev_* spans); the buttons stand
# in for the server, pushing run states with applyTransaction.
#
# inputHash values are hashEnrichmentInputs of the row's inputs: { domain } for email,
# { company } for summary (acme.com 1a05b77ef35f4b, Acme 090d8af64e3940).

id: table-enrichment
type: Box

blocks:
  - id: enrich
    type: Table
    properties:
      rowSelection:
        type: checkbox
      addColumn: true
      addRow: true
      importCsv: true
      providers:
        - id: findEmail
          title: Find email
          description: A work email from a domain.
          inputs:
            - key: domain
              title: Domain
              required: true
            - key: name
              title: Name
          outputs:
            - path: email
              title: Email
              type: email
            - path: confidence
              title: Confidence
              type: number
        - id: companyInfo
          title: Company info
          inputs:
            - key: domain
              title: Domain
              required: true
      columns:
        - key: company
          kind: input
          editable: true
          width: 130
        - key: domain
          kind: input
          width: 130
        - key: email
          kind: enrichment
          type: email
          provider: findEmail
          inputs:
            domain:
              column: domain
          output: email
          width: 190
        - key: summary
          kind: ai
          prompt: Summarise {{ company }} in one line.
          inputs:
            company:
              column: company
          userDefined: true
          width: 170
        - key: linkedin
          kind: extract
          source: email
          path: profile.linkedin
          userDefined: true
          width: 150
        - key: label
          kind: formula
          template: '{{ company }} ({{ domain }})'
          userDefined: true
          width: 190
      data:
        - _id: r1
          company: Acme
          domain: acme.com
          _enrich:
            email:
              status: ok
              value: ada@acme.com
              inputHash: 1a05b77ef35f4b
              attempts: 1
              queuedAt: '2026-09-01T10:00:00.000Z'
              startedAt: '2026-09-01T10:00:01.000Z'
              finishedAt: '2026-09-01T10:00:03.000Z'
              raw:
                email: ada@acme.com
                confidence: 0.92
                profile:
                  linkedin: in/ada
                  name: Ada Lovelace
                sources:
                  - acme.com/team
                  - acme.com/about
            summary:
              status: ok
              value: Makes anvils.
              inputHash: 090d8af64e3940
        - _id: r2
          company: Globex
          domain: globex.com
          _enrich:
            email:
              status: queued
            summary:
              status: running
        - _id: r3
          company: Initech
          domain: initech.com
          _enrich:
            email:
              status: running
        - _id: r4
          company: Umbrella
          domain: umbrella.com
          _enrich:
            email:
              status: error
              error: Rate limited by the provider
              attempts: 3
        - _id: r5
          company: Hooli
          domain: hooli.com
          _enrich:
            email:
              status: empty
              inputHash: 1e5c13bad9a3b2
        - _id: r6
          company: Stark
          domain: stark.com
          _enrich:
            email:
              status: ok
              value: tony@old.com
              inputHash: 1a687e43723543
        - _id: r7
          company: Wayne
          domain: wayne.com
        - _id: r8
          company: Cyberdyne
          domain: cyberdyne.com
          _enrich:
            email:
              status: running
    events:
      onColumnAdd:
        - id: record_column_add
          type: SetState
          params:
            ev.onColumnAdd:
              _event: true
      onColumnUpdate:
        - id: record_column_update
          type: SetState
          params:
            ev.onColumnUpdate:
              _event: true
      onColumnDelete:
        - id: record_column_delete
          type: SetState
          params:
            ev.onColumnDelete:
              _event: true
      onColumnRun:
        - id: record_column_run
          type: SetState
          params:
            ev.onColumnRun:
              _event: true
      onRowRun:
        - id: record_row_run
          type: SetState
          params:
            ev.onRowRun:
              rowKey:
                _event: rowKey
              columns:
                _event: columns
              company:
                _event: row.company
      onCellRun:
        - id: record_cell_run
          type: SetState
          params:
            ev.onCellRun:
              rowKey:
                _event: rowKey
              column:
                _event: column
              company:
                _event: row.company
      onRowAdd:
        - id: row_add_wait
          type: Wait
          params:
            ms: 600
        - id: record_row_add
          type: SetState
          params:
            ev.onRowAdd:
              _event: true
        - id: row_add_push
          type: CallMethod
          params:
            blockId: enrich
            method: applyTransaction
            args:
              - add:
                  - _object.assign:
                      - _event: values
                      - _id: saved
      onImport:
        - id: import_wait
          type: Wait
          params:
            ms: 150
        - id: record_import
          type: SetState
          params:
            ev.onImport:
              _array.concat:
                - _if_none:
                    - _state: ev.onImport
                    - []
                - - batchIndex:
                      _event: batchIndex
                    batchCount:
                      _event: batchCount
                    total:
                      _event: total
                    count:
                      _array.length:
                        _event: rows
                    first:
                      _get:
                        key: '0'
                        from:
                          _event: rows
                    newColumns:
                      _event: newColumns

  - id: enrich_push_ok
    type: Button
    properties:
      title: Push queued result
    events:
      onClick:
        - id: push_ok
          type: CallMethod
          params:
            blockId: enrich
            method: applyTransaction
            args:
              - merge: deep
                update:
                  - _id: r2
                    _enrich:
                      email:
                        status: ok
                        value: hank@globex.com
                        inputHash: 15cef028bd6744

  - id: enrich_push_running
    type: Button
    properties:
      title: Push running
    events:
      onClick:
        - id: push_running
          type: CallMethod
          params:
            blockId: enrich
            method: applyTransaction
            args:
              - merge: deep
                update:
                  - _id: r7
                    _enrich:
                      email:
                        status: running
                  - _id: r5
                    _enrich:
                      email:
                        status: running

  - id: enrich_change_domain
    type: Button
    properties:
      title: Change domain
    events:
      onClick:
        - id: change_domain
          type: CallMethod
          params:
            blockId: enrich
            method: applyTransaction
            args:
              - update:
                  - _id: r1
                    domain: acme.io

  - id: enrich_events
    type: Box
    blocks:
      - id: ev_onColumnAdd
        type: Span
        properties:
          content:
            _json.stringify:
              - _if_none:
                  - _state: ev.onColumnAdd
                  - null
      - id: ev_onColumnUpdate
        type: Span
        properties:
          content:
            _json.stringify:
              - _if_none:
                  - _state: ev.onColumnUpdate
                  - null
      - id: ev_onColumnDelete
        type: Span
        properties:
          content:
            _json.stringify:
              - _if_none:
                  - _state: ev.onColumnDelete
                  - null
      - id: ev_onColumnRun
        type: Span
        properties:
          content:
            _json.stringify:
              - _if_none:
                  - _state: ev.onColumnRun
                  - null
      - id: ev_onRowRun
        type: Span
        properties:
          content:
            _json.stringify:
              - _if_none:
                  - _state: ev.onRowRun
                  - null
      - id: ev_onCellRun
        type: Span
        properties:
          content:
            _json.stringify:
              - _if_none:
                  - _state: ev.onCellRun
                  - null
      - id: ev_onRowAdd
        type: Span
        properties:
          content:
            _json.stringify:
              - _if_none:
                  - _state: ev.onRowAdd
                  - null
      - id: ev_onImport
        type: Span
        properties:
          content:
            _json.stringify:
              - _if_none:
                  - _state: ev.onImport
                  - null

  # ============================================
  # FAILING EVENTS: every event's actions throw (after a short wait, so pending shows)
  # ============================================

  - id: enrich_fail
    type: Table
    properties:
      addColumn:
        kinds: [input, formula]
      addRow: true
      addRowText: Add a company
      importCsv: true
      columns:
        - key: company
          kind: input
        - key: email
          kind: enrichment
          provider: findEmail
          userDefined: true
      data:
        - _id: f1
          company: Acme
    events:
      onColumnAdd:
        - id: fail_add_wait
          type: Wait
          params:
            ms: 400
        - id: fail_add
          type: Throw
          params:
            throw: true
            message: Column limit reached
      onColumnUpdate:
        - id: fail_update_wait
          type: Wait
          params:
            ms: 300
        - id: fail_update
          type: Throw
          params:
            throw: true
            message: Title is taken
      onColumnDelete:
        - id: fail_delete
          type: Throw
          params:
            throw: true
            message: Column is in use
      onColumnRun:
        - id: fail_run
          type: Throw
          params:
            throw: true
            message: Out of credits
      onRowAdd:
        - id: fail_row_wait
          type: Wait
          params:
            ms: 500
        - id: fail_row
          type: Throw
          params:
            throw: true
            message: Duplicate company
      onImport:
        - id: fail_import
          type: Throw
          params:
            throw:
              _eq:
                - _event: batchIndex
                - 1
            message: Batch rejected
