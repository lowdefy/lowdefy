id: table-expandable
type: Box

blocks:
  - id: table_expandable
    type: Table
    properties:
      expandable:
        template: |
          <div class="detail">
            <strong>{{ row.name }}</strong> <span class="notes">{{ row.notes }}</span>
          </div>
        rowExpandable:
          when:
            key: notes
            op: notEmpty
      columns:
        - key: name
          width: 200
        - key: city
      data:
        - id: 1
          name: Ada
          city: London
          notes: Wrote the first program.
        - id: 2
          name: Grace
          city: New York
          notes: <b>Not bold</b>
        - id: 3
          name: Linus
          city: Helsinki
    events:
      onRowExpand:
        - id: set_expandable_event
          type: SetState
          params:
            expandable_event:
              _json.stringify:
                - - _event: rowKey
                  - _event: expanded
                - space: 0

  - id: expandable_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'expanded='
          - _json.stringify:
              - _state: table_expandable.expanded
              - space: 0
          - ' event='
          - _if_none:
              - _state: expandable_event
              - none

  - id: table_expandable_virtual
    type: Table
    properties:
      height: 400
      expandable:
        template: |
          <div class="tall" style="height: 300px">Details of {{ row.name }}</div>
      columns:
        - key: id
          type: number
        - key: name
      data:
        _js: |
          const rows = new Array(1000);
          for (let i = 0; i < rows.length; i++) rows[i] = { id: i, name: 'Row ' + i };
          return rows;
