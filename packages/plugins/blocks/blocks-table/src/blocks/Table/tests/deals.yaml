# Rows of the filtering e2e tables. `created` is relative to today for rows 1 and 2, so the
# relative date filter ("within the last 7 days") has a stable answer.
_js: |
  function daysAgo(days) {
    const date = new Date();
    date.setDate(date.getDate() - days);
    return date.toISOString().slice(0, 10);
  }
  return [
    { id: 1, name: 'Acme deal', stage: 'won', amount: 1200, created: daysAgo(2), active: true, owner: 'Dana' },
    { id: 2, name: 'Globex renewal', stage: 'lost', amount: 300, created: daysAgo(40), active: false, owner: 'Eve' },
    { id: 3, name: 'Initech pilot', stage: 'lead', amount: 150, created: '2020-03-15', active: true, owner: 'Dana' },
    { id: 4, name: 'Umbrella expansion', stage: 'qualified', amount: 800, created: '2020-06-01', active: false, owner: 'Bob' },
    { id: 5, name: 'Acme upsell', stage: 'won', amount: 450, created: '2020-01-10', active: true, owner: 'Eve' },
    { id: 6, name: 'Hooli trial', stage: 'lead', amount: null, created: null, active: null, owner: null },
  ];
