# One TableLight config, rendered by TableParity.e2e.yaml under both `type: TableLight` and
# `type: Table`: every key here is valid on both blocks with the same meaning.
user:
  role: admin
rowRules:
  - when: { key: overdue, op: isTrue }
    className: parity-overdue
columns:
  - name
  - key: amount
    type: currency
    cell: { currency: EUR, locale: en-US }
    aggregate: sum
  - title: Rates
    children:
      - { key: rate, type: percent, cell: { locale: en-US } }
      - key: score
        type: number
        cell: { locale: en-US, decimals: 1 }
        aggregate: avg
        rules:
          - when: { op: lt, value: 5 }
            className: parity-low
  - { key: created, type: date }
  - { key: active, type: boolean, cell: { trueLabel: Active, falseLabel: Idle } }
  - key: stage
    type: tag
    options:
      - { value: lead, label: Lead }
      - { value: won, label: Won, color: success }
  - { key: labels, type: tags, cell: { max: 2 } }
  - key: state
    type: status
    options:
      open: { label: Open, color: processing }
      closed: { label: Closed, color: error }
  - { key: owner, type: avatar }
  - { key: team, type: people }
  - { key: profile, type: link, cell: { pageId: table-link-target, urlQuery: { id: _id } } }
  - { key: email, type: email }
  - { key: site, type: url }
  - { key: progress, type: progress }
  - { key: stars, type: rating }
  - key: bio
    type: html
    cell:
      template: '<b>{{ value }}</b> in {{ row.city }}'
  - { key: meta, type: json }
  - key: note
    tooltip: '{{ row.name }}: {{ value }}'
  - key: actions
    type: buttons
    cell:
      buttons:
        - eventName: onEdit
          title: Edit
        - eventName: onPromote
          title: Promote
          hidden:
            when: { key: role, op: ne, value: { $user: role } }
data:
