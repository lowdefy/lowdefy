# Tag tones (tones.e2e.spec.js): every preset colour, antd status name and a few custom colours as
# Table, TableLight and HTML data-tag chips, for the contrast checks in light and dark mode.
id: tones
type: Box

blocks:
  - id: tones_table
    type: Table
    properties:
      rowKey: id
      maxHeight: 2000
      columns:
        - key: name
