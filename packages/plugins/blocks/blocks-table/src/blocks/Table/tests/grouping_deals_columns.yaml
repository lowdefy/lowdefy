# Columns shared by the grouping e2e tables. `name` is not groupable.
- key: name
- key: region
  groupable: true
- key: rep
  groupable: true
- key: stage
  type: tag
  groupable: true
  options:
    - { value: lead, label: Lead }
    - { value: qualified, label: Qualified }
    - { value: won, label: Won }
- key: amount
  type: number
  aggregate: sum
- key: margin
  type: number
