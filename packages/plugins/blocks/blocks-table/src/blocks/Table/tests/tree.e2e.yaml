id: table-tree
type: Box

events:
  onInit:
    - id: init_lazy_rows
      type: SetState
      params:
        lazy_rows:
          - id: region-a
            name: Region A
            hasChildren: true
          - id: region-b
            name: Region B
    - id: init_nested_expanded
      type: SetState
      params:
        table_tree_nested:
          expanded:
            - 1

blocks:
  # ============================================
  # PARENT FIELD
  # ============================================

  - id: table_tree
    type: Table
    properties:
      tree:
        parentField: parent
      rowSelection:
        type: checkbox
        cascade: true
      columns:
        - key: name
          width: 240
        - key: size
          type: number
      data:
        - id: docs
          name: Docs
          size: 30
        - id: guides
          name: Guides
          size: 20
          parent: docs
        - id: api
          name: API
          size: 5
          parent: docs
        - id: intro
          name: Intro
          size: 2
          parent: guides
        - id: setup
          name: Setup
          size: 8
          parent: guides
        - id: blog
          name: Blog
          size: 10
    events:
      onRowExpand:
        - id: set_tree_expand
          type: SetState
          params:
            tree_expand:
              _string.concat:
                - _event: rowKey
                - ':'
                - _if:
                    test:
                      _event: expanded
                    then: open
                    else: closed

  - id: tree_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'expanded='
          - _json.stringify:
              - _state: table_tree.expanded
              - space: 0
          - ' selected='
          - _json.stringify:
              - _state: table_tree.selected
              - space: 0
          - ' event='
          - _if_none:
              - _state: tree_expand
              - none

  # ============================================
  # CHILDREN FIELD
  # ============================================

  - id: table_tree_nested
    type: Table
    properties:
      tree:
        childrenField: children
      defaultView:
        sort:
          - key: name
      columns:
        - key: name
          width: 240
        - key: size
          type: number
      data:
        - id: 1
          name: Zulu
          size: 3
          children:
            - id: 11
              name: Yankee
              size: 1
            - id: 12
              name: Alpha child
              size: 2
        - id: 2
          name: Mike
          size: 4
          children:
            - id: 21
              name: Kilo
              size: 4

  # ============================================
  # LAZY CHILDREN
  # ============================================

  - id: table_tree_lazy
    type: Table
    properties:
      tree:
        parentField: parent
        lazy: true
      columns:
        - key: name
          width: 240
      data:
        _state: lazy_rows
    events:
      onRowExpand:
        - id: load_children
          type: SetState
          skip:
            _not:
              _event: expanded
          params:
            lazy_rows:
              _array.concat:
                - _state: lazy_rows
                - - id:
                      _string.concat:
                        - _event: rowKey
                        - '-1'
                    name:
                      _string.concat:
                        - _event: row.name
                        - ' child'
                    parent:
                      _event: rowKey
