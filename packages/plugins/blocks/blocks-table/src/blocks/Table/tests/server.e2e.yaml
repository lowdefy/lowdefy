# Server mode. The requests use the test connection; the spec answers them in the browser
# (page.route) from a synthetic 100k row dataset, so it can count requests, delay responses and
# answer them out of order.
id: table-server
type: Box

requests:
  - id: table_rows
    type: TestLog
    connectionId: table_test
    payload:
      startRow:
        _event: startRow
      endRow:
        _event: endRow
      view:
        _event: view
      groupPath:
        _event: groupPath
      selected:
        _event: selected

blocks:
  # ============================================
  # PAGING
  # ============================================

  - id: table_server
    type: Table
    properties:
      height: 400
      rowSelection:
        type: checkbox
      data:
        mode: server
        request: table_rows
        blockSize: 100
      columns:
        - key: id
          type: number
          width: 100
        - key: name
        - key: stage
        - key: amount
          type: number
    events:
      onSelectionChange:
        - id: set_server_selection
          type: SetState
          params:
            server_selection:
              _event: selected
            server_selection_rows:
              _array.length:
                _event: rows
      onExport:
        - id: set_export_view
          type: SetState
          params:
            export_view:
              _event: view

  - id: server_selection_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'selected='
          - _json.stringify:
              - _state: table_server.selected
              - space: 0
          - ' event='
          - _json.stringify:
              - _if_none:
                  - _state: server_selection
                  - none
              - space: 0
          - ' rows='
          - _if_none:
              - _state: server_selection_rows
              - none

  - id: server_export_value
    type: Span
    properties:
      content:
        _string.concat:
          - 'export='
          - _json.stringify:
              - _if_none:
                  - _state: export_view.sort
                  - none
              - space: 0

  - id: server_export
    type: Button
    properties:
      title: Export
    events:
      onClick:
        - id: server_export_call
          type: CallMethod
          params:
            blockId: table_server
            method: exportCsv

  - id: server_refresh
    type: Button
    properties:
      title: Refresh
    events:
      onClick:
        - id: server_refresh_call
          type: CallMethod
          params:
            blockId: table_server
            method: refresh

  - id: server_filter
    type: Button
    properties:
      title: Filter
    events:
      onClick:
        - id: server_filter_set
          type: SetState
          params:
            table_server.view.filter:
              key: stage
              op: eq
              value: won

  - id: server_update
    type: Button
    properties:
      title: Update
    events:
      onClick:
        - id: server_update_call
          type: CallMethod
          params:
            blockId: table_server
            method: applyTransaction
            args:
              - update:
                  - id: 1
                    name: Updated one

  # ============================================
  # GROUPING
  # ============================================

  - id: table_server_grouped
    type: Table
    properties:
      height: 400
      data:
        mode: server
        request: table_rows
        blockSize: 50
      defaultView:
        group:
          - key: stage
        aggregates:
          amount: sum
      columns:
        - key: id
          type: number
          width: 100
        - key: name
        - key: stage
          groupable: true
        - key: amount
          type: number

  # ============================================
  # CLIENT TRANSACTIONS
  # ============================================

  - id: table_transactions
    type: Table
    properties:
      columns:
        - key: id
          type: number
        - key: name
      data:
        - id: 1
          name: One
        - id: 2
          name: Two
        - id: 3
          name: Three

  - id: transactions_apply
    type: Button
    properties:
      title: Apply transaction
    events:
      onClick:
        - id: transactions_apply_call
          type: CallMethod
          params:
            blockId: table_transactions
            method: applyTransaction
            args:
              - update:
                  - id: 2
                    name: Two updated
                remove:
                  - 3
                add:
                  - id: 4
                    name: Four
