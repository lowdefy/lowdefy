# Columns of the filtering and header menu e2e tables: one per filter kind.
- key: name
- key: stage
  type: tag
  options:
    - value: lead
      label: Lead
    - value: qualified
      label: Qualified
    - value: won
      label: Won
    - value: lost
      label: Lost
- key: amount
  type: number
  width: 110
- key: created
  type: date
  width: 130
- key: active
  type: boolean
  width: 90
- key: owner
