id: selectable
type: Box

blocks:
  - id: sel
    type: Table
    properties:
      rowSelection:
        type: checkbox
        selectable:
          key: recheckable
          op: isTrue
      columns:
        - key: name
        - key: recheckable
          type: boolean
      data:
        - id: 1
          name: Alpha
          recheckable: true
        - id: 2
          name: Bravo
          recheckable: false
        - id: 3
          name: Charlie
          recheckable: true

  - id: sel_value
    type: Paragraph
    properties:
      content:
        _string.concat:
          - 'selected='
          - _json.stringify:
              - _if_none:
                  - _state: sel.selected
                  - []
              - space: 0
