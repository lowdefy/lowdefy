- title: Tree with children loaded on expand
  blocks:
    - id: folders_lazy
      type: Table
      properties:
        tree:
          parentField: parent
          lazy: true
        columns:
          - key: name
            title: Folder
            width: 260
        data:
          _if_none:
            - _state: folders_lazy_rows
            - []
      events:
        onMount:
          - id: folders_lazy_init
            type: SetState
            params:
              folders_lazy_rows:
                - _id: invoices
                  name: Invoices
                  hasChildren: true
                - _id: recipes
                  name: Recipes
                  hasChildren: true
        onRowExpand:
          # needsChildren is true only the first time a lazy row opens without children in data.
          - id: folders_lazy_load
            type: SetState
            skip:
              _not:
                _event: needsChildren
            params:
              folders_lazy_rows:
                _array.concat:
                  - _state: folders_lazy_rows
                  - - _id:
                        _string.concat:
                          - _event: rowKey
                          - '-2025'
                      name: '2025'
                      parent:
                        _event: rowKey
                    - _id:
                        _string.concat:
                          - _event: rowKey
                          - '-2026'
                      name: '2026'
                      parent:
                        _event: rowKey

- title: Expandable rows
  blocks:
    - id: recipes_expandable
      type: Table
      properties:
        expandable:
          template: |
            <div style="padding: 8px 0">
              <strong>{{ row.name }}</strong>: {{ row.method }}
            </div>
          rowExpandable:
            when:
              key: method
              op: notEmpty
        columns:
          - key: name
            title: Recipe
            width: 200
          - key: minutes
            type: number
        data:
          - _id: r1
            name: Sourdough loaf
            minutes: 1440
            method: Mix, rest overnight, shape and bake at 250°C.
          - _id: r2
            name: Pancakes
            minutes: 20
            method: Whisk the batter and fry in a hot pan.
          - _id: r3
            name: Toast
            minutes: 3

- title: Inline editing
  fullWidth: true
  blocks:
    - id: deals_editing
      type: Table
      properties:
        columns:
          - key: name
            title: Deal
            width: 220
            editable: true
            validate:
              - pass:
                  op: notEmpty
                message: A deal needs a name.
          - key: stage
            type: status
            editable: true
            options:
              lead: Lead
              won:
                label: Won
                color: success
              lost:
                label: Lost
                color: error
          - key: amount
            type: currency
            editable:
              when:
                key: stage
                op: ne
                value: won
          - key: close_date
            type: date
            editable: true
        data:
          - _id: d1
            name: Acme renewal
            stage: won
            amount: 12000
            close_date: '2026-10-01'
          - _id: d2
            name: Globex expansion
            stage: lead
            amount: 48000
            close_date: '2026-11-15'
      events:
        onCellEdit:
          # A real app saves here, for example with a MongoDBUpdateOne request. The cell shows a
          # saving marker until the actions finish, and reverts if one of them fails.
          - id: deals_editing_wait
            type: Wait
            params:
              ms: 600
          - id: deals_editing_record
            type: SetState
            params:
              deals_editing_last:
                _string.concat:
                  - _event: rowKey
                  - ' '
                  - _event: column.key
                  - ' = '
                  - _json.stringify:
                      - _event: value
    - id: deals_editing_value
      type: Span
      properties:
        content:
          _string.concat:
            - 'Last edit: '
            - _if_none:
                - _state: deals_editing_last
                - none

- title: Reorder rows with positions
