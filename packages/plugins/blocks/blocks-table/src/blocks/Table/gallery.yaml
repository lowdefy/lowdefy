- title: Queue with view tabs and single-key actions
  fullWidth: true
  overflowVisible: true
  blocks:
    - id: tickets_queue
      type: Table
      properties:
        toolbar:
          views: true
        keyboard:
          next: true
        views:
          - id: open
            title: Open
            count: 2
            locked: true
            view:
              filter:
                key: status
                op: eq
                value: open
          - id: waiting
            title: Waiting
            count: 1
            locked: true
            view:
              filter:
                key: status
                op: eq
                value: waiting
        columns:
          - key: subject
            width: 260
          - key: status
            type: tag
            options: [open, waiting]
          - key: actions
            type: buttons
            title: ''
            width: 200
            sortable: false
            cell:
              buttons:
                - eventName: onAssign
                  title: Assign (a)
                  key: a
                - eventName: onSnooze
                  title: Snooze (s)
                  key: s
        data:
          - _id: t1
            subject: Refund for a double charge
            status: open
          - _id: t2
            subject: Change the billing email
            status: open
          - _id: t3
            subject: Waiting for a screenshot
            status: waiting
      events:
        onAssign:
          - id: tickets_queue_assign
            type: SetState
            params:
              tickets_queue_last:
                _string.concat:
                  - 'Assigned '
                  - _event: rowKey
        onSnooze:
          - id: tickets_queue_snooze
            type: SetState
            params:
              tickets_queue_last:
                _string.concat:
                  - 'Snoozed '
                  - _event: rowKey
    - id: tickets_queue_value
      type: Span
      properties:
        content:
          _string.concat:
            - 'Focus a row and press a or s. Last: '
            - _if_none:
                - _state: tickets_queue_last
                - none

- title: Conditional formatting
  blocks:
    - id: invoices_rules
      type: Table
      properties:
        rowRules:
          - when:
              key: overdue
              op: isTrue
            style:
              fontWeight: 600
        columns:
          - key: number
            title: Invoice
          - key: total
            type: currency
            rules:
              - when:
                  op: gte
                  value: 10000
                color: success
          - key: due
            type: date
            rules:
              - when:
                  key: overdue
                  op: isTrue
                color: error
          - key: overdue
            type: boolean
            hidden: true
        data:
          - _id: i1
            number: INV-1001
            total: 12500
            due: '2026-08-01'
            overdue: true
          - _id: i2
            number: INV-1002
            total: 800
            due: '2026-10-30'
            overdue: false

- title: Enrichment table
  fullWidth: true
  blocks:
    - id: leads_enrichment
      type: Table
      properties:
        addColumn: true
        addRow: true
        importCsv: true
        rowSelection:
          type: checkbox
        providers:
          - id: findEmail
            title: Find email
            description: A work email from a name and a domain.
            inputs:
              - key: domain
                title: Domain
                required: true
              - key: name
                title: Name
            outputs:
              - path: email
                title: Email
                type: email
        columns:
          - key: name
            kind: input
            editable: true
            width: 150
          - key: domain
            kind: input
            editable: true
            width: 140
          - key: email
            kind: enrichment
            type: email
            provider: findEmail
            inputs:
              domain:
                column: domain
              name:
                column: name
            output: email
            width: 200
          - key: segment
            kind: ai
            type: tag
            prompt: Which market segment is {{ domain }} in?
            inputs:
              domain:
                column: domain
            output:
              type: tag
              options: [smb, mid-market, enterprise]
            userDefined: true
            width: 140
          - key: linkedin
            kind: extract
            source: email
            path: profile.linkedin
            userDefined: true
          - key: greeting
            kind: formula
            template: Hi {{ name }}, about {{ domain }}
            userDefined: true
            width: 220
        # Each cell's run state lives beside the row's data in `_enrich.<column>`. inputHash is
        # hashEnrichmentInputs of the inputs a value was computed from; Ivan's email is stale:
        # it ran before his domain changed.
        data:
          - _id: l1
            name: Ada
            domain: acme.com
            _enrich:
              email:
                status: ok
                value: ada@acme.com
                inputHash: 1d27590e6f1c9b
                raw:
                  email: ada@acme.com
                  profile:
                    linkedin: in/ada
              segment:
                status: ok
                value: enterprise
          - _id: l2
            name: Grace
            domain: globex.com
            _enrich:
              email:
                status: running
              segment:
                status: queued
          - _id: l3
            name: Alan
            domain: initech.com
            _enrich:
              email:
                status: queued
          - _id: l4
            name: Linus
            domain: umbrella.com
            _enrich:
              email:
                status: error
                error: The provider timed out.
          - _id: l5
            name: Margaret
            _enrich:
              email:
                status: empty
                error: 'Missing input: domain'
          - _id: l6
            name: Ivan
            domain: hooli.com
            _enrich:
              email:
                status: ok
                value: ivan@old-domain.com
                inputHash: 00000000000000
