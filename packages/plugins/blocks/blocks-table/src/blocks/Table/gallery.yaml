        columns:
          - key: name
            title: Deal
            width: 220
            pinned: start
          - key: stage
          - key: owner
          - key: amount
            type: number
        data:
          - _id: d1
            name: Acme renewal
            stage: proposal
            owner: Ada
            amount: 12000
          - _id: d2
            name: Globex expansion
            stage: qualified
            owner: Grace
            amount: 48000
          - _id: d3
            name: Initech pilot
            stage: lead
            owner: Alan
            amount: 3500
    - id: deals_selected
