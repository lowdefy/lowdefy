- title: Basic
  blocks:
    - id: deals_basic
      type: Table
      properties:
        columns:
          - key: name
            title: Deal
            width: 220
          - key: stage
          - key: owner
          - key: amount
            type: number
        data:
          - _id: d1
            name: Acme renewal
            stage: proposal
            owner: Ada
            amount: 12000
          - _id: d2
            name: Globex expansion
            stage: qualified
            owner: Grace
            amount: 48000
          - _id: d3
            name: Initech pilot
            stage: lead
            owner: Alan
            amount: 3500

- title: Default view, selection and pinned columns
  blocks:
    - id: deals_selection
      type: Table
      properties:
        rowSelection:
          type: checkbox
        defaultView:
          sort:
            - key: amount
              desc: true
          density: compact
        columns:
          - key: name
            title: Deal
            width: 220
            pinned: start
          - key: stage
          - key: owner
          - key: amount
            type: number
        data:
          - _id: d1
            name: Acme renewal
            stage: proposal
            owner: Ada
            amount: 12000
          - _id: d2
            name: Globex expansion
            stage: qualified
            owner: Grace
            amount: 48000
          - _id: d3
            name: Initech pilot
            stage: lead
            owner: Alan
            amount: 3500
    - id: deals_selected
      type: Span
      properties:
        content:
          _string.concat:
            - 'Selected: '
            - _json.stringify:
                - _state: deals_selection.selected
                - space: 0

- title: Row links
  blocks:
    - id: deals_links
      type: Table
      properties:
        rowLink:
          pageId: deal
          urlQuery:
            _id: _id
        columns:
          - key: name
            title: Deal
          - key: owner
        data:
          - _id: d1
            name: Acme renewal
            owner: Ada
          - _id: d2
            name: Globex expansion
            owner: Grace
