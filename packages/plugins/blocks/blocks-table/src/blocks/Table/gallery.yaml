          pageId: deal
          urlQuery:
            _id: _id
        columns:
          - key: name
            title: Deal
          - key: owner
        data:
          - _id: d1
            name: Acme renewal
            owner: Ada
          - _id: d2
            name: Globex expansion
            owner: Grace

- title: Bulk actions and hover buttons
  fullWidth: true
  blocks:
    - id: tickets_bulk
      type: Table
      properties:
        rowSelection:
          type: checkbox
        columns:
          - key: subject
            width: 260
          - key: requester
          - key: priority
            type: tag
            options:
              - value: high
                label: High
                color: red
              - value: normal
                label: Normal
                color: blue
          - key: actions
            type: buttons
            title: ''
            width: 96
            pinned: end
            sortable: false
            cell:
              showOn: hover
              buttons:
                - eventName: onReply
                  title: Reply
                  icon: mail
                  hideTitle: true
                - eventName: onClose
                  title: Close
                  icon: check
                  hideTitle: true
        data:
          - _id: t1
            subject: Cannot export the monthly invoice
            requester: Ada
            priority: high
          - _id: t2
            subject: How do I add a second address?
            requester: Grace
            priority: normal
          - _id: t3
            subject: Login link expired
            requester: Alan
            priority: normal
      slots:
        bulkActions:
          blocks:
            - id: tickets_bulk_close
              type: Button
              properties:
                title: Close selected
                size: small
              events:
                onClick:
                  - id: tickets_bulk_record
                    type: SetState
                    params:
                      tickets_bulk_closed:
                        _state: tickets_bulk.selected
      events:
        onReply:
          - id: tickets_bulk_reply
            type: SetState
            params:
              tickets_bulk_last:
                _string.concat:
                  - 'Reply to '
                  - _event: row.requester
        onClose:
          - id: tickets_bulk_close_one
            type: SetState
            params:
              tickets_bulk_last:
                _string.concat:
                  - 'Close '
                  - _event: rowKey
    - id: tickets_bulk_status
      type: Span
      properties:
        content:
          _string.concat:
            - 'Last action: '
            - _if_none:
                - _state: tickets_bulk_last
                - none
            - ' · Closed: '
            - _json.stringify:
                - _if_none:
                    - _state: tickets_bulk_closed
                    - []
                - space: 0

