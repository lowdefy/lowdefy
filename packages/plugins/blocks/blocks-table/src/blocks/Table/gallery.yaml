            probability: 60
            labels: [strategic]
            updated: '2026-09-02'
            website: https://example.org
          - _id: d3
            name: Initech pilot
            stage: lead
            owner: Alan Turing
            amount: 3500
            probability: 20
            labels: [at-risk, renewal]
            updated: '2026-08-15'
          - _id: d4
            name: Umbrella upsell
            stage: lost
            owner: Ada Lovelace
            amount: 9000
            probability: 0
            labels: []
            updated: '2026-07-30'

