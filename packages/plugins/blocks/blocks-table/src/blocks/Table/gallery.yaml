          - _id: c2
            name: Grace Hopper
            email: grace@example.com
            company: Globex
            status: trial
            signed_up: '2026-09-20'
          - _id: c3
            name: Alan Turing
            email: alan@example.com
            company: Initech
            status: churned
            signed_up: '2025-06-01'
          - _id: c4
            name: Katherine Johnson
            email: katherine@example.com
            company: Acme
