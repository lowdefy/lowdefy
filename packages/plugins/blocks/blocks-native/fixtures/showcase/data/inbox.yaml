# The Inbox sections. "Needs you" rows lead with the issue's state and end with the person asking;
# "Up next" rows end with when they are due and their priority.
needs_you:
  - key: ACME-142
    title: Grace asked for your review on the sync fix
    glyph: needsInput
    time: 12m
    name: Grace Hopper
    picture: https://i.pravatar.cc/96?img=32
  - key: ACME-144
    title: Alan left a question on board columns
    glyph: inReview
    time: 1h
    name: Alan Turing
    picture: https://i.pravatar.cc/96?img=12
  - key: ACME-155
    title: Katherine mentioned you on status webhooks
    glyph: needsInput
    time: 3h
    name: Katherine Johnson
    picture: https://i.pravatar.cc/96?img=45
up_next:
