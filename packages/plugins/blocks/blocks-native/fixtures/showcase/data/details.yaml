# What the issue page shows below its hero, by issue key: who opened it, the body markdown and the
# activity (events and a comment thread, oldest first). Issues without their own use `default`.
ACME-142:
  opener:
    name: Grace Hopper
    picture: https://i.pravatar.cc/96?img=32
    when: 4 days ago
  estimate: 3
  due: '2026-10-23T00:00:00.000Z'
  body: |
    ## What happens

    Edits made while the phone is offline replay twice once it reconnects, so a comment edited on
    a flight shows up two times. [ACME-118 Queue writes while offline](/ACME/issues/ACME-118)
    added the queue; this makes each replay safe to run again.

    [@Alan Turing](mention:alan) has the server half in
    [ACME-147 Idempotency keys](/ACME/issues/ACME-147).

    ## Plan

    - [x] Give every queued write a client id
    - [x] Drop a replay the server has already seen
    - [ ] Clean up last week's duplicates
    - [ ] Ship behind the `sync.idempotent` flag

    > Repro: flight mode, edit a comment twice, turn flight mode off.
