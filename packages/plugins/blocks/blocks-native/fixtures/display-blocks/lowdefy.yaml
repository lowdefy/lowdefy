# The phase 1 layout and display blocks on one page shared by web and mobile, and Empty (which has
# no web block) and the native controls (pages/controls.yaml) on mobile-only pages. `lowdefy
# build` on this folder builds the shared page for both targets: every type it uses has a web and
# a native version of the same category.
lowdefy: local
name: Display blocks

pages:
  - _ref: pages/shared.yaml

mobile:
  homePageId: shared
  menus:
    tabs:
      - pageId: shared
        title: Blocks
        icon: House
      - pageId: nothing
        title: Empty
      - pageId: controls
        title: Controls
  pages:
    - _ref: pages/shared.yaml
    - _ref: pages/controls.yaml
    - id: nothing
      type: Box
      blocks:
        - id: no_orders
          type: Empty
          properties:
            description: No orders yet
            image: simple
          slots:
            footer:
              blocks:
                - id: create_hint
                  type: Paragraph
                  properties:
                    content: Orders you create show here.
config:
  experimental:
    mobile: true
