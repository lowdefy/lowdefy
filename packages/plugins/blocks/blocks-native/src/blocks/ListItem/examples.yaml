# Mobile only. An iOS list row; put it in a List's content slot, or on its own.

- title: Task row with status, meta, priority and assignee
  blocks:
    - id: task_row
      type: ListItem
      properties:
        title: Sign in with a passkey on iPhone
        subtitle: ACME-644 · Acme for iPhone
        leading:
          status: inProgress
        trailing:
          text: waiting
          textColor: orange
          status: priorityHigh
          avatar:
            name: Pieter van Dam
        swipeActions:
          fullSwipe: leading
          leading:
            - id: done
              title: Done
              icon: CircleCheck
              tone: success
          trailing:
            - id: move
              title: Move
              icon: CircleArrowRight
              tone: neutral
        contextMenu:
          - id: open
            title: Open
            icon: arrow.up.right
          - id: copy_key
            title: Copy key
            icon: doc.on.doc
          - id: assign_me
            title: Assign to me
            icon: person.crop.circle.badge.plus
      events:
        onClick:
          - id: open_task
            type: Link
            params: task
        onSwipeAction:
          - id: set_state
            type: SetState
            params:
              swiped:
                _event: id
        onContextMenu:
          - id: menu_pick
            type: SetState
            params:
              picked:
                _event: id

- title: Design row with stage dot and badges
  blocks:
    - id: design_row
      type: ListItem
      properties:
        title: Acme for iPhone
        subtitle: ACME-645 · discussing · 2d
        leading:
          status:
            name: dot
            color: amber
        trailing:
          badges:
            - icon: CircleHelp
              text: 2
      events:
        onClick:
          - id: open_design
            type: Link
            params: design

- title: Property row with a value
  blocks:
    - id: priority_row
      type: ListItem
      properties:
        title: Priority
        trailing:
          status:
            name: priorityHigh
            label: High
      events:
        onClick:
          - id: pick_priority
            type: CallMethod
            params:
              blockId: priority_menu
              method: open
