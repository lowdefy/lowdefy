# Mobile only.

- title: Initials in a colour picked from the name
  blocks:
    - id: avatar_small
      type: Avatar
      properties:
        name: Pieter van Dam
        size: 20
    - id: avatar_comment
      type: Avatar
      properties:
        name: ada.lovelace@example.com
    - id: avatar_large
      type: Avatar
      properties:
        name: Sam Taylor
        size: 40
        src: https://example.com/sam.png

- title: Stacked assignees
  blocks:
    - id: assignees
      type: Avatar
      properties:
        size: 20
        max: 3
        avatars:
          - name: Pieter van Dam
          - name: Sam Taylor
          - name: Ada Lovelace
          - name: Grace Hopper
