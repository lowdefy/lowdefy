# Mobile only. iOS page control dots.

- title: Position among recents
  blocks:
    - id: recents_dots
      type: PageDots
      properties:
        count: 5
        index: 2

- title: In the theme's primary colour
  blocks:
    - id: steps_dots
      type: PageDots
      properties:
        count: 4
        index:
          _state: step
        color: colorPrimary
