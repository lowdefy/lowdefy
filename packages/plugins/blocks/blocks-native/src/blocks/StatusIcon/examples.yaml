# Mobile only. Linear-style glyphs, coloured for light and dark mode.

- title: Task states
  blocks:
    - id: s_backlog
      type: StatusIcon
      properties:
        name: backlog
    - id: s_todo
      type: StatusIcon
      properties:
        name: todo
    - id: s_in_progress
      type: StatusIcon
      properties:
        name: inProgress
        label: true
    - id: s_in_review
      type: StatusIcon
      properties:
        name: inReview
    - id: s_needs_input
      type: StatusIcon
      properties:
        name: needsInput
    - id: s_unmerged
      type: StatusIcon
      properties:
        name: unmerged
    - id: s_done
      type: StatusIcon
      properties:
        name: done
    - id: s_cancelled
      type: StatusIcon
      properties:
        name: cancelled

- title: Priorities
  blocks:
    - id: p_urgent
      type: StatusIcon
      properties:
        name: priorityUrgent
    - id: p_high
      type: StatusIcon
      properties:
        name: priorityHigh
    - id: p_medium
      type: StatusIcon
      properties:
        name: priorityMedium
    - id: p_low
      type: StatusIcon
      properties:
        name: priorityLow
    - id: p_none
      type: StatusIcon
      properties:
        name: priorityNone

- title: Design stage dots with labels
  blocks:
    - id: stage_discussing
      type: StatusIcon
      properties:
        name: dot
        color: amber
        label: discussing
    - id: stage_settled
      type: StatusIcon
      properties:
        name: dot
        color: teal
        label: settled
    - id: stage_rejected
      type: StatusIcon
      properties:
        name: dot
        color: red
        label: rejected
