- title: A container
  blocks:
    - id: panel
      type: Box
      style:
        element:
          padding: 16
      blocks:
        - id: panel_title
          type: Title
          properties:
            content: Inside a Box

# Mobile only: onSwipeLeft and onSwipeRight. A card of the record shown, swiped left for the next
# recent record and right for the one before, with page dots for its place among them. The Box
# takes only clear horizontal swipes, so the page still scrolls, and leaves swipes from the
# screen's left edge to the back gesture. swipeFeedback moves it a little with the finger.
- title: Swipe through recents
  blocks:
    - id: recent_card
      type: Box
      properties:
        swipeFeedback: true
      events:
        onSwipeLeft:
          - id: next
            type: SetState
            skip:
              _gte:
                - _state: recent_index
                - 4
            params:
              recent_index:
                _sum:
                  - _state: recent_index
                  - 1
        onSwipeRight:
          - id: previous
            type: SetState
            skip:
              _lte:
                - _state: recent_index
                - 0
            params:
              recent_index:
                _sum:
                  - _state: recent_index
                  - -1
      blocks:
        - id: recent_title
          type: Title
          properties:
            content:
              _state: recent_title
    - id: recent_dots
      type: PageDots
      properties:
        count: 5
        index:
          _state: recent_index
