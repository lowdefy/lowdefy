id: upload
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: upload_basic
    type: Upload
    properties:
      uploadPolicyRequestId: upload_policy_request

  - id: upload_custom_button
    type: Upload
    properties:
      uploadPolicyRequestId: upload_policy_request
      button:
        title: Choose File
        type: primary

  # ============================================
  # PROPERTY TESTS
  # ============================================

  - id: upload_disabled
    type: Upload
    properties:
      uploadPolicyRequestId: upload_policy_request
      disabled: true

  - id: upload_accept
    type: Upload
    properties:
      uploadPolicyRequestId: upload_policy_request
      accept: '.pdf'

  # ============================================
  # EMIT FILE CONTENT
  # ============================================

  - id: upload_emit
    type: Upload
    properties:
      emitFileContent: true
      singleFile: true
    events:
      onChange:
        - id: set_emitted_file
          type: SetState
          params:
            emitted_file:
              _event: file

  - id: emit_name_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: emitted_file.name
              - null
          then:
            _string.concat:
              - 'Name: '
              - _state: emitted_file.name
          else: ''

  - id: emit_content_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: emitted_file.content
              - null
          then:
            _string.concat:
              - 'Content: '
              - _state: emitted_file.content
          else: ''

  - id: emit_type_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: emitted_file.type
              - null
          then:
            _string.concat:
              - 'Type: '
              - _state: emitted_file.type
          else: ''
