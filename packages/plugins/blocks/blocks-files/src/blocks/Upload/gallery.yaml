- title: Basic
  blocks:
    - id: basic_default
      type: Upload
      properties:
        uploadPolicyRequestId: upload_policy_request
    - id: basic_custom_title
      type: Upload
      properties:
        uploadPolicyRequestId: upload_policy_request
        button:
          icon: UploadOutlined
          title: Choose File
          type: default
    - id: basic_custom_icon
      type: Upload
      properties:
        uploadPolicyRequestId: upload_policy_request
        button:
          icon: AiOutlineCloudUpload
          title: Upload to Cloud
          type: default

- title: File Type Restrictions
  blocks:
    - id: accept_images
      type: Upload
      properties:
        uploadPolicyRequestId: upload_policy_request
        accept: 'image/*'
        button:
          icon: AiOutlinePicture
          title: Upload Image
          type: default
    - id: accept_pdf
      type: Upload
      properties:
        uploadPolicyRequestId: upload_policy_request
        accept: '.pdf'
        button:
          icon: AiOutlineFilePdf
          title: Upload PDF
          type: default

- title: Upload Limits
  blocks:
    - id: limit_single
      type: Upload
      properties:
        uploadPolicyRequestId: upload_policy_request
        singleFile: true
        button:
          icon: UploadOutlined
          title: Upload Single File
          type: default
    - id: limit_max_three
      type: Upload
      properties:
        uploadPolicyRequestId: upload_policy_request
        maxCount: 3
        button:
          icon: UploadOutlined
          title: Upload (Max 3)
          type: default

- title: Emit File Content
  blocks:
    - id: emit_file_content
      type: Upload
      properties:
        emitFileContent: true
        singleFile: true
        button:
          icon: UploadOutlined
          title: Attach File
          type: default

- title: Disabled State
  blocks:
    - id: disabled_default
      type: Upload
      properties:
        uploadPolicyRequestId: upload_policy_request
        disabled: true

- title: Label Options
  blocks:
    - id: label_default
      type: Upload
      properties:
        title: Upload Attachment
        uploadPolicyRequestId: upload_policy_request
    - id: label_extra
      type: Upload
      properties:
        title: Upload Document
        uploadPolicyRequestId: upload_policy_request
        label:
          extra: Accepted formats are PDF, DOCX, and PNG. Max size 10MB.
