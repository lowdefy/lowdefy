id: download
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: download_basic
    type: Download
    properties:
      downloadPolicyRequestId: download_policy_request
      fileList:
        - key: reports/report.pdf
          name: report.pdf
          size: 1024
          type: application/pdf
        - key: reports/summary.xlsx
          name: summary.xlsx
          size: 2048

  - id: download_empty
    type: Download
    properties:
      downloadPolicyRequestId: download_policy_request

  # ============================================
  # REMOVE ICON + EVENT
  # ============================================

  - id: download_remove
    type: Download
    properties:
      downloadPolicyRequestId: download_policy_request
      showRemoveIcon: true
      fileList:
        - key: reports/removable.pdf
          name: removable.pdf
    events:
      onRemove:
        - id: set_removed_file
          type: SetState
          params:
            removed_file:
              _event: file.name

  - id: remove_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: removed_file
              - null
          then:
            _string.concat:
              - 'Removed: '
              - _state: removed_file
          else: ''
