- title: Basic
  blocks:
    - id: basic_default
      type: Download
      properties:
        downloadPolicyRequestId: download_policy_request
        fileList:
          - key: reports/report.pdf
            name: report.pdf
            size: 1024
            type: application/pdf

- title: Removable Files
  blocks:
    - id: removable
      type: Download
      properties:
        downloadPolicyRequestId: download_policy_request
        showRemoveIcon: true
        fileList:
          - key: reports/report.pdf
            name: report.pdf
          - key: reports/summary.xlsx
            name: summary.xlsx
