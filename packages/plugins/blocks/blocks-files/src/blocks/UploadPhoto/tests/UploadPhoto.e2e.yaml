id: uploadphoto
type: Box

blocks:
  # ============================================
  # BASIC RENDERING
  # ============================================

  - id: uploadphoto_basic
    type: UploadPhoto
    properties:
      uploadPolicyRequestId: upload_policy_request

  - id: uploadphoto_custom_title
    type: UploadPhoto
    properties:
      uploadPolicyRequestId: upload_policy_request
      title: Add Photo

  # ============================================
  # PROPERTY TESTS
  # ============================================

  - id: uploadphoto_disabled
    type: UploadPhoto
    properties:
      uploadPolicyRequestId: upload_policy_request
      disabled: true

  # ============================================
  # EMIT FILE CONTENT
  # ============================================

  - id: uploadphoto_emit
    type: UploadPhoto
    properties:
      emitFileContent: true
      singleFile: true
    events:
      onChange:
        - id: set_emitted_photo
          type: SetState
          params:
            emitted_photo:
              _event: file

  - id: emit_photo_display
    type: Span
    properties:
      content:
        _if:
          test:
            _ne:
              - _state: emitted_photo.name
              - null
          then:
            _string.concat:
              - 'Name: '
              - _state: emitted_photo.name
          else: ''
