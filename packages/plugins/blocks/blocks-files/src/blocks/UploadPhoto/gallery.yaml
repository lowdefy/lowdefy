- title: Basic
  blocks:
    - id: basic_default
      type: UploadPhoto
      properties:
        uploadPolicyRequestId: upload_policy_request
    - id: basic_custom_title
      type: UploadPhoto
      properties:
        uploadPolicyRequestId: upload_policy_request
        title: Add Photo

- title: Upload Limits
  blocks:
    - id: limit_single
      type: UploadPhoto
      properties:
        uploadPolicyRequestId: upload_policy_request
        singleFile: true
    - id: limit_max_three
      type: UploadPhoto
      properties:
        uploadPolicyRequestId: upload_policy_request
        maxCount: 3

- title: Emit File Content
  blocks:
    - id: emit_file_content
      type: UploadPhoto
      properties:
        emitFileContent: true
        singleFile: true

- title: Disabled State
  blocks:
    - id: disabled_default
      type: UploadPhoto
      properties:
        uploadPolicyRequestId: upload_policy_request
        disabled: true
