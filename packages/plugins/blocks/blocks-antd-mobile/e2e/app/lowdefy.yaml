lowdefy: local
name: blocks-antd-mobile E2E Tests

# Registering the package as a plugin adds its types to the web map, so the
# per-block pages render in the standard block-dev-e2e web harness (with a
# mobile device profile in playwright.config.js). The full mobile client
# runtime is covered separately by the mobile-client verification app.
plugins:
  - name: '@lowdefy/blocks-antd-mobile'
    version: '5.3.0'

menus:
  - id: default
    links:
      - id: tabbar
        type: MenuLink
        pageId: tabbar
        properties:
          title: Tabs
      - id: button
        type: MenuLink
        pageId: button
        properties:
          title: Buttons

pages:
  - _ref: ../../src/blocks/Button/tests/Button.e2e.yaml
  - _ref: ../../src/blocks/Card/tests/Card.e2e.yaml
  - _ref: ../../src/blocks/DateSelector/tests/DateSelector.e2e.yaml
  - _ref: ../../src/blocks/List/tests/List.e2e.yaml
  - _ref: ../../src/blocks/NavBar/tests/NavBar.e2e.yaml
  - _ref: ../../src/blocks/Selector/tests/Selector.e2e.yaml
  - _ref: ../../src/blocks/Switch/tests/Switch.e2e.yaml
  - _ref: ../../src/blocks/TabBar/tests/TabBar.e2e.yaml
  - _ref: ../../src/blocks/TextArea/tests/TextArea.e2e.yaml
  - _ref: ../../src/blocks/TextInput/tests/TextInput.e2e.yaml
