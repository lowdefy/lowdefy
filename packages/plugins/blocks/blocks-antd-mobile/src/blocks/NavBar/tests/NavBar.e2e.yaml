id: navbar
type: Box

blocks:
  - id: navbar_basic
    type: NavBar
    properties:
      title: Page Title
    events:
      onBack:
        - id: set_back
          type: SetState
          params:
            back_clicked: true

  - id: navbar_no_back
    type: NavBar
    properties:
      title: No Back
      back: false

  - id: back_display
    type: Html
    properties:
      html:
        _if:
          test:
            _eq:
              - _state: back_clicked
              - true
          then: 'back clicked'
          else: 'not clicked'
