id: list
type: Box

events:
  onInit:
    - id: init_tasks
      type: SetState
      params:
        task_list:
          - title: First task
          - title: Second task
          - title: Third task

blocks:
  - id: task_list
    type: List
    properties:
      header: Tasks
    events:
      onItemClick:
        - id: set_clicked_index
          type: SetState
          params:
            clicked_index:
              _event: index
    blocks:
      - id: task_list.$.title
        type: Html
        properties:
          html:
            _state: task_list.$.title

  - id: clicked_display
    type: Html
    properties:
      html:
        _if_none:
          - _state: clicked_index
          - 'none'
