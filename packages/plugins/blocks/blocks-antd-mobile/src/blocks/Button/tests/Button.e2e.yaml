id: button
type: Box

blocks:
  - id: button_basic
    type: Button
    properties:
      title: Basic Button

  - id: button_success
    type: Button
    properties:
      title: Success
      color: success

  - id: button_danger
    type: Button
    properties:
      title: Danger
      color: danger

  - id: button_disabled
    type: Button
    properties:
      title: Disabled
      disabled: true

  - id: button_block
    type: Button
    properties:
      title: Block Button
      block: true

  - id: button_click
    type: Button
    properties:
      title: Click Me
    events:
      onClick:
        - id: set_clicked
          type: SetState
          params:
            clicked: true

  - id: clicked_result
    type: Html
    properties:
      html:
        _if:
          test:
            _eq:
              - _state: clicked
              - true
          then: 'clicked'
          else: 'not clicked'
