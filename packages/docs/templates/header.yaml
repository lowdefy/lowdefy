- id: search_box
  type: Box
  layout:
    flex: 0 1 auto
    selfAlign: middle
  style:
    marginRight: 8
  blocks:
    - id: docsearch
      type: Search
      layout:
        flex: 0 1 auto
        selfAlign: middle
      properties:
        indexUrl: /search-index.json
        placeholder: Search docs...
        shortcut: mod+k
        label: Search
        icon: AiOutlineSearch
        showShortcut: true
        maxResults: 15
        highlightMatches: true
        recentSearches: true
        recentSearchesCount: 5
      events:
        onSelect:
          - id: navigate
            type: Link
            params:
              pageId:
                _event: pageId
# The active tab value (state.tab_selector) is seeded per page by an onInit
# SetState injected by the build-time menu transformer in generateSiteAssets.js.
- id: tab_selector
  type: SegmentedSelector
  visible:
    _not:
      _or:
        - _eq:
            - _media: size
            - sm
        - _eq:
            - _media: size
            - xs
  layout:
    flex: 0 1 auto
    selfAlign: middle
  properties:
    size: small
    label:
      disabled: true
    options:
      - label: Learn
        value: learn
      - label: Reference
        value: reference
      - label: Recipes
        value: recipes
      - label: Plugins
        value: plugins
  events:
    onChange:
      - id: tab_link
        type: Link
        params:
          pageId:
            _get:
              from:
                learn: introduction
                reference: reference
                recipes: recipes
                plugins: plugins
              key:
                _state: tab_selector
- id: mobile_tab_menu
  type: DropdownMenu
  visible:
    _or:
      - _eq:
          - _media: size
          - sm
      - _eq:
          - _media: size
          - xs
  layout:
    flex: 0 1 auto
    selfAlign: middle
  properties:
    title:
      _get:
        from:
          learn: Learn
          reference: Reference
          recipes: Recipes
          plugins: Plugins
        key:
          _state: tab_selector
    links:
      - id: mobile_tab_learn
        type: MenuLink
        pageId: introduction
        properties:
          title: Learn
      - id: mobile_tab_reference
        type: MenuLink
        pageId: reference
        properties:
          title: Reference
      - id: mobile_tab_recipes
        type: MenuLink
        pageId: recipes
        properties:
          title: Recipes
      - id: mobile_tab_plugins
        type: MenuLink
        pageId: plugins
        properties:
          title: Plugins
- id: header_spacer
  type: Box
  layout:
    flex: 1 0 auto
- id: discord_button
  type: Button
  visible:
    _not:
      _or:
        - _eq:
            - _media: size
            - sm
        - _eq:
            - _media: size
            - xs
  layout:
    flex: 0 1 auto
    selfAlign: middle
  properties:
    color: default
    variant: text
    shape: circle
    icon: FaDiscord
    href: https://discord.gg/WmcJgXt
- id: github_button
  type: Button
  visible:
    _not:
      _or:
        - _eq:
            - _media: size
            - sm
        - _eq:
            - _media: size
            - xs
  layout:
    flex: 0 1 auto
    selfAlign: middle
  properties:
    color: default
    variant: text
    shape: circle
    icon: AiFillGithub
    href: https://github.com/lowdefy/lowdefy
