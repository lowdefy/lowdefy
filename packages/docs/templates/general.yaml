id:
  _var: pageId
type: Box
events:
  onInit:
    - id: set_session_id
      type: SetGlobal
      skip:
        _not:
          _eq:
            - _global: session_id
            - null
      params:
        session_id:
          _random:
            type: string
            length: 16
properties:
  title:
    _var: pageTitle
blocks:
  - id:
      _build.string.concat:
        - _var: pageId
        - _page
    type: PageSiderMenu
    properties:
      title:
        _var: pageTitle
      darkModeToggle: true
      menu:
        forceSubMenuRender: true
      sider:
        width: 256px
        initialCollapsed:
          _or:
            - _eq:
                - _media: size
                - md
            - _eq:
                - _media: size
                - lg
      breadcrumb:
        list:
          _build.array.compact:
            - _ref: version.yaml
            - _build.if:
                test:
                  _build.boolean:
                    _var: section
                then:
                  _var: section
            - _build.if:
                test:
                  _build.boolean:
                    _var: section
                then:
                  _var: pageTitle

    style:
      .layout:
        background: var(--ant-color-bg-container)
      .footer:
        background: var(--ant-color-bg-container)
        padding: 16px 0px 0px 0px

    slots:
      header:
        blocks:
          _ref: templates/header.yaml
      footer:
        blocks:
          _ref:
            path: templates/footer.yaml
            vars:
              hideFeedback:
                _var: hideFeedback
              filePath:
                _var: filePath
              pageId:
                _var: pageId

      content:
        justify: center
        blocks:
          - id: max_width
            type: Box
            layout:
              _build.if:
                test:
                  _build.boolean:
                    _var: fullWidth
                then:
                  flex: 1 1 auto
                else:
                  flex: 0 1 800px
            style:
              minWidth: 0
              overflow: hidden
            blocks:
              _build.array.compact:
                - _build.if:
                    test:
                      _build.boolean:
                        _var: pageTitle
                    then:
                      id: page_title
                      type: Title
                      properties:
                        content:
                          _var: pageTitle
                - id: content
                  type: Box
                  layout:
                    gap: 16
                  blocks:
                    _var: content
