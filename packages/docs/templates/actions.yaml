_ref:
  path: templates/general.yaml
  vars:
    pageId:
      _var: pageId
    pageTitle:
      _var: pageTitle
    section: Actions
    content:
      _build.array.compact:
        - id: types
          type: Markdown
          style:
            fontSize: 14px
          properties:
            content:
              _var: types
        - id: description
          type: MarkdownWithCode
          properties:
            content:
              _var: description
        - _build.if:
            test:
              _build.boolean:
                _var: params
            then:
              id: params_title
              type: Markdown
              properties:
                content: '#### Parameters'
        - _build.if:
            test:
              _build.boolean:
                _var: params
            then:
              id: params
              type: MarkdownWithCode
              properties:
                content:
                  _var: params
        - _build.if:
            test:
              _build.boolean:
                _var: response
            then:
              id: params_title
              type: Markdown
              properties:
                content: '#### Response'
        - _build.if:
            test:
              _build.boolean:
                _var: response
            then:
              id: response
              type: MarkdownWithCode
              properties:
                content:
                  _var: response
        - _build.if:
            test:
              _build.boolean:
                _var: examples
            then:
              id: examples_title
              type: Markdown
              properties:
                content: '#### Examples'
        - _build.if:
            test:
              _build.boolean:
                _var: examples
            then:
              id: examples
              type: MarkdownWithCode
              properties:
                content:
                  _var: examples
