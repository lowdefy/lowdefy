id:
  _build.string.concat:
    - command_box_
    - _var: id
type: Box
style:
  backgroundColor: var(--ant-color-bg-layout)
  borderColor: var(--ant-color-border-secondary)
  borderStyle: solid
  borderWidth: 1px

blocks:
  - id:
      _build.string.concat:
        - command_run_
        - _var: id
    type: Paragraph
    layout:
      flex: 0 1 auto
    style:
      marginRight: 6px
      marginLeft: 16px
      marginTop: 16px
    properties:
      content: '$'
  - id:
      _build.string.concat:
        - command_
        - _var: id
    type: Paragraph
    layout:
      flex: 0 1 auto
    # style:
      # backgroundColor: '#ffffff'
    properties:
      style:
        marginTop: 16px
      code: true
      copyable:
        icon: AiOutlineCopy
        tooltips:
          - Click to copy
          - Copied. Paste in console to run 🚀
      content:
        _var: command
