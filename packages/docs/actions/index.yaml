_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: actions-reference
    pageTitle: Actions
    filePath: actions/index.yaml
    content:
      - id: intro
        type: Markdown
        properties:
          content: |
            Actions run in response to events — a button click, a page load, an input change. All 24 actions, grouped by purpose. See [Events and Actions](/events-and-actions) for how event chains work.
      - id: section_state_validation_title
        type: Title
        properties:
          content: State & validation
          level: 3
      - id: section_state_validation_tagline
        type: Paragraph
        style:
          color: var(--ant-color-text-secondary)
        properties:
          content: Write state and validate user input.
      - id: section_state_validation_grid
        type: Flex
        layout:
          gap: 12
        properties:
          wrap: wrap
        blocks:
          - id: card_setstate
            type: Card
            layout:
              flex: 0 1 auto
            style:
              cursor: pointer
            properties:
              size: small
            events:
              onClick:
                - id: link_setstate
                  type: Link
                  params:
                    pageId: SetState
            blocks:
              - id: card_setstate_label
                type: Html
                properties:
                  html: '<b>SetState</b>'
          - id: card_setglobal
