_ref:
  path: templates/actions.yaml.njk
  vars:
    pageId: DownloadFile
    pageTitle: DownloadFile
    filePath: actions/DownloadFile.yaml
    types: |
      ```
      ({ content: string, name: string, type?: string }): void
      ```
    description: |
      The `DownloadFile` action saves a file envelope to the browser as a download. A file envelope is the object shape `{ name, size, type, content }` that requests such as [`RenderReport`](/Reports) and `AwsS3GetObject` return, with `content` holding the file bytes as a base64 string.

      The action is provided by the `@lowdefy/plugin-reports` plugin.
    params: |
      - `content: string`: __Required__ - The file bytes, base64 encoded.
      - `name: string`: __Required__ - The filename to save as.
      - `type: string`: The content type of the file. Defaults to `application/octet-stream`.
    examples: |
      ###### Render a report and download it:
      ```yaml
      id: download_report
      type: Button
      properties:
        title: Download PDF
      events:
        onClick:
          - id: render
            type: Request
            params: render_pdf
          - id: save
            type: DownloadFile
            params:
              _request: render_pdf
      ```

      ###### Download with an explicit filename:
      ```yaml
      - id: save
        type: DownloadFile
        params:
          name: quarterly-report.pdf
          type:
            _request: render_pdf.type
          content:
            _request: render_pdf.content
      ```
