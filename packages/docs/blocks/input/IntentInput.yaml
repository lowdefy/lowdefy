    description: >
      A text input that becomes the card for what the user means. The user types in their own
      words, a classifier (typically a `Decide` request) picks the intent, and the box grows into
      that intent's card: a faded preview while unsure, a choice between two intents when they are
      close, and the solid card when sure. Each card is a slot of ordinary blocks.
