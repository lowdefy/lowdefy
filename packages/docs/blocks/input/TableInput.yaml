  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: TableInput
    pageTitle: TableInput
    section: Input Blocks
    filePath: blocks/input/TableInput.yaml
    block_type: TableInput
    fullWidthExamples: true
    github_path: packages/plugins/blocks/blocks-table/src/blocks/TableInput
    schema: ../plugins/blocks/blocks-table/src/blocks/TableInput/meta.js
    gallery: ../plugins/blocks/blocks-table/src/blocks/TableInput/gallery.yaml
    description: >
      The Table for editing a list of rows in a form, such as the line items of an invoice or the
      ingredients of a recipe. Rows come from `data` and are never written: the block value is the
      changes made to them, `{ updated, added, removed, moved?, order? }`, which a
      `MongoDBTableChanges` request saves in one bulk write. It has every Table property, plus
      "+ Add row", row deletion, undo and redo, and paste from a spreadsheet.
    guide:
      _ref: blocks/input/TableInputGuide.md
