_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: UploadDragger
    pageTitle: UploadDragger
    section: Input Blocks
    filePath: blocks/input/UploadDragger.yaml
    block_type: UploadDragger
    antd_component: Upload
    antd_url: upload
    github_path: packages/plugins/blocks/blocks-files/src/blocks/UploadDragger
    schema: ../plugins/blocks/blocks-files/src/blocks/UploadDragger/meta.js
    gallery: ../plugins/blocks/blocks-files/src/blocks/UploadDragger/gallery.yaml
    note: >
      The UploadDragger block requires an upload-policy request (AwsS3PresignedPostPolicy, GcsSignedPostPolicy,
      or AzureBlobUploadSas) referenced by uploadPolicyRequestId, unless emitFileContent is true.
      The examples on this page demonstrate UI configuration only — uploads will not function without a configured storage connection.
    description: >
      Upload files to any storage provider with a drag-and-drop (and paste) area — AWS S3 (and S3-compatible
      services), Google Cloud Storage, or Azure Blob Storage. The block calls an upload-policy request by id
      (`uploadPolicyRequestId`) and uploads directly from the browser. Set `emitFileContent: true` to instead
      emit the file as a base64 payload for server-side storage through an API endpoint routine.
