_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: PlacesAutocomplete
    pageTitle: PlacesAutocomplete
    section: Input Blocks
    filePath: blocks/input/PlacesAutocomplete.yaml
    block_type: PlacesAutocomplete
    antd_component: AutoComplete
    antd_url: auto-complete
    github_path: packages/plugins/blocks/blocks-google-maps/src/blocks/PlacesAutocomplete
    schema: ../plugins/blocks/blocks-google-maps/src/blocks/PlacesAutocomplete/meta.js
    gallery: ../plugins/blocks/blocks-google-maps/src/blocks/PlacesAutocomplete/gallery.yaml
    wrapperType: GoogleMapsScript
    wrapperProperties:
      apiKey:
        _build.env: GOOGLE_MAPS_API_KEY
      libraries:
        - places
    note: >
      The PlacesAutocomplete block must be wrapped in a GoogleMapsScript block that loads
      the places library, `libraries: [places]`, with a valid Google Maps API key that has the
      Places API (New) enabled. Without the places library the block renders as a plain text input
      that still writes the label field. The examples on this page require a configured API key to
      return suggestions.
    description: >
      Address input with place suggestions from the Google Places Autocomplete Data API.
      Must be wrapped in a `GoogleMapsScript` block loading the places library. The block value
      is an object: selecting a suggestion fetches the configured place fields, renames them
      through `resultMapping` and merges them into the value, while typing writes the free text
      to `labelField` so a form always holds a usable address.
