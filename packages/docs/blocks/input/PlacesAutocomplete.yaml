_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: PlacesAutocomplete
    pageTitle: PlacesAutocomplete
    section: Input Blocks
    filePath: blocks/input/PlacesAutocomplete.yaml
    block_type: PlacesAutocomplete
    antd_component: AutoComplete
    antd_url: auto-complete
    github_path: packages/plugins/blocks/blocks-google-maps/src/blocks/PlacesAutocomplete
    schema: ../plugins/blocks/blocks-google-maps/src/blocks/PlacesAutocomplete/meta.js
    gallery: ../plugins/blocks/blocks-google-maps/src/blocks/PlacesAutocomplete/gallery.yaml
    wrapperType: GoogleMapsScript
    wrapperProperties:
      apiKey:
        _build.env: GOOGLE_MAPS_API_KEY
      libraries:
        - places
    note: >
      The PlacesAutocomplete block must be wrapped in a GoogleMapsScript block, with a valid Google
      Maps API key that has the Places API (New) enabled. Load the places library on the script,
      `libraries: [places]`, so it is ready on first render; when it is not listed the block imports
      it on demand through `google.maps.importLibrary`. Outside a GoogleMapsScript, or when the
      places library cannot be loaded, the block is a plain text input that still writes the label
      field. Suggestions are requested `debounce` milliseconds (default 250) after the last
      keystroke. The examples on this page require a configured API key to return suggestions.
    description: >
      Address input with place suggestions from the Google Places Autocomplete Data API.
      Must be wrapped in a `GoogleMapsScript` block. The block value is an object: selecting a
      suggestion fetches the configured place fields, renames them through `resultMapping` and
      writes them to the value, while typing writes the free text to `labelField` so a form always
      holds a usable address. Typing, selecting or clearing first removes the keys the previous place
      wrote, so typed text never keeps another place's coordinates; sibling keys written by other
      blocks are preserved, and the value becomes null when none remain. `onPlaceChanged` receives
      the mapped place, `onChange` the new value, and `onError` fires when the Places API request
      fails.
