_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: Upload
    pageTitle: Upload
    section: Input Blocks
    filePath: blocks/input/Upload.yaml
    block_type: Upload
    antd_component: Upload
    antd_url: upload
    github_path: packages/plugins/blocks/blocks-files/src/blocks/Upload
    schema: ../plugins/blocks/blocks-files/src/blocks/Upload/meta.js
    gallery: ../plugins/blocks/blocks-files/src/blocks/Upload/gallery.yaml
    note: >
      The Upload block requires an upload-policy request (AwsS3PresignedPostPolicy, GcsSignedPostPolicy,
      or AzureBlobUploadSas) referenced by uploadPolicyRequestId, unless emitFileContent is true.
      The examples on this page demonstrate UI configuration only — uploads will not function without a configured storage connection.
    description: >
      Upload files to any storage provider with a button trigger — AWS S3 (and S3-compatible services like
      Cloudflare R2 and MinIO), Google Cloud Storage, or Azure Blob Storage. The block calls an upload-policy
      request by id (`uploadPolicyRequestId`) and uploads the file directly from the browser to the provider.
      Set `emitFileContent: true` to instead emit the file as `{ name, size, type, content }` (base64) for
      server-side storage through an API endpoint routine. Supports file type filtering, upload limits, and
      custom button styling.
