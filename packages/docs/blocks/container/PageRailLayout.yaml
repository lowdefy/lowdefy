_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: PageRailLayout
    pageTitle: PageRailLayout
    section: Container Blocks
    filePath: blocks/container/PageRailLayout.yaml
    block_type: PageRailLayout
    antd_component: Layout
    antd_url: layout
    github_path: packages/plugins/blocks/blocks-antd/src/blocks/PageRailLayout
    schema: ../plugins/blocks/blocks-antd/src/blocks/PageRailLayout/meta.js
    gallery: ../plugins/blocks/blocks-antd/src/blocks/PageRailLayout/gallery.yaml
    fullWidthExamples: true
    description: >
      Full-page layout for apps whose places each have their own menu or list. A slim rail of
      labelled places never expands, with badges and a foot for search, the assistant,
      notifications and the profile. Beside it, a `panel` slot holds the page's own menu or list,
      and its edge can be dragged between `panel.minWidth` and `panel.maxWidth`; the width is
      remembered in the browser and shared by every page, so the content does not jump between
      places. The content has an optional header and a docked `aside` on the right. Below
      `panel.drawerBreakpoint` (1100px) the panel becomes a drawer over the content, and below
      `mobileBreakpoint` (768px) the rail becomes a bottom tab bar with More. The rail is
      themed with CSS variables, each with an antd token as its default, set on `:root` or any
      parent of the block: `--lf-rail-width`, `--lf-rail-bg`, `--lf-rail-fg`,
      `--lf-rail-fg-active`, `--lf-rail-item-hover-bg`, `--lf-rail-item-active-bg`,
      `--lf-rail-item-radius`, `--lf-rail-icon-size`, `--lf-rail-label-size`,
      `--lf-rail-badge-bg`, `--lf-rail-badge-error-bg`, `--lf-rail-panel-bg`,
      `--lf-rail-panel-border`, `--lf-rail-content-bg`, `--lf-rail-header-height`,
      `--lf-rail-handle-color` and `--lf-rail-tab-bar-height`.
