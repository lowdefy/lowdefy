  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: DangerousHtml
    pageTitle: DangerousHtml
    section: Display Blocks
    filePath: blocks/display/DangerousHtml.yaml
    block_type: DangerousHtml
    github_path: packages/plugins/blocks/blocks-basic/src/blocks/DangerousHtml
    schema: ../plugins/blocks/blocks-basic/src/blocks/DangerousHtml/meta.js
    gallery: ../plugins/blocks/blocks-basic/src/blocks/DangerousHtml/gallery.yaml
    description: >
      Render raw HTML content without sanitization. Never pass caller-supplied or database HTML
