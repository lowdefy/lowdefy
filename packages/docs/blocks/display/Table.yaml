_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: Table
    pageTitle: Table
    section: Display Blocks
    filePath: blocks/display/Table.yaml
    block_type: Table
    fullWidthExamples: true
    github_path: packages/plugins/blocks/blocks-table/src/blocks/Table
    schema: ../plugins/blocks/blocks-table/src/blocks/Table/meta.js
    gallery: ../plugins/blocks/blocks-table/src/blocks/Table/gallery.yaml
    description: >
      A virtualised, keyboard-accessible data table for record lists, reports, pickers, trees and
      queues: typed cells, sorting, column filters, search, resizing, reordering, pinning, grouping
      with aggregates, row selection with bulk actions, inline editing, saved views and server-side
      data in blocks through `MongoDBTableQuery`. Its value is its UI state, `{ view, selected,
      expanded }`, so `_state: <id>.selected` is the selection and `_state: <id>.view` the current
      view. Every TableLight config is a valid Table config, and the AgGrid blocks remain
      supported alongside it.
    guide:
      _ref: blocks/display/TableGuide.md
