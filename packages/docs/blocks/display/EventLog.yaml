_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: EventLog
    pageTitle: EventLog
    section: Display Blocks
    filePath: blocks/display/EventLog.yaml
    block_type: EventLog
    github_path: packages/plugins/blocks/blocks-antd/src/blocks/EventLog
    schema: ../plugins/blocks/blocks-antd/src/blocks/EventLog/meta.js
    gallery: ../plugins/blocks/blocks-antd/src/blocks/EventLog/gallery.yaml
    description: >
      A dense, virtualised log viewer for any array of records - audit trails, job runs, deploys,
      webhook deliveries or application events. Rows are searchable, filtered by severity and
      expandable to a detail pane with the actor, a rich detail body and a flattened context
      key-value table that can be copied as JSON.


      The block does not assume a record shape: the `fields` property maps dot paths onto each
      record, and `eventTypeConfig` maps an event type onto its label, icon, colour and severity.
      Severity is explicit - it is read from the `level` field of a record, or from the `level` of
      its type config, and is one of `error`, `warning`, `success` or `info` (default `info`).


      Large logs can be pushed straight into the block with the `setData` method using a CallMethod
      action, so the records never round-trip through the operator pipeline. Every string rendered
      by the block is set on the `text` property, so the log can be translated.
