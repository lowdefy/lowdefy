_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: TableLight
    pageTitle: TableLight
    section: Display Blocks
    filePath: blocks/display/TableLight.yaml
    block_type: TableLight
    antd_component: Table
    antd_url: table
    github_path: packages/plugins/blocks/blocks-antd/src/blocks/TableLight
    schema: ../plugins/blocks/blocks-antd/src/blocks/TableLight/meta.js
    gallery: ../plugins/blocks/blocks-antd/src/blocks/TableLight/gallery.yaml
    description: >
      A light table for the odd table on a page: a few columns and tens to hundreds of rows, with
      typed cells (numbers, dates, tags, people, links and more), sorting by header click, row
      links, row buttons and menus, conditional formatting and a summary row. It renders the Ant
      Design Table and adds no dependencies. Its config is a subset of the Table block's, so a
      table that outgrows it changes `type: TableLight` to `type: Table`.
    guide:
      _ref: blocks/display/TableLightGuide.md
