_ref:
  path: templates/blocks/gallery.yaml.njk
  vars:
    pageId: PollingTimer
    pageTitle: PollingTimer
    section: Display Blocks
    filePath: blocks/display/PollingTimer.yaml
    block_type: PollingTimer
    github_path: packages/plugins/blocks/blocks-basic/src/blocks/PollingTimer
    schema: ../plugins/blocks/blocks-basic/src/blocks/PollingTimer/meta.js
    gallery: ../plugins/blocks/blocks-basic/src/blocks/PollingTimer/gallery.yaml
    description: >
      A headless timer that renders nothing and triggers its `onTick` event every
      `interval` milliseconds while it is running. Use it to poll a request until a
      background job completes, or to refresh a page on a schedule. Start and stop it
      with the `start`, `stop` and `toggle` methods, or set `autoStart` to start it on
      mount. The timer always stops when the block unmounts.
