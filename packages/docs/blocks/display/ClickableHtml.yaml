    schema: ../plugins/blocks/blocks-basic/src/blocks/ClickableHtml/meta.js
    gallery: ../plugins/blocks/blocks-basic/src/blocks/ClickableHtml/gallery.yaml
    description: >
      Render raw HTML content safely, and fire the onClick event when an element carrying a `data-action` attribute is clicked. The event object holds that element's `data-*` attributes with snake_case keys (`data-event-id` becomes `event_id`), so one block of markup can carry many clickable targets without a block per button.
