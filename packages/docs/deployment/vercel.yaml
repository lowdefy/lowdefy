_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: vercel
    pageTitle: Deploy with Vercel
    section: Deployment
    filePath: deployment/vercel.yaml
    content:
      - id: content
        type: Markdown
        properties:
          content: |
            A Lowdefy app builds a [Hono](https://hono.dev) server serving a Vite-built React client. On Vercel it runs as **static assets on the CDN plus one Serverless Function** that runs the Hono app for every dynamic request (page rendering, `/api/*` requests, endpoints, auth and agents).

            Run the `init-vercel` CLI command in your project to scaffold everything into a `deploy/` directory next to your `lowdefy.yaml`:

            ```bash
            npx lowdefy@latest init-vercel
            ```

            This creates:

            - `deploy/vercel.install.sh` — the install command; downloads the Lowdefy server into `deploy/` (skipping the client build, which Vercel runs as the build step).
            - `deploy/vercel.json` — serves the built client (`dist/client`) from the CDN and rewrites every other request to the function. It also sets the build command (`pnpm run build:client`) and output directory (`dist/client`).
            - `deploy/api/index.js` — the Serverless Function; wraps the Lowdefy Hono app with `hono/vercel`.
            - `deploy/README.md` — these instructions.

            All four files are safe to commit.

            ###### Project settings

            In the Vercel project:

            - **Framework Preset:** `Other` (Lowdefy is not a Next.js app).
            - **Root Directory:** `<config-directory>/deploy`
                - `<config-directory>` is the directory in which the `lowdefy.yaml` file is placed.
                - Eg: if `lowdefy.yaml` is at the top level of the repository, set the root directory to `deploy`; if it is in `apps/app_name`, set it to `apps/app_name/deploy`.
            - **Install Command:** `sh vercel.install.sh`. Leave the **Build Command** and **Output Directory** to `vercel.json` (do not override them in the dashboard).
            - Enable **"Include files outside the root directory in the Build Step"** — the Lowdefy config usually lives in the parent of `deploy/`.

            ###### Public files

            Files in your app's `public/` directory (favicon, icons, images, `manifest.webmanifest`, etc.) are copied into `dist/client` by Vite during the build and served by the Vercel CDN — no extra configuration needed.

            ###### Secrets and environment variables

            Secrets can be set in the Environment Variables settings section by creating environment variables prefixed with `LOWDEFY_SECRET_`. Use `AUTH_SECRET` (and `AUTH_URL` for OAuth) for authentication. Different secrets can be set for production and preview deployments.

            > The function runs on Vercel's Node.js runtime. Streaming agent responses (`/api/agent/*`) are subject to Vercel's function response and duration limits — for heavy streaming or agent workloads, a long-lived Node host (Docker, Fly.io, Railway, Render) running `node src/index.js` may suit better.

            All other Vercel configuration like domain names, preview deploy branches, serverless regions and redirects can be configured as desired.
