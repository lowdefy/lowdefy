_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: agent-external-api
    pageTitle: External API
    section: Agents
    filePath: agents/external-api.yaml
    content:
      - id: md1
        type: MarkdownWithCode
        properties:
          content:
            _nunjucks:
              on:
                version:
                  _ref: version.yaml
              template: |
                Agents can be called from outside your app over HTTP — from scripts, backend services, or other AI systems — without a page or the AgentChat block. The external agent API is a single route:

                ```
                POST /api/agents/{agentId}
                ```

                > **Agents are public by default.** Like pages and API endpoints, an agent without auth configuration is public — and this route makes public agents callable by anyone on the internet, spending your model tokens. Protect agents with `auth.agents` before deploying (see below).

                ## Request

                The request body carries the conversation as an array of UIMessages, the same format the AgentChat block sends:

                ```bash
                curl -X POST https://myapp.com/api/agents/support-bot \
                  -H "Content-Type: application/json" \
                  -H "X-API-Key: $MY_API_KEY" \
                  -d '{
                    "messages": [
                      { "role": "user", "parts": [{ "type": "text", "text": "How do I reset my password?" }] }
                    ]
                  }'
                ```

                ## Response Formats

                The `Accept` header selects the response representation:

                - **Plain text stream** (default): the agent's reply streams back as `text/plain` — ideal for scripts and simple integrations.
                - **UIMessage SSE** (`Accept: text/event-stream`): the full AI SDK UIMessage protocol as server-sent events — tool calls, data parts, and message structure included. Use this to drive a custom chat UI.

                In the plain text format, tools that are configured with `confirm: true` execute automatically — there is no client to resolve an approval.

                ## Authentication

                External callers authenticate with an [API auth strategy](/auth-configuration) — an API key or a JWT Bearer token configured in `auth.strategies`. The resolved caller carries the strategy's roles, which the agent's auth configuration is evaluated against.

                ```yaml
                lowdefy: {{ version }}
                auth:
                  secret:
                    _secret: AUTH_SECRET
                  strategies:
                    - id: service-keys
                      type: ApiKey
                      roles:
                        - support
                      properties:
                        keys:
                          - id: automation
                            value:
                              _secret: AUTOMATION_API_KEY
                  agents:
                    protected: true
                    roles:
                      support:
                        - support-bot
                ```

                With this configuration, a request carrying the `X-API-Key` header calls `support-bot` with the `support` role; requests without credentials receive a `401`, and callers without the role receive an opaque "Agent does not exist" error.

                Browser sessions also work — a logged-in user's session cookie authenticates requests to this route the same way it does for pages and API endpoints.

                ## Agent Authorization

                `auth.agents` protection applies to *every* way an agent can be called — the AgentChat block on a page, this external route, [MCP tools](/agent-mcp-server), [channels](/agent-channels), and `CallAgent` routine steps. See [Protected Pages and APIs](/protected-pages-apis) for the full `protected` / `public` / `roles` configuration.
