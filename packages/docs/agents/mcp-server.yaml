_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: agent-mcp-server
    pageTitle: MCP Server
    section: Agents
    filePath: agents/mcp-server.yaml
    content:
      - id: md1
        type: MarkdownWithCode
        properties:
          content:
            _nunjucks:
              on:
                version:
                  _ref: version.yaml
              template: |
                Your app can expose its API endpoints and agents as tools over the [Model Context Protocol](https://modelcontextprotocol.io) — so MCP clients like Claude Code, Claude Desktop, or any AI system can discover and call them. The MCP server is served at:

                ```
                POST /api/mcp
                ```

                > This is the app *exposing* tools to external AI. For the reverse — your agents *consuming* tools from external MCP servers — see [MCP Tools](/agent-mcp-tools).

                ## Configuration

                The top-level `mcp` block lists which endpoints and agents become tools:

                ```yaml
                lowdefy: {{ version }}
                mcp:
                  name: my-app-tools
                  endpoints:
                    - search-articles
                    - create-ticket
                  agents:
                    - support-bot
                ```

                Endpoints exposed as MCP tools must have a `description` and a `payloadSchema` — the same requirement as [endpoint tools](/agent-endpoint-tools). The payload schema becomes the tool's input schema, so MCP clients know exactly what arguments to pass. Only `Api` endpoints can be exposed; `InternalApi` endpoints are server-internal and fail the build if listed.

                Agents exposed as MCP tools must have a `description`. An agent tool takes a single `prompt` string, runs the agent headlessly to completion (tools included, `confirm` tools auto-execute), and returns the agent's final text.

                ```yaml
                agents:
                  - id: support-bot
                    type: ClaudeAgent
                    connectionId: anthropic
                    description: >
                      Answers customer support questions using the knowledge base.
                    properties:
                      model: claude-sonnet-5
                ```

                ## Authorization

                Tool visibility and execution follow the same auth rules as everything else. Unauthenticated MCP clients see only public tools. Clients that authenticate with an [API auth strategy](/agent-external-api) (`Authorization: Bearer ...` or an API key header) see and can call the tools their roles allow — `auth.api` protects endpoint tools, `auth.agents` protects agent tools.

                ## Connecting a Client

                Point any MCP client at the route using the streamable HTTP transport:

                ```json
                {
                  "mcpServers": {
                    "my-app": {
                      "type": "http",
                      "url": "https://myapp.com/api/mcp",
                      "headers": {
                        "X-API-Key": "..."
                      }
                    }
                  }
                }
                ```

                > **Note:** the dev server also serves `/lowdefy-docs/mcp` — a separate MCP endpoint with Lowdefy documentation and dev tools for AI coding agents. `/api/mcp` is your app's own tool surface and is available in production.
