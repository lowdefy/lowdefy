name: '@lowdefy/docs'
lowdefy: local
license: Apache-2.0

# Brand tokens copied from packages/website (tailwind.config.js, src/app/globals.css).
theme:
  antd:
    token:
      colorPrimary: '#1990ff'
      colorInfo: '#1990ff'
      colorLink: '#1990ff'
      borderRadius: 8
      colorBgLayout: '#f8fafc' # slate-50, the site's section bands
      colorBorder: '#e2e8f0' # slate-200
      fontFamily: 'Inter, ui-sans-serif, system-ui, sans-serif'
      fontFamilyCode: "'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace"
    darkToken:
      colorBgLayout: '#020617' # slate-950, the site's dark body
      colorBgContainer: '#0f172a' # slate-900, sections and cards
      colorBgElevated: '#1e293b' # slate-800, popovers
      colorBorder: '#334155' # slate-700
      colorBorderSecondary: '#1e293b'
    darkComponents:
      Layout:
        bodyBg: '#020617'
        headerBg: '#020617'
        siderBg: '#020617'
        triggerBg: '#0f172a'
        triggerColor: '#e2e8f0'
      Menu:
        darkItemBg: '#020617'
        darkSubMenuItemBg: '#020617'
        darkPopupBg: '#0f172a'
        darkItemSelectedBg: '#1e293b'
        darkItemHoverBg: '#0f172a'
cli:
  disableTelemetry: true
  watchIgnore:
    - public/sitemap.xml
    - public/search-index.json

plugins:
  - name: '@lowdefy/docs'
    version: 'workspace:*'

global:
  all_icons:
    _ref: blocks/all_icons.yaml
  settings_input_layout:
    span: 23
    sm:
      span: 23
app:
  html:
    appendHead:
      _ref: head.html

connections:
  - id: discord
    type: AxiosHttp
    properties:
      method: post
      url:
        _secret: DISCORD_WEBHOOK
  - id: newsletter
    type: MongoDBCollection
    properties:
      collection: newsletter
      databaseUri:
        _secret: MONGODB_URI
      read: false
      write: true
  - id: feedback
    type: MongoDBCollection
    properties:
      collection: feedback
      databaseUri:
        _secret: MONGODB_URI
      read: false
      write: true
  - id: companies
    type: MongoDBCollection
    properties:
      collection: example-companies
      databaseUri:
        _secret: MONGODB_URI
      read: false
      write: false
  - id: files
    type: AwsS3Bucket
    properties:
      accessKeyId:
        _secret: UPLOADS_S3_ACCESS_KEY_ID
      secretAccessKey:
        _secret: UPLOADS_S3_SECRET_ACCESS_KEY
      region:
        _secret: UPLOADS_S3_REGION
      bucket:
        _secret: UPLOADS_S3_BUCKET
      write: false
      read: false
menus:
  _ref: menus.yaml

pages:
  _ref:
    path: pages.yaml
    transformer: templates/generateSiteAssets.js
    vars:
      menus:
        _ref: menus.yaml
