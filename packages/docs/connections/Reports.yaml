_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: Reports
    pageTitle: Reports
    section: Connections
    filePath: connections/Reports.yaml
    content:
      - id: markdown
        type: MarkdownWithCode
        properties:
          content:
            _nunjucks:
              on:
                version:
                  _ref: version.yaml
              template: |
                The `Reports` connection renders a page of your app to a PDF or an Excel workbook on the server. It is provided by the `@lowdefy/plugin-reports` plugin, which must be declared in your `lowdefy.yaml`:

                ```yaml
                lowdefy: {{ version }}
                plugins:
                  - name: '@lowdefy/plugin-reports'
                    version: {{ version }}
                ```

                See the [Reports](/generating-reports) concept page for how a page is rendered, which blocks are supported, and how to control the output with the `report` block key.

                ## Connections

                Connection types:
                  - Reports

                ### Reports

                The `Reports` connection takes no properties. It exists so that the `RenderReport` request has a connection to belong to.

                #### Properties

                The connection does not take any properties.

                #### Examples

                ###### Declare the connection:
                ```yaml
                connections:
                  - id: reports
                    type: Reports
                ```

                ## Requests

                Request types:
                  - RenderReport

                ### RenderReport

                Render one page as a document. The page is evaluated headlessly, exactly as the browser evaluates it: `onInit` and `onInitAsync` run, requests fire, and the evaluated block tree is walked into the document. The response is a file envelope that can be handed to the [`DownloadFile`](/DownloadFile) action, or to an email connection in an API endpoint.

                Only the pages the calling session may open can be rendered. An unknown page and an unauthorised page fail with the same error, so a report can never reveal which pages exist. In a scheduled, webhook, or detached API endpoint the render runs as a system context and any page that reads `_user` fails fast: pass explicit parameters through the endpoint payload instead.

                #### Properties

                - `pageId: string`: __Required__ - The id of the page to render.
                - `format: enum`: Default: `'pdf'` - The output format. Options are:
                  - `'pdf'`
                  - `'xlsx'` - one worksheet per data grid block on the page (AgGrid). A page without a grid fails.
                - `filename: string`: The download filename. Defaults to the page id plus the format extension.
                - `urlQuery: object`: The url query snapshot seeded into the headless render before `onInit`, so `_url_query` resolves as it did for the caller.
                - `input: object`: The page input snapshot seeded before `onInit`.
                - `state: object`: The page state snapshot seeded before `onInit`.

                #### Response

                A file envelope:

                - `name: string`: The filename.
                - `size: number`: The file size in bytes.
                - `type: string`: The content type, `application/pdf` or `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`.
                - `content: string`: The file bytes, base64 encoded.

                #### Examples

                ###### Download the current page as a PDF, keeping the viewer's state:
                ```yaml
                requests:
                  - id: render_pdf
                    type: RenderReport
                    connectionId: reports
                    properties:
                      pageId: sales-dashboard
                      format: pdf
                      filename: sales.pdf
                      urlQuery:
                        _url_query: true
                      state:
                        _state: true
                blocks:
                  - id: download
                    type: Button
                    properties:
                      title: Download PDF
                    events:
                      onClick:
                        - id: render
                          type: Request
                          params: render_pdf
                        - id: save
                          type: DownloadFile
                          params:
                            _request: render_pdf
                ```

                ###### Export the page's grids to Excel:
                ```yaml
                requests:
                  - id: render_xlsx
                    type: RenderReport
                    connectionId: reports
                    properties:
                      pageId: sales-dashboard
                      format: xlsx
                ```

                ###### Email a report every Monday from a scheduled API endpoint:
                ```yaml
                api:
                  - id: weekly_report
                    type: Api
                    schedule:
                      - cron: '0 7 * * 1'
                        payload:
                          region: EMEA
                    routine:
                      - id: render
                        type: Request
                        params: render_weekly
                      - id: send
                        type: Request
                        params: send_weekly
                requests:
                  - id: render_weekly
                    type: RenderReport
                    connectionId: reports
                    properties:
                      pageId: weekly-summary
                      input:
                        region:
                          _payload: region
                  - id: send_weekly
                    type: SendGridMailSend
                    connectionId: sendgrid
                    properties:
                      to: team@example.com
                      subject: Weekly summary
                      text: The weekly summary is attached.
                      attachments:
                        - filename:
                            _step: render.response.name
                          type:
                            _step: render.response.type
                          content:
                            _step: render.response.content
                ```
