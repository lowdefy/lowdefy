_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: connections-reference
    pageTitle: Connections
    filePath: connections/index.yaml
    content:
      - id: intro
        type: Markdown
        properties:
          content: |
            Connections integrate your app with databases, APIs, and services; requests execute against them server-side. All 19 connections, grouped by type. See [Connections and Requests](/connections-and-requests) for the model.
      - id: section_sql_title
        type: Title
        properties:
          content: SQL
          level: 3
      - id: section_sql_tagline
        type: Paragraph
        style:
          color: var(--ant-color-text-secondary)
        properties:
          content: Relational databases.
      - id: section_sql_grid
        type: Box
        layout:
          gap: 12
        blocks:
          - id: card_mysql
            type: Card
            layout:
              flex: 0 1 auto
            style:
              cursor: pointer
            properties:
              size: small
            events:
              onClick:
                - id: link_mysql
                  type: Link
                  params:
                    pageId: MySQL
            blocks:
              - id: card_mysql_label
                type: Html
                properties:
                  html: '<b>MySQL</b>'
          - id: card_mariadb
