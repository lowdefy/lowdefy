_ref:
  path: templates/operators.yaml.njk
  transformer: templates/operatorsMethodTransformer.js
  vars:
    pageId: _prop
    pageTitle: _prop
    filePath: operators/_prop.yaml
    types: |
      ```
      (key: string): any
      (all: boolean): any
      (arguments: {
        all?: boolean,
        key?: string,
        default?: any,
      }): any
      ```
    description: |
      The `_prop` operator reads a value from the props of the component instance whose body it appears in. Props are declared on the component (`components/<name>.yaml` under `props:`) and supplied at the use site (`props:` on the block that instantiates the component). Unlike a `_ref` `_var`, which is substituted at build time and untyped, a prop's value is a runtime expression evaluated in the use site's scope — so one component definition serves every row of a List, each instance reading its own props.

      `_prop` is only meaningful inside a component body and inside the params of an action a component body triggers. It is not available server-side: a component's inner request cannot read `_prop` — pass the value through the Request action's `payload` and read `_payload` in the request instead.

    arguments: |
      ###### string
      If `_prop` is called with a string argument, the value of that prop is returned. Dot notation is supported for object props. If the prop is not found, `null` is returned.

      ###### boolean
      If `_prop` is called with boolean argument `true`, the entire props object is returned.

      ###### object
        - `all: boolean`: If `all` is `true`, the entire props object is returned. One of `all` or `key` is required.
        - `key: string`: The value of the prop is returned. One of `all` or `key` is required.
        - `default: any`: A value to return if the prop is not found. By default `null` is returned.
    examples: |
      ###### Read a prop by name:
      ```yaml
      _prop: result
      ```
      Returns: The value of the `result` prop of the enclosing component instance.

      ###### Read a nested object prop:
      ```yaml
      _prop: user.name
      ```

      ###### Read all props:
      ```yaml
      _prop: true
      ```
