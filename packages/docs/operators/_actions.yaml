_ref:
  path: templates/operators.yaml.njk
  transformer: templates/operatorsMethodTransformer.js
  vars:
    pageId: _actions
    pageTitle: _actions
    filePath: operators/_actions.yaml
    env: Client Only
    types: |
      ```
      (key: string): any
      (all: boolean): any
      (arguments: {
        all?: boolean,
        key?: string,
        default?: any,
      }): any
      ```
    description: |
      The `_actions` operator returns the response value for a preceding action in the same event list.

      The action response object has the following structure:
      ```yaml
      error: Error,
      index: number,
      response: any,
      skipped: boolean,
      type: string,
      ```

      Actions the event does not execute for a control-flow reason — actions in an untaken [`:if`](/:if) branch, in an unmatched [`:switch`](/:switch) case, or after a [`:return`](/:return) — are recorded as `skipped: true`, the same as actions skipped by their own `skip` field. Their operators are not evaluated, and `_actions` lookups on them return the skipped response object. A control records the skipped entries for its untaken branches once it completes, so an action inside the taken branch cannot yet read the skipped entries of a sibling branch — only actions after the control can.
    arguments: |
      ###### string
      If the `_actions` operator is called with a string equal to a preceding action id in the same event list, the action response object returned. If a string is passed which does not match preceding action id in the same event list, `null` is returned. Dot notation is supported.

      ###### boolean
      If the `_actions` operator is called with boolean argument `true`, an object with all the preceding action id responses in the same event list is returned.

    examples: |
      ##### Using a action response:
      ```yaml
      _actions: my_action.response
      ```
      Returns: The response returned by the action.

      ##### Setting a action response to `state`:
      ```yaml
      id: refresh
      type: Button
      events:
        onClick:
          - id: get_fresh_data
            type: Request
            skip:
              _state: should_not_fetch
            params: get_data
          - id: set_data
            type: SetState
            params:
              did_not_fetch_data:
                _actions: get_fresh_data.skipped
      ```
