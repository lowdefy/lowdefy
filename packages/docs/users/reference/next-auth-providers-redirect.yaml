# Redirect stub — the page moved to /auth-js-providers when the auth engine
# moved to Auth.js. Keeps existing deep links working.
id: next-auth-providers
type: Box
events:
  onInit:
    - id: redirect_to_auth_js_providers
      type: Link
      params: auth-js-providers
blocks:
