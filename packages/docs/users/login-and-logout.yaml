_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: login-and-logout
    pageTitle: Login and Logout
    section: User Authentication
    filePath: users/login-and-logout.yaml
    content:
      - id: content
        type: MarkdownWithCode
        properties:
          content: |
            The [`Login`](/Login) and [`Logout`](/Logout) actions can be used to log users in and out.

            ## Login

            The `Login` action is used to start the user login flow. If only one OAuth provider is configured, or the `Login` action is called with a `providerId`, the `Login` action requests the Provider's authorization URL from the Lowdefy server, and redirects the user to this URL. Otherwise, the action redirects the user to a page where the user can choose which provider to use to sign in.

            The authorization url usually hosts a page where the user can input their credentials. After the user has logged in successfully, the user is redirected to the `/api/auth/callback/<provider_id>` route in the Lowdefy app, where the rest of the authorization code flow is completed. This URL usually needs to be configured in the identity provider's settings.

            The `callbackUrl` parameter of the Login action specifies where the user lands after login is complete. Three sources are consulted, in order: the `callbackUrl` param, then the `?callbackUrl=` query parameter Lowdefy sets when it redirects an unauthenticated user to the sign-in page, then the app's home page. If none resolves the action throws, rather than staying silently on the sign-in page.

            In a protected app a signed-out visitor is sent to the sign-in page for every URL, present or absent, so a `404` means you are signed in — see [Page and API existence](/auth-upgrade#page-and-api-existence-is-no-longer-observable-before-you-sign-in).

            To sign in without navigating at all - a login form in a modal, or an embedded panel - set `callbackUrl: false`. This is not valid for magic-link or social/OAuth sign-in, which redirect through a hop Lowdefy does not control.

            The parameters are:
            - `authUrl: object`:
              - `urlQuery: object`: Query parameters to set for the authorization URL.
            - `callbackUrl: object | false`: Set to `false` to sign in without navigating. As an object:
              - `home: boolean`: Redirect to the home page after the login flow is complete.
              - `pageId: string`: The pageId of the page to redirect to after the login flow is complete.
              - `url: string`: The URL to redirect to after the login flow is complete. An absolute URL is not `basePath`-prefixed, so it can be an external landing page.
              - `urlQuery: object`: The urlQuery to set for the page the user is redirected to after login.
            - `providerId: string`: The ID of the provider that should be used for login. If not set and only one provider is configured the configured provider will be used. Else the user will be redirected to a sign in page where they can choose a provider.

            ## Examples

            ###### A login page that redirects users in the onMount event:
            ```yaml
            id: login
            type: Box
            events:
              onMount:
                # Redirect to "page1" if user is already logged in.
                - id: logged_in_redirect
                  type: Link
                  skip:
                    _eq:
                      - _user: sub
                      - null
                  params:
                    pageId: page1
                # Call the Login action to log the user in.
                - id: login
                  type: Login
                  skip:
                    _ne:
                      - _user: sub
                      - null
                  params:
                    # Redirect to "page1" after login is complete.
                    callbackUrl:
                      pageId: page1
            ```

            ###### A set of login and logout buttons:
            ```yaml
            id: login_logout
            type: Box
            blocks:
              - id: Login
                type: Button
                visible:
                  _eq:
                    - _user: sub
                    - null
                events:
                  onClick:
                    - id: login
                      type: Login
              - id: Logout
                type: Button
                visible:
                  _ne:
                    - _user: sub
                    - null
                events:
                  onClick:
                    - id: logout
                      type: Logout
            ```

            ###### A signup button that uses `authUrl.urlQuery` to request the signup screen:
            ```yaml
            id: Signup
            type: Button
            events:
              onClick:
                - id: signup
                  type: Login
                  params:
                    authUrl:
                      urlQuery:
                        screen_hint: signup
            ```

            ## Magic link sign-in

            `Login` with `magicLink: true` emails the user a sign-in link. By default that link points straight at Better Auth's verify endpoint, which consumes the single-use token on the first `GET` of the URL.

            That is a problem in corporate inboxes. Mail security products — Microsoft Defender Safe Links, Proofpoint URL Defense, Mimecast — fetch every link in a message as it is delivered, so the scanner spends the token minutes before the person clicks, and the person lands on the error page with `INVALID_TOKEN`.

            Set [`auth.authPages.magicLink`](/auth-configuration#auth-pages) to a page in your app to close that gap. The email then links to your page, carrying the token and the callback destinations on its URL query, and a [`MagicLinkVerify`](/MagicLinkVerify) action on a **button click** walks to the verify endpoint. Fetching the landing page does nothing, so a scanner cannot consume the token.

            ```yaml
            lowdefy: {{ version }}
            auth:
              magicLink:
                enabled: true
              authPages:
                magicLink: /magic-link
            ```

            ```yaml
            id: magic-link
            type: PageHeaderMenu
            blocks:
              - id: content
                type: Box
                blocks:
                  - id: title
                    type: Title
                    properties:
                      content: Sign in
                      level: 3
                  - id: description
                    type: Paragraph
                    properties:
                      content: Click the button below to finish signing in.
                  - id: verify_button
                    type: Button
                    properties:
                      title: Sign in
                    events:
                      onClick:
                        - id: verify
                          type: MagicLinkVerify
            ```

            The landing page must be reachable while signed out, so add it to `auth.pages.public`.

            Do **not** run `MagicLinkVerify` in the page's `onMount`, and do not auto-redirect to the verify endpoint. Some scanning sandboxes render the page and execute its JavaScript, so an automatic verify hands the token back to the scanner and you are no better off than linking at the endpoint directly. The whole protection is that a human has to click.

            The action needs no parameters: the token and the `callbackURL`, `newUserCallbackURL` and `errorCallbackURL` values are read from the landing page's own URL query, which the email put there. Pass parameters only to override them.

            ## Email code sign-in

            With `auth.emailOTP` enabled the app can sign a person in with a code emailed to them. Unlike a magic link, the code is typed into the tab they started from — so it survives corporate mail security that pre-fetches links (and consumes the single-use link token), and it works when the email is read on another device.

            Two actions drive it:

            - [`EmailOtpSend`](/EmailOtpSend) sends the code to an email address.
            - [`EmailOtpVerify`](/EmailOtpVerify) signs the person in with the code they typed.

            `EmailOtpVerify` lands the user through the same three sources as `Login`: the `callbackUrl` param, then the `?callbackUrl=` query, then the app's home page. `callbackUrl: false` verifies without navigating — it is a plain JSON sign-in with no redirect hop, so staying put is valid here.

            ### With magic link, one email carries both

            When `auth.magicLink` is enabled alongside `auth.emailOTP`, the magic-link email also carries the code, so one email serves both paths. Keep using `Login` with `magicLink: true` to send it — no change is needed — and offer `EmailOtpVerify` on the same page for people whose link does not work. `EmailOtpSend` is then only needed for a code-only page, where no link is offered at all.

            ###### A sign-in page offering a code:
            ```yaml
            id: email-code-login
            type: Box
            blocks:
              - id: email
                type: TextInput
                required: true
                properties:
                  title: Email
              - id: send_code
                type: Button
                properties:
                  title: Send code
                events:
                  onClick:
                    - id: validate
                      type: Validate
                      params:
                        regex: ^email$
                    - id: send
                      type: EmailOtpSend
                      params:
                        email:
                          _state: email
                    - id: sent
                      type: DisplayMessage
                      params:
                        content: Check your email for the sign-in code.
              - id: otp
                type: TextInput
                properties:
                  title: Sign-in code
              - id: sign_in
                type: Button
                properties:
                  title: Sign in
                events:
                  onClick:
                    - id: verify
                      type: EmailOtpVerify
                      params:
                        email:
                          _state: email
                        otp:
                          _state: otp
            ```

            An expired, mistyped or already-used code is the auth server rejecting the attempt, not an app fault: the action throws a `UserError`, so `onClick` `catch` actions run and the message displays, but nothing is reported to the server.

            ## SMS sign-in

            `PhoneNumberVerify` completes a sign-in with an SMS code, and lands the user through the same three sources as `Login`: the `callbackUrl` param, then the `?callbackUrl=` query, then the app's home page. `callbackUrl: false` verifies without navigating.

            Two modes are exempt, because neither ends with the user arriving somewhere new:

            - `disableSession: true` creates no session to arrive with.
            - `updatePhoneNumber: true` is a signed-in user confirming a new number. They already had a session, and the confirmation usually runs in a modal a navigation would yank them out of.

            ### Carrying the destination to a separate SMS form

            The `?callbackUrl=` query is read from the page the action runs on, and the unauthenticated bounce puts it on `authPages.signIn`. If your SMS form lives on its own page, the link that gets the user there has to carry the parameter, or the destination falls back to the home page:

            ```yaml
            - id: to_phone_login
              type: Link
              params:
                pageId: phone-login
                urlQuery:
                  _if:
                    test:
                      _eq:
                        - _url_query: callbackUrl
                        - null
                    then: null
                    else:
                      callbackUrl:
                        _url_query: callbackUrl
            ```

            The `_if` is what keeps a user who reached the sign-in page directly from being sent to `/phone-login?callbackUrl=null` — `urlQuery` serialises a null value rather than dropping the key.

            ## Logout

            When the `Logout` action is called, the user data and authorization cookies are cleared by the app.

            The `callbackUrl` parameter of the Logout action specifies where the user lands after logout is complete. Unlike the `Login` action it has no default and does not read the `?callbackUrl=` query: with no `callbackUrl` the page is reloaded and the server re-applies the page's auth rules, which sends a signed-out user off a protected page to the sign-in page.

            The parameters are:
            - `callbackUrl: object`:
              - `home: boolean`: Redirect to the home page after the logout flow is complete.
              - `pageId: string`: The pageId of the page to redirect to after the logout flow is complete.
              - `url: string`: The URL to redirect to after the logout flow is complete. An absolute URL is not `basePath`-prefixed, so it can be an external logout landing page.
              - `urlQuery: object`: The urlQuery to set for the page the user is redirected to after logout.
            - `redirect: boolean`: If set to `false` the user session will be cleared, but the page will not be reloaded.


            #### Examples

            ###### Redirect to the `logged-out` page in the app after logout:
            ```yaml
            id: Logout
            type: Button
            events:
              onClick:
                - id: logout
                  type: Logout
                  params:
                    callbackUrl:
                      pageId: logged-out
            ```

