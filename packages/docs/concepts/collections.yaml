_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: collections
    pageTitle: Collections
    section: Concepts
    filePath: concepts/collections.yaml
    content:
      - id: md1
        type: MarkdownWithCode
        properties:
          content: |
            A connection names the collection it addresses, but nothing on a connection records what a document in that collection contains, which field points at which other collection, or that two connections address the same collection. The optional, app-level `collections` object writes that down once.

            A collection is a property of the database, not of a connection: one collection is routinely addressed by several connections (a read-only one, a writing one, a shared-catalogue one), so it is declared once at the root of `lowdefy.yaml`, keyed by collection name, and the build joins it to every connection whose `properties.collection` names it.

            ```yaml
            collections:
              answers:
                tenant: organization_id          # or: shared
                fields:
                  test_id: string
                  result: { enum: [pass, fail, partial, na] }
                  evidence_ids: [string]
                  superseded: boolean
                  created_at: date
                required: [test_id, result]
                relations:
                  test_id: tests._id
                  evidence_ids: evidence._id
                indexes:
                  - keys: { organization_id: 1, test_id: 1 }
                    options: { unique: true }
              controls:
                tenant: shared
                fields: { title: string, framework_id: string }
            ```

            Every key inside a collection is optional. Anything other than `tenant`, `fields`, `required`, `relations` and `indexes` is a build error.

            ## Schema

            - `tenant: string`: Either `shared` for a collection that carries no tenant field and is read across organizations, or the name of the top-level field the [tenant wall](/organizations) stamps and matches. A connection's `tenant` takes the same bare-string grammar; the build normalises both to one internal model.
            - `fields: object`: A map of field name to type. A field is [JSON Schema](https://json-schema.org/), written with the same shorthand every other Lowdefy schema surface accepts (a page's `state:`, an endpoint's `payloadSchema` and `responseSchema`, a block's `meta.properties`). Each value takes one of three forms, all expanded to a plain JSON Schema fragment:
              - A type name: `string`, `number`, `integer`, `boolean`, `date`, `object` or `array`. `date` expands to `{ type: string, format: date-time }` - a date is its serialized ISO-8601 form on every surface.
              - A one-element array shorthand, `[string]`, for an array of that type: `{ type: array, items: { type: string } }`.
              - An object of JSON Schema keywords: `type`, `enum`, `items`, `properties` and `description`. A bare `enum` infers no type; `properties` declares a nested object shape.

              An unknown type name is a build error listing the accepted names. There is no `objectId` type: a validator cannot check a constructor it does not know, so declare an `ObjectId` field as `object` or leave it undeclared.
            - `required: array`: The names of the fields a document must carry, the JSON Schema array form - `required: [test_id, result]`. A `required: true` beside a field's type is still accepted for one release and folded into this array with a build warning naming the new form; it will be removed in the next major version.
            - `relations: object`: A map of field name to `"<collection>.<field>"`. The target collection must be declared, and the target field must be one of its declared fields unless the target declares no `fields` at all.
            - `indexes: array`: Each entry has a `keys` object and an optional `options` object, in the MongoDB `createIndex` shape. The shape is validated and passed through. **Declaring an index does not create it** - a migration does, with a [`MongoDBCreateIndexes`](/MongoDB#mongodbcreateindexes) step. `lowdefy check` compares the declared entries against the queries the app actually authors and names the ones that are missing; see [Index candidates](#index-candidates).

            ## Tenancy agreement

            When a collection declares `tenant` and a connection joined to it declares `tenant` too, they must agree: both `shared`, or both the same field. Disagreement is a build error at the connection:

            ```
            Connection "org-scope" is tenant-scoped on "organization_id" but collection "controls" is declared shared. One of the two is wrong — a scoped read of a shared collection matches nothing.
            ```

            A connection that declares no `tenant` of its own against a collection that does is not an error - it may deliberately be an admin path - but `lowdefy check` reports it.

            A collection declared `tenant: shared` is also authoritative for the `tenant-lookup` check: an aggregation on a tenant-scoped connection that `$lookup`s or `$unionWith`s a shared collection fails the build even when no connection for that collection exists in the app.

            ## Checks

            `lowdefy check` runs these notes, all silent when the app declares no `collections` at all, each under its own slug so suppressing one never hides another:

            - `collections-undeclared`: a connection addresses a collection the app does not declare - the contract is opt-in, so this is a gap, not a fault;
            - `collections-dynamic`: a connection names its collection with an operator, so it cannot be joined to the declaration and opts out of the tenancy agreement, `tenant-lookup` and data model checks;
            - `collections-untenanted`: a connection with no `tenant` addresses a collection declared with a tenant field;
            - `collections-field-migration`: a field declared `required` that no migration file names;
            - `collections-index`: a query the app authors that no declared index covers - see [Index candidates](#index-candidates).

            Suppress one on a connection or a request with `~ignoreBuildChecks: [<slug>]`.

            ## Index candidates

            An index that is not written down is an index something else can remove. The `collections-index` check reads the queries the app itself authors - every page request and every request step in an endpoint routine on a connection bound to a declared collection - and reports the key sets no declared `indexes` entry covers:

            ```
            Collection "answers" is queried with equality on organization_id, status with a sort on created_at by request "get_answers" on page "list", and no declared index covers it. Declare it under collections.answers.indexes as { keys: { organization_id: 1, status: 1, created_at: -1 } } and create it with a MongoDBCreateIndexes step in a migration. Nothing is dropped for you — an index is removed by hand, and only when no query needs it.
            ```

            What it reads: the `query` and `filter` of any request, its `options.sort`, and the leading run of `$match` and `$sort` stages of a `pipeline` (once a `$group` or `$project` has rewritten the documents, no index on the collection can serve what follows). A `$lookup` becomes a candidate on the collection it joins *from*, on its `foreignField`, which is the join that scans once per input document.

            How the suggestion is ordered: equality fields first, then the sort, then the ranges - the order MongoDB can walk a compound index in. The tenant field is included when the [tenant wall](/organizations) will merge it into the filter at runtime, because the index the database is asked for has a key the config does not show.

            What counts as covered: a declared index whose leading keys are the candidate's equality fields, in any order, followed by the candidate's sort keys in the index's own order. A longer index still covers a shorter query - a query on `{ status }` is served by an index on `{ status, created_at }`. Ranges are not required to be in the index.

            Two things are reported at `debug` rather than as warnings, and appear only with `--log-level debug`:

            - a single-field equality on a key-shaped field name (`*_id`, `*_key`, `email`, `slug`, ...), which is almost always a point lookup the author will index deliberately, often `unique: true`;
            - a declared index that no query in this app uses. It may be serving a report, a backup job or another application, so it is a note, never a warning, and never a suggestion to drop it.

            The check runs offline. It cannot read the collection's real indexes, its size or its cardinality, so it is a heuristic and always a warning - a small collection needs no index at all, and a suggestion may be redundant with one you keep in the database by hand. Suppress a false positive on the request with `~ignoreBuildChecks: [collections-index]`.

            ### Why nothing is ever dropped

            The incident this check exists for is an automated tool removing an index the app still needed: a de-duplication index disappeared and a bulk job that used to finish ran into a twenty-minute timeout. So Lowdefy offers no request type that drops an index, and never suggests dropping one. An index the app does not query may be the one an external consumer depends on, and a build check that has never seen the database is in no position to say otherwise. Removing an index is a hand operation against the database, taken with the knowledge of who else reads it.

            ## The build artifact

            The build always writes `build/collections.json`, as `{}` when nothing is declared, so downstream tooling never needs a fallback:

            ```json
            {
              "answers": {
                "tenant": { "field": "organization_id" },
                "fields": {
                  "test_id": { "type": "string" },
                  "evidence_ids": { "type": "array", "items": { "type": "string" } }
                },
                "required": ["test_id"],
                "relations": { "test_id": { "collection": "tests", "field": "_id" } },
                "indexes": [{ "keys": { "organization_id": 1, "test_id": 1 }, "options": { "unique": true } }],
                "connections": [
                  { "connectionId": "answers_rw", "read": true, "write": true, "tenant": { "field": "organization_id" } }
                ]
              }
            }
            ```

            Each joined connection records its `read` and `write` flags (the connection's literal `read` / `write` properties, defaulting like `MongoDBCollection` to read on and write off) and its own `tenant` declaration.

            ## Validation on write

            When a collection declares `fields`, every MongoDB write request on a connection addressing that collection is checked against them before the driver is called. The check runs in the connection: the API layer resolves the contract from `build/collections.json` by the *evaluated* `properties.collection` of the connection - so a collection named by an operator is still covered - and hands it to the request type beside the tenant verdict. There is no caller opt-in and nothing to configure; declaring `fields` turns it on, and a collection without `fields` (or one that is not declared) is written exactly as before.

            What is validated:

            - `MongoDBInsertOne`, `MongoDBInsertMany`, `MongoDBInsertConsecutiveId` and `MongoDBInsertManyConsecutiveIds` check each inserted document.
            - `MongoDBUpdateOne`, `MongoDBUpdateMany` and `MongoDBVersionedUpdateOne` check the values of `$set` and `$setOnInsert`, resolving dotted keys (`evidence_ids.0`, `tags.$[el]`) into the field's `items`; the operands of `$push` and `$addToSet` (including every element of a `$each`) against the field's `items`; and refuse a `$unset` of a field named in `required`. An update run with `upsert: true` also checks that every `required` field is named by the filter, `$set` or `$setOnInsert`, since that is the one update shape that creates a document. Other update operators (`$inc`, `$mul`, `$rename`, ...) express deltas over the stored value rather than the shape it will hold, and an aggregation-pipeline update is opaque, so they are not checked. `MongoDBVersionedUpdateOne` also checks the version copy it re-inserts.
            - `MongoDBBulkWrite` checks each operation by kind: `insertOne` documents and `replaceOne` replacements as documents, `updateOne` and `updateMany` as updates. Deletes carry no shape.

            Rules:

            - **Undeclared fields pass.** A declaration describes the fields it knows about; rejecting the rest would break every write that adds a field before the declaration catches up. There is no `additionalProperties: false`.
            - `null` passes for any field that is not `required` - it is how a field is cleared (`$set: { closed_at: null }`), and the shorthand has no way to say `[string, null]`.
            - A field named in `required` must be present and non-null in an insert or replacement document, cannot be `$unset`, and must be named by an upserting update. Presence is not checked on a non-upserting update. The tenant wall stamps its field before validation runs, so a contract may declare the tenant field required.
            - A `date` field is `{ type: string, format: date-time }` and passes on a real `Date`: the driver's `Date` is rendered as its ISO string before the check, so one spelling of `date` works on both sides of the serialize boundary. There is no `objectId` type; an `ObjectId` instance passes a field declared `object`.
            - Reads are not validated. A document already in the database that violates the contract is a migration concern, not a request error.
            - **This is a typo net for the common write shapes, not an invariant.** It checks the values a write states outright. It cannot see an aggregation-pipeline update, `$rename`, a document written by another application, or a document that predates the declaration, and it never rejects an undeclared key. Treat a passing write as "nothing obviously wrong was stated", not as "the collection matches the contract".

            A violation is a request error naming the field, the expectation and the value, so the write that is wrong (or the declaration that is) can be fixed without reading the collection:

            ```
            Field "result" in an insert document for collection "answers" does not match the declared contract: must be equal to one of the allowed values (pass, fail, partial, na). Received "Pass".
            ```

            #### Why ajv in the connection and not a `$jsonSchema` validator

            MongoDB can hold a `$jsonSchema` validator on the collection itself. Lowdefy deliberately does not use it. A collection validator needs `collMod` privileges the app user may not have on a managed cluster, and it cannot be applied from a build. It also polices writes made outside Lowdefy, which sounds attractive but surfaces as an opaque `DocumentFailedValidation` driver error that names neither the field nor the value, so an agent (or a person) cannot act on it. Validating in the connection needs no database privileges, keeps the error text Lowdefy's - field, expectation, received value, and the config location of the request - and mirrors the tenant wall exactly: one place, every write, no caller opt-in. Because a violation never reaches the driver, it never overlaps with the driver error mapping.

            ## What consumes it

            - The `tenant-lookup` build check reads `tenant` to refuse scoped pipelines that join shared collections.
            - The dev server's `lowdefy_data_model` MCP tool (`GET /lowdefy-docs/data-model`) prints every collection with its fields, relations, indexes and tenant verdict, the connections addressing it, and every request, routine step and websocket that reads or writes it — see [Docs for AI Agents](/ai-agent-docs#data-model-lowdefy_data_model). It works without a declaration too, but only a declaration gives it fields and relations to print.
            - Every MongoDB write request checks documents and `$set` / `$setOnInsert` values against `fields` before the driver is called (see [Validation on write](#validation-on-write)).
            - `lowdefy check` compares the declared `indexes` against the app's own queries (see [Index candidates](#index-candidates)), and a `MongoDBCreateIndexes` step in a migration creates them - see [Migrations](/migrations#creating-indexes).
