  path: templates/general.yaml.njk
  vars:
    pageId: four-primitives
    pageTitle: The Four Primitives
    filePath: concepts/core/four-primitives.yaml
    content:
      - id: primitives_intro
        type: Markdown
        properties:
          content: |
            Every Lowdefy app is composed from four primitives. Learn these four ideas and you can read any Lowdefy app.

      - id: primitives_cards
        type: Flex
        layout:
          gap: 16
        properties:
          wrap: wrap
        blocks:
          - id: primitive_card_blocks
            type: Card
            layout:
              flex: 1 1 280px
            style:
              cursor: pointer
            properties:
              title: Blocks
              size: small
              hoverable: true
            events:
              onClick:
                - id: primitive_link_blocks
                  type: Link
                  params:
                    pageId: blocks
            blocks:
              - id: primitive_card_blocks_text
                type: Paragraph
                properties:
                  content: What the user sees. React components — inputs, tables, charts, containers — arranged into pages.
          - id: primitive_card_operators
            type: Card
            layout:
              flex: 1 1 280px
            style:
              cursor: pointer
            properties:
              title: Operators
              size: small
              hoverable: true
            events:
              onClick:
                - id: primitive_link_operators
                  type: Link
                  params:
                    pageId: operators
            blocks:
              - id: primitive_card_operators_text
                type: Paragraph
                properties:
                  content: How the app thinks. Functions written in config that read state and shape data, re-evaluated on every change.
          - id: primitive_card_actions
            type: Card
            layout:
              flex: 1 1 280px
            style:
              cursor: pointer
            properties:
              title: Actions
              size: small
              hoverable: true
            events:
              onClick:
