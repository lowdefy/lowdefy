_ref:
  path: templates/general.yaml.njk
  vars:
    pageId: plugins
    pageTitle: Plugins
    filePath: plugins/index.yaml
    content:
      - id: plugins_intro
        type: Markdown
        properties:
          content: |
            Everything in Lowdefy is a plugin — every block, operator, action, and connection
            is an npm package, and your app can install more. A browsable catalog of official
            and community plugins is coming; until then, the
            [community plugins repository](https://github.com/lowdefy/community-plugins) lists
            what the community has published.

            ## Build a plugin

      - id: plugins_cards
        type: Box
        layout:
          gap: 16
        blocks:
          - id: plugins_card_intro
            type: Card
            layout:
              flex: 1 1 280px
            style:
              cursor: pointer
            properties:
              title: Introduction
              size: small
              hoverable: true
            events:
              onClick:
                - id: plugins_link_intro
                  type: Link
                  params:
                    pageId: plugins-introduction
            blocks:
              - id: plugins_card_intro_text
                type: Paragraph
                properties:
                  content: How the plugin system works and what a plugin package contains.
          - id: plugins_card_dev
            type: Card
            layout:
              flex: 1 1 280px
            style:
              cursor: pointer
            properties:
              title: Developing plugins
              size: small
              hoverable: true
            events:
              onClick:
                - id: plugins_link_dev
                  type: Link
                  params:
                    pageId: plugins-dev
            blocks:
              - id: plugins_card_dev_text
                type: Paragraph
                properties:
                  content: Set up a workspace and develop plugins against a local app.
          - id: plugins_card_actions
            type: Card
            layout:
              flex: 1 1 280px
            style:
              cursor: pointer
            properties:
              title: Actions
              size: small
              hoverable: true
            events:
              onClick:
                - id: plugins_link_actions
                  type: Link
                  params:
                    pageId: plugins-actions
            blocks:
              - id: plugins_card_actions_text
                type: Paragraph
                properties:
                  content: Write a custom action.
          - id: plugins_card_connections
            type: Card
            layout:
              flex: 1 1 280px
            style:
              cursor: pointer
            properties:
              title: Connections
              size: small
              hoverable: true
            events:
              onClick:
                - id: plugins_link_connections
                  type: Link
                  params:
                    pageId: plugins-connections
            blocks:
              - id: plugins_card_connections_text
                type: Paragraph
                properties:
                  content: Write a custom connection and requests.
          - id: plugins_card_operators
            type: Card
            layout:
              flex: 1 1 280px
            style:
              cursor: pointer
            properties:
              title: Operators
              size: small
              hoverable: true
            events:
              onClick:
                - id: plugins_link_operators
                  type: Link
                  params:
                    pageId: plugins-operators
            blocks:
              - id: plugins_card_operators_text
                type: Paragraph
                properties:
                  content: Write a custom operator.
