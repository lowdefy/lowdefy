          showIcon: false
          message: The Lowdefy plugin system is under active development and breaking changes might be made in a minor version update.

      - id: md1
        type: MarkdownWithCode
        properties:
          content: |
            A plugin package needs to include the following:

            - A `package.json` file which declares the package and exports the plugin types.
            - A `types.js` file which exports the plugin type names.
            - Files that export all the types as named exports.
            - The code for the types exposed by the plugin package.

            ### package.json

            Lowdefy plugin packages should be an [ECMAScript module](https://nodejs.org/api/esm.html#modules-ecmascript-modules). To configure a package as an ECMAScript module, the `type` field in the `package.json` file should be set to `"module"`.

            Lowdefy uses the [`exports`](https://nodejs.org/api/packages.html#exports) package entry points to map to the `types.js` and plugin named export files.

            ```json
            {
              "name": "plugin-name",
              "version": "1.0.0",
              "type": "module",
              "exports": {
                "./actions": "./src/actions.js",
                "./auth/callbacks": "./src/auth/callbacks.js",
                "./auth/events": "./src/auth/events.js",
                "./auth/providers": "./src/auth/providers.js",
                "./blocks": "./src/blocks.js",
                "./connections": "./src/connections.js",
                "./iconSets": "./src/iconSets.js",
                "./metas": "./src/metas.js",
                "./operators/client": "./src/operators/client.js",
                "./operators/server": "./src/operators/server.js",
                "./types": "./src/types.js"
              },
              "files": ["src/*"],
              "dependencies": {}
            }
            ```

            The `./types` entry point is required, and the other entry points are only required if the package exports the corresponding types. Block packages should also export `./metas` for build-time schema generation.

            You can change your folder structure in your package, but then you need to change the `exports` entry points in the `package.json` file to match your file structure.

            ##### Compiling React for blocks

            To develop a block plugin, the React code needs to compiled before it can be used in the Lowdefy app. The [Lowdefy plugin example](https://github.com/lowdefy/lowdefy-example-plugins) has an example of this configured using SWC.

            ### types.js

            The `types.js` file declares the different types provided by the plugin package. This is used by the Lowdefy build process to map plugin types used in the Lowdefy config to plugin packages.

            The file should export an object that contains the type names (the names used in the Lowdefy config) for all the different types provided by the package.

            ###### Example with all types

            ```js
            export default {
              actions: ['Action'],
              auth: {
                callbacks: ['Callback'],
                events: ['Event'],
                provider: ['Provider'],
              },
              blocks: ['Block'],
              connections: ['Connection'],
              iconSets: ['my-icons'],
              requests: ['Request'],
              operators: {
                build: ['_build_operator', '_shared_operator'],
                client: ['_client_operator', '_shared_operator'],
                server: ['_server_operator', '_shared_operator'],
              },
            };
            ```

            `iconSets` declares icon sets, which the `./iconSets` entry point exports as data. See [Icon Sets](/plugins-icon-sets).

            The type names do not need to be hard coded, and can be generated by importing the plugin types.

            ###### Example `types.js` for connections

            ```js
            import * as connections from './connections.js';

            export default {
              connections: Object.keys(connections),
              requests: Object.keys(connections)
                .map((connection) => Object.keys(connections[connection].requests))
                .flat(),
            };
            ```

            ###### Example `types.js` for blocks

            Block packages use `extractBlockTypes` from `@lowdefy/block-utils` to derive type information from block metadata files. Each block has a `meta.js` file containing its category, icons, events, CSS keys, and property schema. These are re-exported via a `metas.js` barrel file:

            ```js
            // src/metas.js — re-export each block's metadata
            export { default as MyBlock } from './blocks/MyBlock/meta.js';
            export { default as MyOtherBlock } from './blocks/MyOtherBlock/meta.js';
            ```

            ```js
            // src/types.js — derive types from metas
            import { extractBlockTypes } from '@lowdefy/block-utils';
            import * as metas from './metas.js';

            export default extractBlockTypes(metas);
            ```

            The `extractBlockTypes` function returns `{ blocks, icons, blockMetas }` which the build pipeline uses to resolve plugin types without loading React components or heavy dependencies.

            See the [default Lowdefy block packages](https://github.com/lowdefy/lowdefy/tree/main/packages/plugins/blocks) for full examples.

            ### Named export files

            A file that exports the plugin types as named exports is needed for each kind of plugin-types. This is so that the Lowdefy server can import these directly to allow for tree shaking to reduce bundle size by excluding unused code. In the default configuration these file names correspond to the package entry point paths, for example, the files are named `actions.js`, `blocks.js`, and `operators/client.js`, but different file names and folder structures can be configured.

            ###### Example `actions.js` file
            ```js
            export { default as MyAction } from './actions/MyAction.js';
            ```

            In the Lowdefy server, the types will be imported as:
            ```js
            import { MyAction as MyAction } from 'my-plugin-package/actions';
            ```

            ### Plugin code

            Most types are written as standard Javascript functions, and blocks are written as React components. The function names should be in _CapitalCase_, except for operators which should be written in _snake_case_ and start with an underscore.

            Lowdefy uses object [destructuring](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Destructuring_assignment) to provide parameters to the type functions. These parameters include the parameters or properties defined by the user in the Lowdefy configuration. Any operators used in the configuration will be evaluated before it is passed to the type function. Other relevant metadata and helper functions are also passed to the plugin function.

            ### Lazy loading heavy blocks

            A page loads the code of every block type it uses before it renders. A block that pulls in a large library, such as a chat, a chart engine or a rich text editor, can make that code much bigger, even when the block sits in a closed drawer, an unopened tab or a modal. `createLazyBlock` from `@lowdefy/block-utils` loads such a block's implementation only when the block first mounts.

            Make a block lazy when it adds more than about 100 kB gzip to the page, **and** it is commonly off-screen at first paint or the page shows useful content without it. Otherwise keep it eager: a lazy block that is visible at first paint appears a moment later.

            Move the block's component into a file named `*.lazy.js`, and export a wrapper in its place:

            ```js
            // src/blocks/MyChart/MyChart.js - exported from blocks.js as before
            import { createLazyBlock } from '@lowdefy/block-utils';
            import meta from './meta.js';
            import MyChartFallback from './MyChartFallback.js';

            export default createLazyBlock({
              load: () => import('./MyChart.lazy.js'),
              meta,
              Fallback: MyChartFallback, // optional
            });
            ```

            - `load` returns `import()` of the implementation, whose default export is the block component. Do not import the `*.lazy.js` file statically anywhere else, or it is bundled with the page again.
            - `meta` is the block's `meta.js` object. The wrapper copies it to `.meta`.
            - `Fallback` is optional. It renders while the implementation loads and receives the same props as the block. Use it to keep the block's size, or to show the part users see first, such as a launcher button. Without it the block renders nothing until it has loaded.

            The wrapper also has a `preload()` function, which starts the load and returns its promise. A `Fallback` can call it on hover.

            The `.lazy.js` name matters. In production, the Lowdefy server prefetches the `*.lazy.js` chunks of the blocks on a page, so the code is often in the browser cache by the time the block mounts. Other dynamic imports are never prefetched.

            ###### Block methods

            Declare every method the block registers with `methods.registerMethod` in `meta.methods`:

            ```js
            // src/blocks/MyChart/meta.js
            export default {
              category: 'display',
              methods: {
                reset: 'Reset the zoom.',
                download: 'Download the chart as an image.',
              },
            };
            ```

            The wrapper registers these methods as soon as the block mounts, so `CallMethod` works before the implementation has loaded. Calls made before then wait in order and run once the implementation has registered its methods. After that, calls go straight to the block, as for any other block. A waiting call fails if the block never registers that method, if the load fails, or if the block is removed first. A method that is not declared in `meta.methods` cannot be called before the block loads, and the dev server logs a warning when the block registers it.

            Do not spread the `methods` prop (`{ ...methods }`) in a lazy block's implementation; pass it on as it is.

            ### Localizing plugin strings

            Plugins can ship locale-keyed default messages so consumers see translated strings out-of-the-box, and translate strings at runtime via `methods.translate(key, values)` in block / action code. See [i18n](/i18n) for the full plugin-author contract — `./messages` export shape, `package.json` `exports` registration, namespacing convention, and merge precedence.

